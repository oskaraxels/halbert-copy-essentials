/* Kotler PoM 19e companion - read-along design (2026-10-28). Offline, no external fonts. */
:root{--fs:19px;--bg:#ffffff;--bg2:#ffffff;--panel:#ffffff;--panel2:#f1f3f7;--ink:#1a1a1a;--muted:#5a6475;--line:#dfe3ea;--accent:#1f5fbf;--accent2:#9a5b00;
--good:#1a7f37;--goodbg:#eaf7ee;--bad:#c62828;--badbg:#fdecec;--warn:#9a5b00;--warnbg:#fff6e0;
--vink:#1d2330;--vmuted:#66728a;--vline:#c3cbe0;--vcenter:#ffffff;--vaccent:#1f5fbf;
--c-term:#6d4fc2;--b-term:#f4f0ff;--c-example:#1f6feb;--b-example:#eef5ff;--c-case:#0f766e;--b-case:#e9faf6;--c-agency:#1a7f37;--b-agency:#ecf9f0;
--c-warn:#c62828;--b-warn:#fff0ef;--c-tip:#a15c00;--b-tip:#fff7e3;--c-sum:#334155;--b-sum:#f2f5f9;--c-numbers:#c2410c;--b-numbers:#fff3ec;
--hl:#fff3b0;--side:300px;--hdr:56px;--serif:"Atkinson Hyperlegible Embedded","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--dim:#8a8f98;--now:#000000;--bar:#1f5fbf;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[data-theme=dark]{--bg:#14171d;--bg2:#1a1e26;--panel:#1d222b;--panel2:#252b36;--ink:#e6e9ef;--muted:#a3adbd;--line:#333b49;--accent:#7fb0ff;--accent2:#f0b35a;
--good:#4cc27a;--goodbg:#173326;--bad:#ff7b72;--badbg:#3a1d1d;--warn:#f0b35a;--warnbg:#3a2e14;
--vink:#e6e9ef;--vmuted:#9aa6bd;--vline:#3e485c;--vcenter:#1d222b;--vaccent:#7fb0ff;
--c-term:#b9a3ff;--b-term:#241f38;--c-example:#7fb0ff;--b-example:#18253a;--c-case:#5fd3c3;--b-case:#14302c;--c-agency:#6fd690;--b-agency:#17301f;
--c-warn:#ff8f87;--b-warn:#3a1e1e;--c-tip:#f3bd63;--b-tip:#352a14;--c-sum:#c3cddd;--b-sum:#222a36;--c-numbers:#ff9f6e;--b-numbers:#3a2416;--hl:#3d3a1c;--dim:#7c8494;--now:#ffffff;--bar:#7fb0ff}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--toph,108px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.65}
a{color:var(--accent)}button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.82em}
/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:15px;line-height:1.3}
.bar{display:flex;align-items:center;gap:10px;height:var(--hdr);padding:0 14px}
.brand{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;flex:none;width:calc(var(--side) - 28px)}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);display:grid;place-items:center;font-weight:900;color:#fff;font-size:13px;flex:none}
.ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.ttl b{color:var(--ink);margin-right:6px}
.tb-r{display:flex;gap:6px;align-items:center;flex:none}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:700;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.2}
.ib:hover{border-color:var(--accent)}
.menubtn{display:none}
.prog{height:3px;background:transparent}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
.player{display:flex;align-items:center;gap:10px;padding:4px 14px 6px calc(var(--side) + 14px);border-top:1px solid var(--line)}
.player audio{flex:1 1 auto;min-width:180px;max-width:640px;height:36px}
.player select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;max-width:260px;font-size:14px}
.player .play{min-width:38px}.fol{display:flex;gap:6px;align-items:center;color:var(--muted);white-space:nowrap;cursor:pointer}
body{padding-top:var(--toph,59px)}body.hasaudio{padding-top:var(--toph,108px)}
/* ---------- sidebar ---------- */
.side{position:fixed;left:0;bottom:0;top:var(--toph,59px);width:var(--side);overflow-y:auto;padding:14px 12px 40px 14px;border-right:1px solid var(--line);background:var(--bg2);font-size:14.5px;line-height:1.35;z-index:40}
.hasaudio .side{top:var(--toph,108px)}
.side-h{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:14px 6px 6px}
.side-h:first-child{margin-top:2px}
.tc-t{font-weight:800;margin:0 6px 8px;font-size:15px}
.tc,.tc ol{list-style:none;margin:0;padding:0}.tc ol{padding-left:14px;display:none;margin:2px 0 6px;border-left:2px solid var(--line)}
.tc li.open>ol,.tc li.l2:hover>ol{display:block}
.tc a{display:block;padding:5px 8px;border-radius:7px;text-decoration:none;color:var(--muted)}
.tc a:hover{background:var(--panel2);color:var(--ink)}
.tc a.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:700}
.tc .n{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;margin-right:2px}
.tc ol a{font-size:13.5px;padding:3px 8px}
.allch{margin-top:14px}.allch summary{cursor:pointer;font-weight:700;padding:6px}
.pl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);font-weight:800;margin:12px 6px 4px}
.cl{display:flex;gap:8px;padding:5px 8px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px}
.cl:hover{background:var(--panel2)}.cl[aria-current=page]{background:var(--panel2);color:var(--ink);font-weight:700}
.cl .n{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);background:var(--panel)}
.cl.done .n{background:var(--good);border-color:var(--good);color:#fff}.cl.off{opacity:.45}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:16px 0}
.tools a,.tools button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;text-align:center;cursor:pointer}
.scrim{display:none}
/* ---------- reading column ---------- */
main{margin-left:var(--side);padding:28px 32px 80px}
.prose{max-width:44rem;margin:0 auto}
main.wide{max-width:1100px}
.prose p,.prose li{font-family:var(--serif);line-height:1.7}
.prose p{margin:0 0 1em;max-width:49ch}
.kicker{color:var(--accent2);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.72em}
h1{font-size:2.1em;line-height:1.15;margin:.25em 0 .5em;letter-spacing:-.01em}
h1 .chn{display:block;font-size:.45em;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3em}
.lead{font-size:1.08em;color:var(--ink);border-left:4px solid var(--accent);padding-left:16px}
h2,h3{line-height:1.25}
.num{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:.25em}
.sec{margin-top:3.2em;padding-top:.6em;border-top:2px solid var(--line)}
.sh .sk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.72em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sec h2{font-size:1.7em;margin:.2em 0 .6em}
.sec h3{font-size:1.28em;margin:2.1em 0 .6em;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.sec h3 .ts{margin-left:auto}
.ts{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--accent);letter-spacing:0;text-transform:none;font-family:var(--sans)}
.ts:hover{border-color:var(--accent)}.ts.sm{font-size:12px;padding:1px 8px}
body:not(.audio-ok) .ts{display:none}
.readchk{display:inline-flex;gap:6px;align-items:center;margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;cursor:pointer;font-size:13px}
.readchk input{width:17px;height:17px;accent-color:var(--good)}
.inthis{background:var(--panel2);border-radius:10px;padding:10px 16px;margin:0 0 1.6em;font-size:.85em;line-height:1.5}
.inthis .it-h{font-weight:800}.inthis ul{margin:.3em 0 0;padding-left:1.2em}.inthis a{text-decoration:none}.inthis a:hover{text-decoration:underline}
.inthis p{margin:.2em 0;font-family:var(--sans)}
ul.pts{padding-left:1.3em;margin:0 0 1.1em}ul.pts li{margin:.35em 0}
.kt{font-weight:700;color:inherit;text-decoration:none;border-bottom:1px dotted var(--c-term)}
/* follow-along (style F): blue bar beside the narrated block, other narrated text dimmed only while audio plays with Follow along on */
.prose [data-t]:not(.ts){position:relative;transition:color .25s}
.prose .speaking:not(.ts){color:var(--now)}
.prose .speaking:not(.ts)::before{content:"";position:absolute;left:-20px;top:.15em;bottom:.15em;width:4px;border-radius:3px;background:var(--bar)}
.prose li.speaking:not(.ts)::before{left:calc(-1.2em - 12px)}
.prose aside.co.speaking:not(.ts)::before{top:0;bottom:0}
body.fa-dim .prose [data-t]:not(.speaking):not(.ts):not(h2):not(h3),body.fa-dim .prose [data-t]:not(.speaking):not(.ts):not(h2):not(h3) *{color:var(--dim)}
.fol input{appearance:none;-webkit-appearance:none;margin:0;width:36px;height:20px;border-radius:999px;background:var(--line);border:1px solid var(--muted);position:relative;cursor:pointer;flex:none;transition:background .2s}
.fol input::before{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:left .2s}
.fol input:checked{background:var(--bar);border-color:var(--bar)}.fol input:checked::before{left:18px}

/* callouts */

.co-agency{--c:var(--c-agency);--b:var(--b-agency)}.co-warn{--c:var(--c-warn);--b:var(--b-warn)}.co-tip{--c:var(--c-tip);--b:var(--b-tip)}

/* figures */
.figwrap{margin:2em 0;display:flex;justify-content:center}

.fstep{flex:1 1 110px;border-radius:10px;padding:9px;background:color-mix(in srgb,var(--c) 14%,transparent);border:2px solid var(--c);font-size:14px;line-height:1.3}

.farrow{align-self:center;color:var(--vmuted);font-size:18px}
.vflow{display:grid;gap:8px}.vstep{display:flex;gap:10px;align-items:flex-start;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);padding:8px 12px;border-radius:8px;font-size:14.5px;line-height:1.35}
.vstep span{color:var(--muted)}.vn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff!important;display:grid;place-items:center;font-weight:800;font-size:12px}
.cmpwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.cmp{border-radius:10px;padding:10px 12px;font-size:14.5px;border:2px solid}.cmp ul{margin:.4em 0 0;padding-left:1.1em}

.rows{display:grid;gap:8px}.rowchain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rnode{padding:5px 10px;border-radius:8px;background:color-mix(in srgb,var(--c) 16%,transparent);border:2px solid var(--c);font-size:14px;font-weight:600}

.splitg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.sp{border-top:5px solid var(--c);background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.35}.sp b{display:block}.sp span{color:var(--muted)}
.tblwrap{overflow-x:auto}.vtable{border-collapse:collapse;width:100%;font-size:14px}

details.practice>summary::after{content:"▸";margin-left:auto;color:var(--muted);transition:transform .2s}
details.practice[open]>summary::after{transform:rotate(90deg)}

/* flashcards */

.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:1.15em;font-weight:700;border:2px solid var(--line);overflow:auto}

.fcbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{text-decoration:none;display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;cursor:pointer;font-weight:700;color:var(--ink);font-size:15px}
.btn:hover{border-color:var(--accent)}.btn.good{background:var(--good);color:#fff;border-color:var(--good)}.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}

/* index + general pages */

.part{margin-top:2em}.part h2{font-size:1.3em;margin:0 0 .6em}.pn2{color:var(--accent2);text-transform:uppercase;font-size:.7em;letter-spacing:.08em;display:block}

.cb{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.cb b{font-size:1em}

.qa audio{width:100%}

<template id="v-index" data-cls="gen" data-title="Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Course home</b></div><div class="tb-r"><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side" aria-label="Modules"><div class="side-h">All modules</div><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="wide"><div class="kicker">Gary Halbert's copywriting course, turned into audio, drills and a portfolio workbook</div><h1>Halbert Copy Essentials</h1><p class="lead">The punch of ten classic copy sources in about 3.1 hours of narration (about 1:57:46 at 1.6×). Hopkins, Caples, Schwab, Halbert, Schwartz, Sugarman, Ogilvy and Collier, plus Meta's own creative guidance and the hook, body and CTA structure DTC agencies test with. Every module: the pillar lessons with one sharp example each and how to use them in a Meta ad or a cold email, then application questions and a playground where you write. All lessons are written in our own words; quotes are short and attributed.</p><div id="cont"></div><p><a class="btn pri" href="#m01">▶ Start with Module 1</a> <a class="btn" href="#m12">🛠️ Halbert Method workbook</a> <a class="btn" href="#m11">⌨️ Type-out pad</a> <a class="btn" href="#review">🃏 Review cards</a></p><h2>Your progress</h2><div id="prog"></div><details class="howto" open><summary>The spine: Halbert's own route to becoming a copywriter</summary><p class="muted small">From his letter <a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">"Hands On Experience"</a>. This course follows it in order.</p><ol><li><b>Read the classics, fast</b> <span class="muted">— Modules 1-9: one per book, punch only.</span></li><li><b>Copy the great ads by hand</b> <span class="muted">— Module 11: teardowns plus the type-out pad with a timer.</span></li><li><b>Reread and take notes; build a headline swipe file</b> <span class="muted">— Module 12, step 1: your swipe file, saved in this browser.</span></li><li><b>Study the product and the competition</b> <span class="muted">— Module 12, step 2-3: brief + numbered nugget notes.</span></li><li><b>Find the central selling idea</b> <span class="muted">— Module 12, step 4.</span></li><li><b>Write a fast first draft</b> <span class="muted">— Module 12, step 5: ten-minute timer.</span></li><li><b>Rework it into the 7 steps, read it aloud, tighten</b> <span class="muted">— Module 12, steps 6-8, then export it as a portfolio piece.</span></li></ol></details><details class="howto"><summary>How to use the site on your laptop</summary><ol><li>Open a module and press ▶ in the player. With <b>Follow along</b> on, the paragraph being read is highlighted and kept in view; switch it off to scroll freely. Pick <b>1.6×</b> in the speed menu (it is remembered).</li><li><b>☰ Contents</b> (key <kbd>C</kbd>) hides or shows the sidebar. <b>⛶ Focus</b> (key <kbd>F</kbd>) shows only the text and player, full screen; <kbd>Esc</kbd> exits. <kbd>P</kbd> play/pause, <kbd>J</kbd>/<kbd>L</kbd> back/forward 15 s, <kbd>[</kbd>/<kbd>]</kbd> previous/next lesson.</li><li>After the audio, do the questions (one at a time, Next button bottom-right) and the playground. Progress, answers and drafts are saved in this browser.</li></ol><p class="muted small">Audio: 12 of 12 modules, total 3:08:26.</p></details><section class="part"><h2>The foundations</h2><div class="chrows"><a class="chrow ccard" data-n="1" href="#m01"><span class="bn">1</span><span class="cb"><b>Scientific Advertising</b><span class="muted small">by Claude Hopkins · 🎧 15:43 · 9 lessons · 9 questions · 2 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="2" href="#m02"><span class="bn">2</span><span class="cb"><b>Tested Advertising Methods</b><span class="muted small">by John Caples · 🎧 15:45 · 8 lessons · 9 questions · 3 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="3" href="#m03"><span class="bn">3</span><span class="cb"><b>How to Write a Good Advertisement</b><span class="muted small">by Victor O. Schwab · 🎧 15:41 · 9 lessons · 9 questions · 3 drills</span><span class="stat"></span></span></a></div></section><section class="part"><h2>Gary Halbert</h2><div class="chrows"><a class="chrow ccard" data-n="4" href="#m04"><span class="bn">4</span><span class="cb"><b>The Gary Halbert Letter</b><span class="muted small">by Gary C. Halbert · 🎧 16:30 · 9 lessons · 10 questions · 3 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="5" href="#m05"><span class="bn">5</span><span class="cb"><b>The Boron Letters</b><span class="muted small">by Gary C. Halbert · 🎧 16:29 · 10 lessons · 9 questions · 3 drills</span><span class="stat"></span></span></a></div></section><section class="part"><h2>The big three</h2><div class="chrows"><a class="chrow ccard" data-n="6" href="#m06"><span class="bn">6</span><span class="cb"><b>Breakthrough Advertising</b><span class="muted small">by Eugene M. Schwartz · 🎧 17:34 · 10 lessons · 10 questions · 3 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="7" href="#m07"><span class="bn">7</span><span class="cb"><b>The Adweek Copywriting Handbook</b><span class="muted small">by Joseph Sugarman · 🎧 16:04 · 10 lessons · 9 questions · 3 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="8" href="#m08"><span class="bn">8</span><span class="cb"><b>Ogilvy on Advertising</b><span class="muted small">by David Ogilvy · 🎧 16:23 · 9 lessons · 10 questions · 3 drills</span><span class="stat"></span></span></a></div></section><section class="part"><h2>Letters and today&#x27;s ads</h2><div class="chrows"><a class="chrow ccard" data-n="9" href="#m09"><span class="bn">9</span><span class="cb"><b>The Robert Collier Letter Book</b><span class="muted small">by Robert Collier: tone for cold emails and letters · 🎧 7:50 · 5 lessons · 8 questions · 2 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="10" href="#m10"><span class="bn">10</span><span class="cb"><b>Modern Performance Creative</b><span class="muted small">Hook, body, call to action, and what Meta says works now · 🎧 17:17 · 9 lessons · 10 questions · 3 drills</span><span class="stat"></span></span></a></div></section><section class="part"><h2>Do the work</h2><div class="chrows"><a class="chrow ccard" data-n="11" href="#m11"><span class="bn">11</span><span class="cb"><b>Six Classic Ads, Torn Down</b><span class="muted small">From Sackheim to Halbert to Karbo · 🎧 16:43 · 8 lessons · 9 questions · 3 drills</span><span class="stat"></span></span></a><a class="chrow ccard" data-n="12" href="#m12"><span class="bn">12</span><span class="cb"><b>The Halbert Method Workbook</b><span class="muted small">Aarke and DTC briefs, turned into portfolio pieces · 🎧 16:26 · 9 lessons · 10 questions · 2 drills</span><span class="stat"></span></span></a></div></section></main></template>

ee</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 1 · Claude Hopkins · 1923</div><h1 data-t="0.30"><span class="chn">Module 1</span><span data-say>Scientific Advertising</span> <span class="h1sub" data-say>by Claude Hopkins</span></h1><div class="lead"><p data-say data-t="5.58">Halbert called Hopkins the greatest ad man who ever lived, and David Ogilvy said nobody should touch advertising until they had read this book seven times. It is short, it is free, and it is the root of everything you will do in a Meta ad account. Here are the eight lessons that matter.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 15:43</span><span>9 lessons</span><span>9 questions</span><span>2 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m01/L1"><b>1.1 An ad is a salesperson, so judge it like one.</b></a> <span class="muted">· 🎧 2:01</span></li><li><a href="#m01/L2"><b>1.2 Specifics get believed. Generalities get ignored.</b></a> <span class="muted">· 🎧 2:05</span></li><li><a href="#m01/L3"><b>1.3 Tell the story nobody else bothered to tell.</b></a> <span class="muted">· 🎧 1:46</span></li><li><a href="#m01/L4"><b>1.4 The headline picks the reader. Pick the right one.</b></a> <span class="muted">· 🎧 1:21</span></li><li><a href="#m01/L5"><b>1.5 Offer service. The best ads ask no one to buy.</b></a> <span class="muted">· 🎧 1:41</span></li><li><a href="#m01/L6"><b>1.6 Show the bright side, not the problem.</b></a> <span class="muted">· 🎧 1:23</span></li><li><a href="#m01/L7"><b>1.7 Test it. Let buyers settle the argument.</b></a> <span class="muted">· 🎧 1:26</span></li><li><a href="#m01/L8"><b>1.8 Once they are interested, tell the full story.</b></a> <span class="muted">· 🎧 1:25</span></li><li><a href="#m01/L9"><b>1.9 Worked rewrite: one weak ad, the Hopkins way.</b></a> <span class="muted">· 🎧 2:03</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.holloway.com/g/scientific-advertising" target="_blank" rel="noopener">Scientific Advertising, free public-domain edition (Holloway)</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">Halbert&#x27;s reading list (the spine of this course)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 1.1<button class="ts" data-t="25.57" title="Play the audio from here">▶ 0:26</button><label class="readchk"><input type="checkbox" data-k="1-1"> Mark as done</label></div><h2 data-t="25.57"><span class="num">1.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>An ad is a salesperson, so judge it like one.</span></h2></header><p data-say data-t="30.73">Hopkins opens with one rule that settles most arguments: advertising is salesmanship. In his words, &quot;The only purpose of advertising is to make sales.&quot; Not to keep your name in front of people. Not to win applause. Sales.</p><p data-say data-t="47.55">So the test for every line is simple. Imagine the best salesperson in the shop standing in front of one customer. Would they say this line? If a top seller would never say &quot;Elevate your everyday,&quot; it does not belong in your ad either.</p><p data-say data-t="63.10">He is blunt about entertainment, too: &quot;Ads are not written to entertain.&quot; When an ad entertains, the people it attracts are mostly people looking for fun, not buyers.</p><p data-say data-t="74.62">This is the trap of paid social. A funny video can get cheap views and lots of comments and still sell nothing, because it attracted the wrong crowd. Hopkins would look at one number first: what did each sale cost? Everything else is decoration.</p><p data-say data-t="90.85">Hopkins&#x27; test also protects you in meetings. When a client loves a line that sells nothing, you don&#x27;t have to argue taste. You can ask a neutral question: would our best salesperson say this to a buyer? It moves the discussion from opinion to selling, which is where it belongs.</p><aside class="co co-example" data-t="108.10"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The salesperson test.</div><p data-say>A sparkling-water maker writes &quot;Designed for the modern kitchen.&quot; A good salesperson in the store would instead say: &quot;If you drink a litre of bubbles a day, this saves you carrying home hundreds of bottles a year.&quot; The second line sells. The first line decorates.</p></aside><aside class="co co-agency" data-t="127.81"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before you ship any Meta ad, read each line aloud and ask: would a great salesperson say this to one buyer, face to face? Cut every line that fails. In a cold email, the same rule kills the opening line &quot;I hope this finds you well.&quot;</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 1.2<button class="ts" data-t="146.12" title="Play the audio from here">▶ 2:26</button><label class="readchk"><input type="checkbox" data-k="1-2"> Mark as done</label></div><h2 data-t="146.12"><span class="num">1.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Specifics get believed. Generalities get ignored.</span></h2></header><p data-say data-t="151.61">Hopkins&#x27; most quoted line: &quot;Platitudes and generalities roll off the human understanding like water from a duck.&quot; Words like best, premium, high quality and fast cost nothing to write, so readers give them no weight. Everyone says them.</p><p data-say data-t="169.11">A specific number is different. It sounds measured. It sounds like someone checked. A reader can picture it, and it is risky to make up, so people trust it more.</p><p data-say data-t="180.20">The fix is mechanical. Find every adjective in your draft and ask: what is the number, the test, the time, the measurement behind this word? Then replace the word with the fact.</p><p data-say data-t="193.20">A useful habit is to keep a facts sheet for every client: numbers from the product page, test results, warranty terms, review scores, each with its source and the date you read it. When you write, you only pull from the sheet. That way every specific in your ads can be checked, and you never have to guess.</p><p data-say data-t="213.15">Hopkins adds a second reason: a superlative makes the reader doubt everything else you say. One exaggeration and the whole ad is discounted. A plain, exact statement, even a modest one, makes the rest of the ad more believable.</p><aside class="co co-example" data-t="230.00"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Aarke Carbonator 3.</div><p data-say>&quot;Built to last&quot; is a generality. Aarke&#x27;s own product page, as read in November 2026, gives the facts behind it: tested for more than ten thousand carbonation cycles, and up to sixty litres of sparkling water per gas cylinder. Those two numbers do the work the adjective only pretends to do.</p></aside><aside class="co co-agency" data-t="252.75"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>In your next hook, swap one adjective for one number from the product page or the reviews. &quot;Long-lasting&quot; becomes &quot;sixty litres per cylinder&quot;. In a cold email to a brand, swap &quot;I can improve your ads&quot; for one specific thing you noticed in their Meta Ad Library.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 1.3<button class="ts" data-t="271.20" title="Play the audio from here">▶ 4:31</button><label class="readchk"><input type="checkbox" data-k="1-3"> Mark as done</label></div><h2 data-t="271.20"><span class="num">1.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Tell the story nobody else bothered to tell.</span></h2></header><p data-say data-t="276.14">This is the famous Schlitz beer story. Hopkins tells it in his autobiography, My Life in Advertising, not in this book, but it is the best proof of the lesson. Every brewer of the time shouted the word &quot;Pure&quot;, in bigger and bigger type, and nobody believed any of them.</p><p data-say data-t="295.15">Hopkins toured the brewery. He saw rooms of filtered air where the beer was cooled, filters packed with wood pulp, pumps and pipes cleaned twice a day, bottles cleaned four times by machine, wells drilled four thousand feet deep for pure water. The brewers shrugged. Every brewery does that, they said.</p><p data-say data-t="314.04">Hopkins&#x27; answer was the lesson: others have never told this story. So he told it, and gave the word pure a meaning. By his own account, Schlitz went from fifth place to neck and neck with first within a few months.</p><p data-say data-t="328.63">Notice what he did not do. He did not invent anything. He did not claim Schlitz was the only pure beer. He simply described, in vivid detail, what every brewer did and nobody explained. Being first to say it made it his.</p><aside class="co co-example" data-t="344.06"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The preemptive claim.</div><p data-say>When every brand in a category makes the same vague promise, the first one to explain the process behind it owns the promise. Competitors who copy it later look like copycats.</p></aside><aside class="co co-agency" data-t="358.56"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Ask the brand, or read the product page, for the boring process facts: how it is tested, made, packed, checked. Put one of them in the first three seconds of a video ad. &quot;Every bottle is checked four times&quot; beats &quot;Premium quality&quot; every single time.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 1.4<button class="ts" data-t="376.97" title="Play the audio from here">▶ 6:17</button><label class="readchk"><input type="checkbox" data-k="1-4"> Mark as done</label></div><h2 data-t="376.97"><span class="num">1.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>The headline picks the reader. Pick the right one.</span></h2></header><p data-say data-t="381.76">A salesperson can choose who to talk to. An ad cannot, unless the headline does the choosing. Hopkins says the entire return from an ad depends on attracting the right sort of readers, and he spent hours on a single headline, often discarding dozens.</p><p data-say data-t="398.78">His point is not to attract everyone. A headline that interests everybody usually interests nobody enough to act. Call out the exact person who can buy, and the problem or wish they already have.</p><p data-say data-t="412.39">He also says that people only stop for what interests them, and what interests them is their own problems and wishes. So the headline is not where you announce your product. It is where you show the reader that this ad is about them.</p><aside class="co co-example" data-t="426.14"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Selecting the reader.</div><p data-say>&quot;Sparkling water, made at home&quot; speaks to nobody in particular. &quot;Still carrying home six packs of sparkling water every week?&quot; speaks to exactly the person who will buy a carbonator, and lets everyone else scroll on.</p></aside><aside class="co co-agency" data-t="442.80"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>On Meta, your first line of text and the first frame of the video are the headline. Name the buyer or their situation in the first five words. Write five versions before you pick one, the way Hopkins did.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 1.5<button class="ts" data-t="457.72" title="Play the audio from here">▶ 7:38</button><label class="readchk"><input type="checkbox" data-k="1-5"> Mark as done</label></div><h2 data-t="457.72"><span class="num">1.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Offer service. The best ads ask no one to buy.</span></h2></header><p data-say data-t="463.29">This is one of the most useful lines in the book: &quot;The best ads ask no one to buy.&quot; An ad that says &quot;buy my brand&quot; is asking for money. An ad that offers useful information, a free sample, or a risk-free trial is offering help, and people accept help.</p><p data-say data-t="481.53">Hopkins also warns about free samples. He says it is hard to pay for an article which has once been free. So give value that proves the product, and let people ask for it, rather than throwing free things at everyone.</p><p data-say data-t="496.43">Service also means answering the questions buyers already have. Will it fit my kitchen? Does it need electricity? What does a refill cost? An ad that answers those questions before they are asked feels like help, and help gets read.</p><p data-say data-t="511.38">On Meta, the comments under your ads are a free list of those questions. Read them every week. Each repeated question is either a hook, answered in the first line, or a gap on the landing page. Answering the question in the ad is service, and service sells.</p><aside class="co co-example" data-t="528.69"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Service first.</div><p data-say>A skincare brand that runs &quot;Take the two-minute skin quiz and get your routine&quot; gets more willing clicks than &quot;Buy our serum today&quot;. The quiz is service. The sale follows.</p></aside><aside class="co co-agency" data-t="543.21"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For a cold email to a DTC brand, do not ask for a meeting in the first email. Offer one useful thing: &quot;I wrote three hooks for your Carbonator ads based on your reviews. Want me to send them?&quot; Let them raise their hand.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 1.6<button class="ts" data-t="559.05" title="Play the audio from here">▶ 9:19</button><label class="readchk"><input type="checkbox" data-k="1-6"> Mark as done</label></div><h2 data-t="559.05"><span class="num">1.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Show the bright side, not the problem.</span></h2></header><p data-say data-t="563.58">In his chapter on negative advertising, Hopkins says to show beauty, not homeliness, and health, not sickness. His example: do not show the wrinkles you propose to remove, but the face as it will appear.</p><p data-say data-t="577.98">People pay far more readily for a reward they want now than to prevent a problem later. A bright, attractive result pulls the reader in. Scolding and fear push them away, or make them scroll past.</p><p data-say data-t="592.93">He also warns against attacking competitors. Knocking others looks unfair and selfish, he says. Talk about what your product gives, and let the reader make the comparison.</p><aside class="co co-example" data-t="604.69"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Reward framing.</div><p data-say>&quot;Stop wasting money on bottled water&quot; scolds. &quot;Fresh bubbles from your tap, any time you want them&quot; rewards. Same product, same fact, a different feeling.</p></aside><aside class="co co-warn" data-t="618.13"><div class="co-l"><span class="ci" aria-hidden="true">⚠️</span> <span data-say>Watch out.</span></div><p data-say>On Meta this matters twice. Meta&#x27;s health and wellness policy also rejects ads that make people feel bad about their bodies, so the bright-side rule keeps your ads both persuasive and approved.</p></aside><aside class="co co-agency" data-t="631.86"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Rewrite any problem-first hook so it ends on the result. Keep the problem if you need it, but give the reward the last and loudest word.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 1.7<button class="ts" data-t="641.87" title="Play the audio from here">▶ 10:42</button><label class="readchk"><input type="checkbox" data-k="1-7"> Mark as done</label></div><h2 data-t="641.87"><span class="num">1.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Test it. Let buyers settle the argument.</span></h2></header><p data-say data-t="646.52">Hopkins ran mail-order ads where every coupon was keyed, so he knew exactly which ad brought which sale. That made advertising a science instead of an opinion. His rule: &quot;Almost any questions can be answered, cheaply, quickly and finally, by a test campaign.&quot; Not by arguments around a table.</p><p data-say data-t="667.66">He also liked mail-order ads because they cannot lie. If the ad does not sell, nobody pays, and you see it in the numbers within days.</p><p data-say data-t="677.05">He tested small first. A few towns, a few thousand coupons, then scale only what paid. The same logic is why you test five hooks on a small budget before you put real money behind the winner.</p><aside class="co co-example" data-t="690.39"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The modern keyed coupon.</div><p data-say>Your Meta Ads Manager is Hopkins&#x27; keyed coupon on steroids. Each ad has its own cost per purchase, click-through rate and thumb-stop rate. The data decides which hook wins, not the client&#x27;s favourite.</p></aside><aside class="co co-agency" data-t="708.01"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Never argue about which hook is better. Write a hypothesis, put two or three versions live with the same budget, and judge them on cost per result. SoScale says on its own website that it runs a hypothesis on every ad test. That is Hopkins, a hundred years later.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 1.8<button class="ts" data-t="727.47" title="Play the audio from here">▶ 12:07</button><label class="readchk"><input type="checkbox" data-k="1-8"> Mark as done</label></div><h2 data-t="727.47"><span class="num">1.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Once they are interested, tell the full story.</span></h2></header><p data-say data-t="731.93">Hopkins compares an ad to a salesperson who finally gets into a busy man&#x27;s office. It may be the only chance he ever gets, so he uses it fully. He does not leave out the one fact that would have closed the sale.</p><p data-say data-t="745.37">That is why he defends long copy. The people who are not interested will not read three lines. The people who are interested want every fact before they spend money. Leave out the facts and you lose the buyer you already paid to reach.</p><p data-say data-t="760.40">The key is order. The headline and first lines do the selecting. The rest of the copy answers every question a serious buyer has: how it works, what it costs, what if it breaks, who else uses it.</p><aside class="co co-example" data-t="774.34"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Short ad, long page.</div><p data-say>A fifteen-second Reels ad can only carry one idea. That is fine, if the click goes to a product page that tells the full story: the specs, the refill cost, the warranty, the reviews. The ad selects; the page sells.</p></aside><aside class="co co-agency" data-t="793.54"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>When you brief a landing page or a carousel, list the ten questions a buyer asks before paying, from the reviews and the comments. Make sure every one is answered somewhere. In a cold email, keep it short, but link to one page that answers everything.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 1.9<button class="ts" data-t="812.31" title="Play the audio from here">▶ 13:32</button><label class="readchk"><input type="checkbox" data-k="1-9"> Mark as done</label></div><h2 data-t="812.31"><span class="num">1.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Worked rewrite: one weak ad, the Hopkins way.</span></h2></header><p data-say data-t="817.46">Here is a typical weak carbonator ad. Headline: &quot;Elevate your everyday hydration.&quot; Body: &quot;Discover the ultimate premium carbonator. Iconic design. Shop now.&quot; Let us run it through Hopkins, one rule at a time.</p><p data-say data-t="834.02">First, the salesperson test. Nobody in a shop says &quot;elevate your everyday hydration&quot;. A seller would ask: how much sparkling water do you drink? So the new opening asks that question and selects the buyer: &quot;Drink a litre of sparkling water a day?&quot;</p><p data-say data-t="851.33">Second, specifics. &quot;Ultimate&quot; and &quot;premium&quot; go. In come facts from the product page: up to sixty litres per cylinder, no electricity, tested for more than ten thousand cycles. Third, the bright side: we show the result, cold bubbles from the tap, instead of scolding about plastic bottles.</p><p data-say data-t="872.45">Fourth, service. Instead of &quot;Shop now&quot; as the only idea, we answer the first question a buyer has, the refill: &quot;Swap the empty cylinder when it runs out.&quot; Fifth, the test. We do not argue about whether the question hook beats the number hook. We run both, with equal budget, and keep the one with the lower cost per purchase.</p><aside class="co co-example" data-t="895.18"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The finished draft.</div><p data-say>&quot;Drink a litre of sparkling water a day? Make it at the tap instead. One cylinder gives up to sixty litres of bubbles, with no plug and no batteries. Tested for over ten thousand cycles.&quot; Every phrase now earns its place: buyer, benefit, number, proof.</p></aside><aside class="co co-agency" data-t="916.73"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Take any ad in the Meta Ad Library for a brand you like and do this five-step rewrite in ten minutes: salesperson test, specifics, bright side, service, then two versions to test. Save the before and after. That is a portfolio piece.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="935.16">That&#x27;s the end of Module 1. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Advertising is salesmanship: would a top salesperson say this line?</li><li>Replace every adjective with a number, test or measurement.</li><li>Tell the process story your competitors think is too obvious to tell.</li><li>The headline selects the buyer. Name them in the first five words.</li><li>Offer help, a sample or a trial instead of asking for the sale.</li><li>Show the result, not the problem.</li><li>Test with real money; let the numbers end the argument.</li><li>Once the reader is interested, answer every question they have.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 9 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 2 drills</span></summary><div class="pb"><div id="playbox" data-n="1"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 9 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://www.holloway.com/g/scientific-advertising" target="_blank" rel="noopener">Scientific Advertising, public-domain text (chapters Just Salesmanship, Offer Service, Headlines, Being Specific, Negative Advertising, Test Campaigns)</a></li><li><a href="https://maximumresultscopywriting.com/marketing/classic-marketing-product-story/" target="_blank" rel="noopener">Schlitz story, quoted from My Life in Advertising (1927)</a></li><li><a href="https://rodspots.com/2018/04/24/advertising-lessons-from-1923-and-1927/" target="_blank" rel="noopener">Ogilvy on Scientific Advertising (&quot;read this book seven times&quot;)</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (&quot;Hypothesis on every ad test&quot;)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><span></span><a class="nx" href="#m02"><small>Next →</small>Module 2: Tested Advertising Methods</a></nav></article></main></template>
<template id="v-m02" data-cls="chpage hasaudio" data-title="Module 2: Tested Advertising Methods · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 2</b> <span>Tested Advertising Methods</span></div><div class="tb-r"><a class="ib" href="#m03" title="Next: Module 3">3 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m02-tested-advertising-methods.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 2 · Contents</div><div class="tc-t">Tested Advertising Methods</div><ol class="tc"><li><a href="#m02/glance">At a glance</a></li><li class="l2"><a href="#m02/L1"><span class="n">2.1</span> The headline does most of the selling, so spend most of your time there.</a></li><li class="l2"><a href="#m02/L2"><span class="n">2.2</span> Lead with self-interest. Curiosity alone is a gamble.</a></li><li class="l2"><a href="#m02/L3"><span class="n">2.3</span> The appeal beats the wording. Find the right reason to buy.</a></li><li class="l2"><a href="#m02/L4"><span class="n">2.4</span> Use the story headline: the underdog who wins.</a></li><li class="l2"><a href="#m02/L5"><span class="n">2.5</span> Some words carry weight. Use them honestly.</a></li><li class="l2"><a href="#m02/L6"><span class="n">2.6</span> Make the copy believable and specific.</a></li><li class="l2"><a href="#m02/L7"><span class="n">2.7</span> Keep testing, and keep the winner running.</a></li><li class="l2"><a href="#m02/L8"><span class="n">2.8</span> Worked example: one week of Caples on a real brief.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m02/quiz">✅ Questions (9)</a></li><li><a href="#m02/play">🛠️ Playground (3)</a></li><li><a href="#m02/cards">🃏 Lesson cards (8)</a></li><li><a href="#m02/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02" aria-current="page"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 2 · John Caples · 1932</div><h1 data-t="0.30"><span class="chn">Module 2</span><span data-say>Tested Advertising Methods</span> <span class="h1sub" data-say>by John Caples</span></h1><div class="lead"><p data-say data-t="5.87">John Caples wrote one of the most famous headlines in history in 1926, when he was a young copywriter at Ruthrauff and Ryan. Then he spent the rest of his career at BBDO measuring which headlines and appeals actually brought in orders. Tested Advertising Methods, first published in 1932, is the result. Hopkins gave you the idea that advertising is a science. Caples gives you the lab notes. Here are the seven lessons that matter for a Meta ad account or a cold email.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 15:45</span><span>8 lessons</span><span>9 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m02/L1"><b>2.1 The headline does most of the selling, so spend most of your time there.</b></a> <span class="muted">· 🎧 2:05</span></li><li><a href="#m02/L2"><b>2.2 Lead with self-interest. Curiosity alone is a gamble.</b></a> <span class="muted">· 🎧 1:51</span></li><li><a href="#m02/L3"><b>2.3 The appeal beats the wording. Find the right reason to buy.</b></a> <span class="muted">· 🎧 2:09</span></li><li><a href="#m02/L4"><b>2.4 Use the story headline: the underdog who wins.</b></a> <span class="muted">· 🎧 1:38</span></li><li><a href="#m02/L5"><b>2.5 Some words carry weight. Use them honestly.</b></a> <span class="muted">· 🎧 1:34</span></li><li><a href="#m02/L6"><b>2.6 Make the copy believable and specific.</b></a> <span class="muted">· 🎧 1:28</span></li><li><a href="#m02/L7"><b>2.7 Keep testing, and keep the winner running.</b></a> <span class="muted">· 🎧 1:53</span></li><li><a href="#m02/L8"><b>2.8 Worked example: one week of Caples on a real brief.</b></a> <span class="muted">· 🎧 2:21</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.nytimes.com/1990/06/11/obituaries/john-caples-90-author-in-1926-of-they-laughed-when-ad.html" target="_blank" rel="noopener">John Caples obituary, The New York Times, 1990</a></li><li><a href="https://sirismm.si.edu/EADpdfs/NMAH.AC.0393.pdf" target="_blank" rel="noopener">John Caples papers, Smithsonian archives (finding aid)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 2.1<button class="ts" data-t="38.89" title="Play the audio from here">▶ 0:39</button><label class="readchk"><input type="checkbox" data-k="2-1"> Mark as done</label></div><h2 data-t="38.89"><span class="num">2.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>The headline does most of the selling, so spend most of your time there.</span></h2></header><p data-say data-t="44.84">Caples&#x27; central finding is simple: in a tested ad, the headline is the part that moves the result most. Change the body copy and the numbers move a little. Change the headline and they can move a lot. If the headline fails, almost nobody reads the copy you sweated over.</p><p data-say data-t="62.82">That changes how you budget your time. Most beginners write the body first and add a headline at the end, in thirty seconds. Caples did the opposite. He wrote many headlines, compared them, and only then wrote the copy that delivered on the winner.</p><p data-say data-t="78.99">On Meta, the headline is not the little bold line under the image. It is whatever the person sees first: the first frame of the video, the words burned onto it, and the first line of primary text before the &quot;see more&quot; cut. That is where the scroll is won or lost.</p><p data-say data-t="96.37">A practical rule: when you test hooks, keep everything after the first three seconds identical. Same footage, same body copy, same offer. Then any difference in results comes from the opening, and you learn which headline won, not which edit happened to be better.</p><p data-say data-t="113.50">So when a test fails, do not start by rewriting the whole ad. Start by testing a new opening, because that is where the leverage is.</p><aside class="co co-example" data-t="122.48"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The ten-to-one habit.</div><p data-say>Before you write a single line of a carbonator ad, write ten openings. &quot;Still carrying sparkling water home from the shop?&quot; &quot;Sixty litres of bubbles from one cylinder.&quot; &quot;Your tap, but with bubbles.&quot; You will throw most of them away. That is the point. The winner is usually not the first one you wrote.</p></aside><aside class="co co-agency" data-t="144.61"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For your next ad, write ten hooks before any body copy. Pick the best three and test them against each other with the same video body and the same budget. In a cold email, the subject line and the first sentence are the headline, so write five of each before you send.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 2.2<button class="ts" data-t="163.64" title="Play the audio from here">▶ 2:44</button><label class="readchk"><input type="checkbox" data-k="2-2"> Mark as done</label></div><h2 data-t="163.64"><span class="num">2.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Lead with self-interest. Curiosity alone is a gamble.</span></h2></header><p data-say data-t="169.66">Caples sorted headlines into a few families. The strongest appeal to the reader&#x27;s self-interest: they promise something the reader wants. Next come headlines that carry news. The weakest, used on their own, are headlines built only on curiosity.</p><p data-say data-t="186.65">Curiosity is tempting because it feels clever. &quot;You won&#x27;t believe what happened next.&quot; But a curiosity headline with no promise attracts the curious, not the buyers, and the people who click are often disappointed. Caples&#x27; advice is to combine them: a real benefit, with enough curiosity to pull the reader into the first line.</p><p data-say data-t="208.83">Self-interest also means the reader&#x27;s interest, not yours. &quot;Our new carbonator is here&quot; is about the brand. &quot;Fresh sparkling water whenever you want it&quot; is about the reader. The facts can be identical. The angle decides who keeps reading.</p><aside class="co co-example" data-t="226.11"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Three versions, one product.</div><p data-say>Self-interest: &quot;Make sparkling water at home without carrying a single bottle.&quot; News: &quot;New: the carbonator that needs no plug.&quot; Curiosity only: &quot;The kitchen gadget everyone in Stockholm is talking about.&quot; The first two give a reason to read. The third only gives a reason to wonder, and it also makes a claim you could not prove.</p></aside><aside class="co co-agency" data-t="253.25"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Read your hook and ask: if the reader only saw this line, would they know what is in it for them? If not, add the benefit. Keep curiosity as seasoning, not as the meal. For cold emails, a subject line like &quot;3 hooks from your reviews&quot; beats &quot;Quick question&quot; because it promises something.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 2.3<button class="ts" data-t="275.02" title="Play the audio from here">▶ 4:35</button><label class="readchk"><input type="checkbox" data-k="2-3"> Mark as done</label></div><h2 data-t="275.02"><span class="num">2.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>The appeal beats the wording. Find the right reason to buy.</span></h2></header><p data-say data-t="280.80">This is the lesson Caples put most strongly. He wrote that he had seen one ad sell &quot;19-1/2 times as much merchandise as another ad for the same product&quot;, and that the difference was that one used the right appeal and the other used the wrong appeal.</p><p data-say data-t="297.38">An appeal is the reason to buy you lead with. For a carbonator it could be saving money, avoiding plastic bottles, convenience, taste, design or health. Polishing the words inside the wrong appeal gets you a little. Switching to the right appeal can multiply results.</p><p data-say data-t="316.27">This is why you test appeals before you test wording. First find out which reason moves buyers. Then improve the words that carry it.</p><p data-say data-t="325.27">Where do you find candidate appeals? Not in a brainstorm. In what buyers already say: reviews, comments, support questions, Reddit threads. If one sentence keeps showing up in five-star reviews, that is a candidate appeal. If one complaint keeps showing up in the one-star reviews, that is the objection your ad must answer.</p><p data-say data-t="346.97">It helps to write each appeal as a plain sentence before you write any hook: &quot;people buy this to stop carrying bottles&quot;, &quot;people buy this because it looks good&quot;. If you cannot state the appeal in one plain sentence, the hooks built on it will be vague too.</p><aside class="co co-example" data-t="362.78"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Test appeals, not adjectives.</div><p data-say>Round one tests three appeals for the same product, each with a plain hook: no more carrying bottles; sixty litres of bubbles per cylinder; no electricity needed, works anywhere. Only after one appeal wins do you start testing wording inside it.</p></aside><aside class="co co-agency" data-t="383.78"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Map five possible appeals for your client from reviews and comments. Write one plain hook for each and test them as separate ads in the same campaign. That is exactly the &quot;hypothesis on every test&quot; approach agencies like SoScale describe on their sites, and it is Caples&#x27; method.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 2.4<button class="ts" data-t="404.28" title="Play the audio from here">▶ 6:44</button><label class="readchk"><input type="checkbox" data-k="2-4"> Mark as done</label></div><h2 data-t="404.28"><span class="num">2.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Use the story headline: the underdog who wins.</span></h2></header><p data-say data-t="409.41">In 1926 Caples wrote an ad for the U.S. School of Music, a correspondence course. The headline: &quot;They Laughed When I Sat Down At the Piano But When I Started to Play!&quot; It became one of the most copied headlines ever written.</p><p data-say data-t="424.96">Why does it work? In one line it sets up a scene, a humiliation the reader fears, and a turnaround the reader wants. You feel the room laughing, and you need to know what happened next. The benefit is not stated. It is acted out.</p><p data-say data-t="441.04">It was copied so often that its structure became a formula. Caples himself noted a spin-off, &quot;They grinned when the waiter spoke to me in French&quot;, for a language course. The skeleton is: they doubted me, then I did the thing.</p><p data-say data-t="456.04">The lesson is not to copy the words. It is to put the transformation into a little scene with other people in it. People remember stories and scenes, not claims.</p><aside class="co co-example" data-t="467.13"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The modern piano.</div><p data-say>A UGC script for a carbonator: &quot;My friends laughed when I said I&#x27;d stop buying sparkling water. Then they tasted it.&quot; Same skeleton: doubt, then the product delivers in front of other people. It is also an easy brief for a creator to film.</p></aside><aside class="co co-agency" data-t="485.88"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write one hook in the doubt-then-triumph shape for your client. Make it a scene with other people in it: friends, a partner, a colleague. Use it as the opening line of a UGC script and test it against your benefit-led hook.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 2.5<button class="ts" data-t="501.84" title="Play the audio from here">▶ 8:22</button><label class="readchk"><input type="checkbox" data-k="2-5"> Mark as done</label></div><h2 data-t="501.84"><span class="num">2.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Some words carry weight. Use them honestly.</span></h2></header><p data-say data-t="506.61">Caples paid close attention to individual words that kept appearing in winning headlines. He pointed to simple, direct words such as &quot;new&quot;, &quot;how to&quot;, &quot;free&quot;, &quot;now&quot; and &quot;announcing&quot;. They work because they each signal something the reader wants: news, a method, a gift, a reason to act now.</p><p data-say data-t="528.35">He also liked headlines that read like useful information. &quot;How to&quot; promises a method. A number promises a list the reader can finish. News signals that this is worth attention today.</p><p data-say data-t="540.50">But the words only work when they are true. &quot;New&quot; has to be new. &quot;Free&quot; has to be free, with no hidden catch. A headline word that lies wins a click and loses the buyer, and on Meta it can also get the ad rejected.</p><aside class="co co-example" data-t="555.81"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Same idea, sharper words.</div><p data-say>Weak: &quot;Our carbonator offers convenience.&quot; Stronger: &quot;How to make sixty litres of sparkling water without leaving your kitchen.&quot; Stronger still, if true for an offer: &quot;Free extra cylinder with every starter kit this week.&quot; Each version adds one weighted word that gives the reader a reason to keep going.</p></aside><aside class="co co-agency" data-t="580.82"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Take your current best hook and write three versions: one starting with &quot;How to&quot;, one starting with a number, one starting with &quot;New&quot; or &quot;Now&quot;, only if it is true. Test the strongest against the original.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 2.6<button class="ts" data-t="595.43" title="Play the audio from here">▶ 9:55</button><label class="readchk"><input type="checkbox" data-k="2-6"> Mark as done</label></div><h2 data-t="595.43"><span class="num">2.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Make the copy believable and specific.</span></h2></header><p data-say data-t="600.06">A strong headline creates a promise. The copy&#x27;s job is to make that promise believable. Caples was clear that readers are suspicious, and that specific facts persuade better than broad claims. This is Hopkins&#x27; rule, confirmed again by test results.</p><p data-say data-t="617.29">Believability comes from details only a real product or a real customer would have: exact numbers, named places, real reviews, the honest drawback. A copywriter who admits a limit is trusted more on everything else.</p><p data-say data-t="633.47">Caples also liked testimonials, but real ones, with names and details. A testimonial with a specific result and a real person is proof. A vague line like &quot;Great product!&quot; proves nothing.</p><aside class="co co-example" data-t="647.34"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Believable details.</div><p data-say>&quot;Customers love it&quot; says nothing. &quot;87 percent of 760 reviews on the brand&#x27;s own site give it five stars&quot; is a fact someone can check. Even better, add the honest catch: &quot;The most common complaint? The price. Here is how it pays back.&quot;</p></aside><aside class="co co-agency" data-t="668.00"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>In every ad, add one checkable fact and one real customer voice. If the main objection is price, say so first and answer it. It costs you nothing and buys trust for every other line.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 2.7<button class="ts" data-t="683.17" title="Play the audio from here">▶ 11:23</button><label class="readchk"><input type="checkbox" data-k="2-7"> Mark as done</label></div><h2 data-t="683.17"><span class="num">2.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Keep testing, and keep the winner running.</span></h2></header><p data-say data-t="687.49">Caples worked in mail order and coupons, where every ad could be tracked to its orders. His whole book argues for that discipline: test ideas against each other with real buyers, keep the winner, and test the next idea against the winner.</p><p data-say data-t="703.28">Two habits follow. First, test one big thing at a time: the appeal, then the headline, then the offer. If you change everything at once, you do not know what worked. Second, do not kill a winning ad because you are bored of it. The people you sell to have not seen it nearly as many times as you have.</p><p data-say data-t="723.37">On Meta, ads do wear out, so this needs updating: watch the numbers, not your boredom. When cost per result climbs while the frequency rises, that is fatigue. Until then, the winner stays, and new ideas have to beat it to replace it.</p><p data-say data-t="740.43">Keep the bar for replacing the control honest. A challenger should beat it on the metric that matters, usually cost per purchase, with enough spend behind both to trust the difference. A single lucky day is not a win. Patience here saves accounts from chasing noise.</p><aside class="co co-example" data-t="758.31"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Control and challenger.</div><p data-say>Your best carbonator ad is the control. Every week you launch two challengers with a new appeal or hook. If a challenger beats the control on cost per purchase, it becomes the new control. Nobody argues, and the account improves every week.</p></aside><aside class="co co-agency" data-t="778.42"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Set up a control-and-challenger log for a client: one row per test, the hypothesis, the one thing that changed, and the result. In a cold email, mention that you work this way. It tells a DTC brand you think in results, not opinions.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 2.8<button class="ts" data-t="795.68" title="Play the audio from here">▶ 13:16</button><label class="readchk"><input type="checkbox" data-k="2-8"> Mark as done</label></div><h2 data-t="795.68"><span class="num">2.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Worked example: one week of Caples on a real brief.</span></h2></header><p data-say data-t="800.86">Let us run the whole method on a carbonator account in one week. Monday is research. You read the product page, the five-star reviews and the one-star reviews, and you write down every reason people give for buying and every complaint. Three appeals stand out: not carrying bottles, the steel design, and the price objection.</p><p data-say data-t="822.72">Tuesday is headlines. For each appeal you write ten openings, thirty in total. You cut the ones that only make the reader curious, and the ones a top salesperson would not say. You keep the best one per appeal, written as plainly as possible, so the test measures the appeal and not your wordplay.</p><p data-say data-t="842.67">Wednesday is launch. Three ads, same video body, same budget, same audience. Only the opening line and the first frame change. You write down your hypothesis before launch: convenience will beat design, because the reviews mention carrying bottles most often.</p><p data-say data-t="860.93">The following week you read the numbers. Suppose convenience wins on cost per purchase. Now, and only now, you test wording inside that appeal: a &quot;how to&quot; version, a story version in the &quot;They Laughed&quot; shape, and a number version. The winner becomes the control.</p><p data-say data-t="878.74">Notice what you did not do. You did not debate taste in a meeting. You did not polish one ad for three days. You let buyers vote with money, which is the whole of Caples&#x27; book in one week.</p><aside class="co co-example" data-t="891.22"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The test log line.</div><p data-say>&quot;Week 46. Hypothesis: convenience beats design for 25 to 45 year olds. Variable: opening line only. Result: convenience lowest cost per purchase. Next: test three wordings inside convenience.&quot; One line like this per test is the most persuasive thing you can show a performance agency.</p></aside><aside class="co co-agency" data-t="917.09"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Do this as a spec project for one brand you like. Use the Meta Ad Library to see which appeals they already run, write the thirty hooks, pick three, and write the test plan as a one-page PDF. Send it as the free sample in your

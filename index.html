ters.</p><aside class="co co-example" data-t="106.23"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A writer&#x27;s morning.</div><p data-say>Thirty minutes of walking, then one hour of the hardest copy task of the day, before email and before Slack. Many copywriters protect that first hour, because it is when the central selling idea is most likely to show up.</p></aside><aside class="co co-agency" data-t="123.97"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Block your first hour tomorrow: a walk, then your hardest writing task, such as the nugget notes or the fast draft. Notice the opening of the letter too: next time you write a cold email, try starting with one small true story instead of a statement.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 5.2<button class="ts" data-t="141.03" title="Play the audio from here">▶ 2:21</button><label class="readchk"><input type="checkbox" data-k="5-2"> Mark as done</label></div><h2 data-t="141.03"><span class="num">5.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Find the starving crowd before you write a word.</span></h2></header><p data-say data-t="145.56">This is the most famous lesson in the letters. Halbert asks his son: if you and I both opened a hamburger stand and could each have one advantage, what would you choose? Better meat, better buns, better location, lower prices? His answer: a starving crowd.</p><p data-say data-t="163.32">The point is that the market matters more than the copy. Brilliant copy aimed at people who don&#x27;t want the product sells little. Plain copy aimed at people who are desperate for it sells a lot. So the first job is not writing. It is finding the people who are already hungry.</p><p data-say data-t="180.34">In the letters he ranks the lists you might mail. The best list of all, he says, is your own satisfied customers, people who already bought from you and were happy.</p><p data-say data-t="191.28">On Meta, the algorithm does a lot of the finding for you now. But the lesson still holds in two places: who the creative speaks to, and which audiences you feed the system. Past buyers and people like them are the starving crowd.</p><aside class="co co-example" data-t="207.84"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Hungry versus curious.</div><p data-say>A carbonator ad aimed at &quot;people interested in kitchens&quot; is aimed at the curious. An ad aimed at people who already buy sparkling water every week, with a hook about carrying bottles, is aimed at the hungry. The second group already spends money on the problem.</p></aside><aside class="co co-agency" data-t="228.51"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before any brief, write one sentence: who already spends money on this problem, every week, without being asked? Write the hook for them. In cold emails, the starving crowd is brands that are clearly spending on Meta right now: check the Ad Library for many active ads.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 5.3<button class="ts" data-t="247.95" title="Play the audio from here">▶ 4:08</button><label class="readchk"><input type="checkbox" data-k="5-3"> Mark as done</label></div><h2 data-t="247.95"><span class="num">5.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Be a student of markets: watch what people buy, not what they say.</span></h2></header><p data-say data-t="254.28">In the letters Halbert tells Bond to become a student of markets. Watch what people actually buy. Look at what sells again and again, and at what kind of offers keep running.</p><p data-say data-t="264.86">He is suspicious of surveys. People will tell you what sounds good. What they spend money on tells you the truth. So believe the numbers, the orders and the reorders, over opinions.</p><p data-say data-t="276.91">For ads this is a gift, because the data is everywhere. Reviews show what buyers value in their own words. Long-running ads in the Ad Library show what keeps paying. Bestseller lists show what people buy, not what they claim to want.</p><p data-say data-t="292.51">A survey might say people want an eco-friendly carbonator. The reviews might show they actually buy it because they are tired of carrying bottles. Write for the second.</p><aside class="co co-example" data-t="303.48"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Reviews versus survey.</div><p data-say>A brand&#x27;s survey says &quot;sustainability&quot; is the top reason to buy. The five-star reviews mostly say &quot;no more heavy bags&quot; and &quot;the kids love it&quot;. Halbert would test the reviews&#x27; reasons first, because they come from people who paid.</p></aside><aside class="co co-agency" data-t="321.34"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Read fifty reviews for your client before writing. Copy every phrase that appears more than twice into your nugget notes. In the Ad Library, note which competitor ads have been active longest; that is the market voting with money.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 5.4<button class="ts" data-t="338.09" title="Play the audio from here">▶ 5:38</button><label class="readchk"><input type="checkbox" data-k="5-4"> Mark as done</label></div><h2 data-t="338.09"><span class="num">5.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Recent, frequent and the right price: the best prospects.</span></h2></header><p data-say data-t="344.06">Halbert explains to Bond how mailers judge a list of buyers. People who bought recently are better prospects than people who bought long ago. People who buy often are better than people who bought once. And people who spent about the amount you&#x27;re asking are better than people who spent much less.</p><p data-say data-t="363.88">In mail order these are called recency, frequency and unit of sale. They are still the best way to think about who will buy next.</p><p data-say data-t="372.50">Translated to a DTC brand: last month&#x27;s buyers are worth more than last year&#x27;s. Repeat customers are worth more than one-time buyers. People who already pay premium prices in a category are more likely to accept a premium price from you.</p><p data-say data-t="389.28">This also shapes the offer. A first-time prospect may need a lower starting price or a starter kit. A frequent buyer may want a bundle or a refill subscription.</p><aside class="co co-example" data-t="400.82"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Matching the offer to the buyer.</div><p data-say>For a carbonator brand: a gas-refill reminder for recent buyers, a bundle for frequent buyers of flavours, and a starter kit with the warranty message for new prospects. Three audiences, three offers, all chosen with recency, frequency and unit of sale.</p></aside><aside class="co co-agency" data-t="423.04"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>When you write ad concepts, label each one with the audience it serves: new prospect, recent buyer, frequent buyer. Write the offer to fit. In a cold email, mention that you think this way; DTC teams respect copywriters who understand retention.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 5.5<button class="ts" data-t="441.98" title="Play the audio from here">▶ 7:22</button><label class="readchk"><input type="checkbox" data-k="5-5"> Mark as done</label></div><h2 data-t="441.98"><span class="num">5.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Get into the A-pile.</span></h2></header><p data-say data-t="445.24">Halbert describes how people sort their mail standing over the bin. The A-pile is mail that looks personal: letters from people they know, hand-addressed envelopes, things that might be important. The B-pile is obvious advertising. The B-pile goes straight in the bin.</p><p data-say data-t="464.61">His rule: make your mail look like it belongs in the A-pile. A plain envelope, a real stamp, a real name. Once it&#x27;s opened, the letter does the selling.</p><p data-say data-t="475.96">The modern A-pile is everywhere. In a feed, it is content that looks like it was made by a person, not a brand: a creator talking to the camera, a real kitchen, natural light. In an inbox, it is a plain-text email from a real name with a specific subject, not a designed newsletter.</p><p data-say data-t="496.74">This is one reason user-generated style ads work well on Meta. They look like the A-pile.</p><aside class="co co-example" data-t="504.06"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A-pile cold email.</div><p data-say>B-pile: an HTML email with a logo banner, the subject &quot;Partnership opportunity&quot; and three paragraphs about your services. A-pile: plain text, from &quot;Oskar Axelsson&quot;, subject &quot;your Carbonator reviews&quot;, three short lines about one thing you noticed. The second one gets opened and read.</p></aside><aside class="co co-agency" data-t="527.61"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Make every cold email look like a note from one person to one person. No templates, no images, no tracking-pixel newsletters. For video briefs, ask for one concept that looks like a friend&#x27;s story, filmed on a phone in a real home.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 5.6<button class="ts" data-t="545.92" title="Play the audio from here">▶ 9:06</button><label class="readchk"><input type="checkbox" data-k="5-6"> Mark as done</label></div><h2 data-t="545.92"><span class="num">5.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>First impressions: give the reader&#x27;s eyes a rest.</span></h2></header><p data-say data-t="551.46">In several letters Halbert talks about how the copy looks before anyone reads it. Big blocks of grey text scare people away. Short paragraphs, indented lines, subheads and white space make copy look easy, so people start reading.</p><p data-say data-t="567.47">He calls this giving the reader eye relief, and he likes layouts that look editorial, like an article, rather than like an ad.</p><p data-say data-t="576.01">On a phone, this matters even more. A wall of text in the primary text box gets skipped. Short lines with breaks, captions on video and simple on-screen text make the ad look easy to take in.</p><p data-say data-t="590.00">The first impression also includes the first second of video. If it looks like a TV commercial, people&#x27;s guard goes up. If it looks like something a person made, they relax.</p><aside class="co co-example" data-t="601.02"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Same words, different look.</div><p data-say>One paragraph of five sentences in the primary text versus the same words split into five short lines, each starting with a strong word. The words are identical. The second gets read because it looks easy.</p></aside><aside class="co co-agency" data-t="618.25"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Format every primary text with short lines and a blank line between ideas. Put captions on every video. Look at your landing page on a phone and break up anything longer than four lines.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 5.7<button class="ts" data-t="632.80" title="Play the audio from here">▶ 10:33</button><label class="readchk"><input type="checkbox" data-k="5-7"> Mark as done</label></div><h2 data-t="632.80"><span class="num">5.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Attention, interest, desire, action: and the nugget notes behind it.</span></h2></header><p data-say data-t="639.85">Halbert walks Bond through writing a letter step by step. First, numbered nugget notes on everything about the product. Then the classic formula: attention, interest, desire, action.</p><p data-say data-t="653.74">Attention is the headline or the envelope. Interest is the first lines that make the reader want to keep going. Desire is where you describe the benefits so vividly that they want the product. Action is the clear request: what to do, how, and why now.</p><p data-say data-t="671.72">He makes the point that the formula is only a skeleton. What makes it work is the notes. If you don&#x27;t know enough about the product, the interest and desire sections are empty, and no formula can save them.</p><p data-say data-t="684.87">AIDA is the simple version of the seven steps you met in Module 4. Use AIDA for short ads; use the seven steps when you have more room.</p><aside class="co co-example" data-t="695.24"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>AIDA in four lines.</div><p data-say>Attention: &quot;Still carrying sparkling water home?&quot; Interest: &quot;There&#x27;s a way to make it at your tap, with no plug.&quot; Desire: &quot;Sixty litres per cylinder, steel body, cold bubbles whenever you want them.&quot; Action: &quot;Order the starter kit today.&quot;</p></aside><aside class="co co-agency" data-t="714.90"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write one fifteen-second script in AIDA: one line per letter. Then check: does each line come from a real nugget note? If a line has no fact behind it, go back to the notes.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 5.8<button class="ts" data-t="728.46" title="Play the audio from here">▶ 12:08</button><label class="readchk"><input type="checkbox" data-k="5-8"> Mark as done</label></div><h2 data-t="728.46"><span class="num">5.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Copy the great ads. Use small words and short sentences.</span></h2></header><p data-say data-t="734.38">Halbert tells Bond to copy great ads by hand, the same advice you met in Module 4. He adds rules about the writing itself: use simple words. Keep sentences short. Write the way people talk.</p><p data-say data-t="748.42">He is not against intelligence. He is against effort. Every hard word or long sentence makes the reader work, and a reader who has to work stops reading.</p><p data-say data-t="759.24">Short does not mean choppy. Good copy varies its rhythm, with a few longer sentences between short ones. But the default is short.</p><p data-say data-t="768.77">This matters for performance ads because people read on phones, quickly, often with half their attention. Simple words and short lines are what they can take in.</p><aside class="co co-example" data-t="780.20"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Small words.</div><p data-say>&quot;Utilise our innovative carbonation technology&quot; becomes &quot;Use it to make bubbles.&quot; Same meaning, half the effort, and it sounds like a person.</p></aside><aside class="co co-agency" data-t="792.92"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Run your copy through one test: could a twelve-year-old read it aloud without stumbling? Replace every word over three syllables that has a shorter version. Split any sentence over twenty words.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 5.9<button class="ts" data-t="808.08" title="Play the audio from here">▶ 13:28</button><label class="readchk"><input type="checkbox" data-k="5-9"> Mark as done</label></div><h2 data-t="808.08"><span class="num">5.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Make a proposition, and give the reason why.</span></h2></header><p data-say data-t="812.45">In the letters Halbert explains that every sale is a proposition: a clear offer of what you get, what you give, and under what terms. And he stresses the reason why: tell the reader why the offer is so good.</p><p data-say data-t="826.03">If a deal looks too good with no explanation, people distrust it. If you explain the reason, such as a season ending, a new model arriving or a test you are running, the deal becomes believable.</p><p data-say data-t="839.30">The reason why also works for product claims. Why does it last? Because it is mechanical and tested. Why is it cheaper over time? Because one cylinder makes up to sixty litres.</p><p data-say data-t="851.83">Reason-why copy is one of the oldest ideas in advertising, and one of the most useful on paid social, where trust is low.</p><aside class="co co-example" data-t="860.47"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Offer with a reason.</div><p data-say>Weak: &quot;20 percent off the starter kit!&quot; With a reason, if true: &quot;We&#x27;re clearing last season&#x27;s colours, so the starter kit in these three colours is 20 percent off until they&#x27;re gone.&quot; The reason makes the discount believable and the deadline real.</p></aside><aside class="co co-agency" data-t="879.55"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For every offer in a brief, write the reason why in one sentence. If there is no real reason, don&#x27;t invent one; make the offer plainer instead. For every big claim, add &quot;because&quot; and a fact.</p></aside></section><section class="sec" id="L10" data-sec="10"><header class="sh"><div class="sk">Lesson 5.10<button class="ts" data-t="895.34" title="Play the audio from here">▶ 14:55</button><label class="readchk"><input type="checkbox" data-k="5-10"> Mark as done</label></div><h2 data-t="895.34"><span class="num">5.10</span> <span class="lsay" data-say>Lesson 10.</span> <span data-say>Find the market first, then make it believable with specifics.</span></h2></header><p data-say data-t="901.36">In the later letters Halbert brings it together. Find the market first. Then write. Then read the copy aloud. And make it believable with specifics, because people believe precise details more than general claims.</p><p data-say data-t="916.05">He also connects believability to tone. A confident, plain, specific letter sounds true. A breathless letter full of superlatives sounds like hype.</p><p data-say data-t="916.89">This is the same lesson Hopkins taught in Module 1, from a man who tested it in millions of mailings. When two masters from different eras agree, take it as a law.</p><p data-say data-t="928.39">For a modern ad, specifics are numbers, names, places, timescales and honest limits. They also protect you with ad review, because specific, true claims are easier to defend than vague, big ones.</p><aside class="co co-example" data-t="943.41"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Hype versus specifics.</div><p data-say>Hype: &quot;The most incredible carbonator ever!!!&quot; Specific: &quot;Up to sixty litres per cylinder. Tested for ten thousand cycles. Three-year warranty when registered.&quot; The specific version is less exciting to write and much easier to believe.</p></aside><aside class="co co-agency" data-t="964.46"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before you hand in any ad, circle every claim. Next to each one, write the specific fact that backs it and where it comes from. If you can&#x27;t, cut or soften the claim. This habit makes you safe to hire.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="980.47">That&#x27;s the end of Module 5. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Look after the machine first: road work, then your hardest writing hour.</li><li>The starving crowd beats clever copy. Find who already spends on the problem.</li><li>Believe what people buy, not what they say in surveys.</li><li>Recent, frequent, right price: the best prospects. Match the offer.</li><li>Get into the A-pile: look like a person, not an ad.</li><li>Eye relief: short lines, white space, captions.</li><li>AIDA is the skeleton; nugget notes are the muscle.</li><li>Small words, short sentences, the way people talk.</li><li>Every offer needs a reason why. Every claim needs a specific.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 9 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="5"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 10 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://www.thegaryhalbertletter.com/Boron/BoronLetterCh1.htm" target="_blank" rel="noopener">The Boron Letters, free on thegaryhalbertletter.com (chapters 1 to 3)</a></li><li><a href="https://www.thegaryhalbertletter.com/Boron/TChapter6.htm" target="_blank" rel="noopener">Chapter 6: the starving crowd and ranking lists</a></li><li><a href="https://www.thegaryhalbertletter.com/Boron/TChapter11.htm" target="_blank" rel="noopener">Chapter 11: the A-pile and the B-pile</a></li><li><a href="https://tajedo.com/the-boron-letters-gary-halbert/" target="_blank" rel="noopener">Chapter summaries cross-checked (Tajedo)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m04"><small>← Previous</small>Module 4: The Gary Halbert Letter</a><a class="nx" href="#m06"><small>Next →</small>Module 6: Breakthrough Advertising</a></nav></article></main></template>
<template id="v-m06" data-cls="chpage hasaudio" data-title="Module 6: Breakthrough Advertising · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 6</b> <span>Breakthrough Advertising</span></div><div class="tb-r"><a class="ib" href="#m07" title="Next: Module 7">7 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m06-breakthrough-advertising.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 6 · Contents</div><div class="tc-t">Breakthrough Advertising</div><ol class="tc"><li><a href="#m06/glance">At a glance</a></li><li class="l2"><a href="#m06/L1"><span class="n">6.1</span> You cannot create desire. You can only channel it.</a></li><li class="l2"><a href="#m06/L2"><span class="n">6.2</span> Read the market&#x27;s awareness before you write the headline.</a></li><li class="l2"><a href="#m06/L3"><span class="n">6.3</span> For unaware buyers, start with them, not the product.</a></li><li class="l2"><a href="#m06/L4"><span class="n">6.4</span> Read the market&#x27;s sophistication: what has it already heard?</a></li><li class="l2"><a href="#m06/L5"><span class="n">6.5</span> Mechanism: explain how it works, and make the claim new again.</a></li><li class="l2"><a href="#m06/L6"><span class="n">6.6</span> Intensification: make the desire vivid.</a></li><li class="l2"><a href="#m06/L7"><span class="n">6.7</span> Identification: sell the role, not just the result.</a></li><li class="l2"><a href="#m06/L8"><span class="n">6.8</span> Gradualization and redefinition: build belief step by step, reframe the objection.</a></li><li class="l2"><a href="#m06/L9"><span class="n">6.9</span> Camouflage and concentration: borrow a trusted format, and use the competitors&#x27; weakness.</a></li><li class="l2"><a href="#m06/L10"><span class="n">6.10</span> Worked example: one brief, three audiences, three different ads.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m06/quiz">✅ Questions (10)</a></li><li><a href="#m06/play">🛠️ Playground (3)</a></li><li><a href="#m06/cards">🃏 Lesson cards (10)</a></li><li><a href="#m06/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06" aria-current="page"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 6 · Eugene M. Schwartz · 1966</div><h1 data-t="0.30"><span class="chn">Module 6</span><span data-say>Breakthrough Advertising</span> <span class="h1sub" data-say>by Eugene M. Schwartz</span></h1><div class="lead"><p data-say data-t="6.25">Eugene Schwartz&#x27;s Breakthrough Advertising is the book copywriters argue about most, because it is dense and because it explains why the same ad works for one audience and fails for another. Hopkins, Caples and Schwab tell you what to write. Schwartz tells you where to start, depending on what your reader already knows and believes. For anyone writing Meta ads across cold and warm audiences, this is the most useful map in the course.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 17:34</span><span>10 lessons</span><span>10 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m06/L1"><b>6.1 You cannot create desire. You can only channel it.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m06/L2"><b>6.2 Read the market&#x27;s awareness before you write the headline.</b></a> <span class="muted">· 🎧 1:50</span></li><li><a href="#m06/L3"><b>6.3 For unaware buyers, start with them, not the product.</b></a> <span class="muted">· 🎧 1:32</span></li><li><a href="#m06/L4"><b>6.4 Read the market&#x27;s sophistication: what has it already heard?</b></a> <span class="muted">· 🎧 1:52</span></li><li><a href="#m06/L5"><b>6.5 Mechanism: explain how it works, and make the claim new again.</b></a> <span class="muted">· 🎧 1:33</span></li><li><a href="#m06/L6"><b>6.6 Intensification: make the desire vivid.</b></a> <span class="muted">· 🎧 1:34</span></li><li><a href="#m06/L7"><b>6.7 Identification: sell the role, not just the result.</b></a> <span class="muted">· 🎧 1:26</span></li><li><a href="#m06/L8"><b>6.8 Gradualization and redefinition: build belief step by step, reframe the objection.</b></a> <span class="muted">· 🎧 1:37</span></li><li><a href="#m06/L9"><b>6.9 Camouflage and concentration: borrow a trusted format, and use the competitors&#x27; weakness.</b></a> <span class="muted">· 🎧 1:46</span></li><li><a href="#m06/L10"><b>6.10 Worked example: one brief, three audiences, three different ads.</b></a> <span class="muted">· 🎧 2:03</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://breakthroughadvertisingbook.com/breakthrough-advertising-book/" target="_blank" rel="noopener">Breakthrough Advertising, official publisher&#x27;s page</a></li><li><a href="https://auresnotes.com/summary-breakthrough-advertising-eugene-schwartz/" target="_blank" rel="noopener">Chapter-by-chapter summary (Aure&#x27;s Notes)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 6.1<button class="ts" data-t="33.54" title="Play the audio from here">▶ 0:34</button><label class="readchk"><input type="checkbox" data-k="6-1"> Mark as done</label></div><h2 data-t="33.54"><span class="num">6.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>You cannot create desire. You can only channel it.</span></h2></header><p data-say data-t="38.46">Schwartz&#x27;s starting point changes how you think about copy. Copy cannot create desire for a product. It can only take hopes, fears and wants that already exist in millions of people and point them at one product.</p><p data-say data-t="52.71">He calls this mass desire. It exists before your ad. People already want to feel healthy, look good, save time, be respected, protect their family. Your job is not to make them want something new. It is to show them that your product satisfies a want they already have.</p><p data-say data-t="70.64">This takes huge pressure off the writer. You do not need to convince anyone to care about sparkling water. You need to find people who already care, and connect the carbonator to what they already want: less hassle, a nicer kitchen, fewer plastic bottles, a habit they enjoy.</p><p data-say data-t="88.09">It also explains why some ads fail no matter how well they are written. If the desire isn&#x27;t there, no copy will put it there.</p><aside class="co co-example" data-t="97.02"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Channel, don&#x27;t create.</div><p data-say>Creating desire: &quot;You should start drinking sparkling water.&quot; Channelling it: &quot;You already love sparkling water. Here&#x27;s how to stop carrying it home.&quot; The second starts from a want the reader already has.</p></aside><aside class="co co-agency" data-t="113.98"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before writing, list three desires your buyer already has, in their own words, from reviews and comments. Pick one. Your hook connects the product to that desire. If you catch yourself trying to convince people to want something, stop and find a different desire.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 6.2<button class="ts" data-t="132.63" title="Play the audio from here">▶ 2:13</button><label class="readchk"><input type="checkbox" data-k="6-2"> Mark as done</label></div><h2 data-t="132.63"><span class="num">6.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Read the market&#x27;s awareness before you write the headline.</span></h2></header><p data-say data-t="138.00">Schwartz&#x27;s most famous tool is the levels of awareness. Your prospect is at one of five stages, and the headline must start where they are.</p><p data-say data-t="147.84">Most aware: they know your product and want it; they just need the offer. Product aware: they know your product but aren&#x27;t sure it&#x27;s right for them. Solution aware: they know what result they want, but not that your product delivers it. Problem aware: they feel a problem but don&#x27;t know a solution exists. Unaware: they don&#x27;t even see the problem yet.</p><p data-say data-t="169.40">The less aware the reader, the less your headline should talk about the product. For the most aware, you can lead with the brand name and a price. For the unaware, the product name means nothing; you have to start with something they recognise about themselves.</p><p data-say data-t="185.09">On Meta this maps neatly onto audiences. Retargeting audiences are often most aware or product aware. Broad cold audiences are often problem aware or unaware.</p><aside class="co co-example" data-t="198.36"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>One product, five headlines.</div><p data-say>Most aware: &quot;Carbonator 3, starter kit now with free shipping.&quot; Product aware: &quot;Why owners keep their Carbonator for years.&quot; Solution aware: &quot;Make sparkling water at home with no plug.&quot; Problem aware: &quot;Tired of carrying heavy bags of bottles home?&quot; Unaware: &quot;How much does your family really spend on bottled bubbles each year?&quot;</p></aside><aside class="co co-agency" data-t="225.36"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Label every ad concept with an awareness level. For cold audiences, test problem-aware and unaware hooks. For retargeting, test most-aware offers. Never show an unaware audience an ad that starts with your brand name.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 6.3<button class="ts" data-t="242.79" title="Play the audio from here">▶ 4:03</button><label class="readchk"><input type="checkbox" data-k="6-3"> Mark as done</label></div><h2 data-t="242.79"><span class="num">6.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>For unaware buyers, start with them, not the product.</span></h2></header><p data-say data-t="248.35">The hardest level is the unaware reader. Schwartz says that here the headline cannot mention the product or even the need directly. It has to start with something the reader already identifies with: their situation, their identity, a feeling, a story.</p><p data-say data-t="265.73">This is why many successful cold-traffic ads look like stories, quizzes or surprising facts. They earn the right to talk about the problem, and only then introduce the solution.</p><p data-say data-t="277.82">For unaware audiences, the ad has to do more work. It needs more time, more story and more steps. A fifteen-second product shot will not work on someone who does not know they have the problem.</p><p data-say data-t="291.55">The risk is going too vague. &quot;Life is better with bubbles&quot; is not identification; it is fog. The opening must be specific to a real situation the reader will recognise.</p><aside class="co co-example" data-t="303.79"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Unaware opening.</div><p data-say>&quot;If you&#x27;ve ever carried twelve bottles up the stairs and thought &#x27;there must be a better way,&#x27; this is for you.&quot; The reader recognises the moment before they know there is a product. Then: &quot;There is. Here&#x27;s what we use now.&quot;</p></aside><aside class="co co-agency" data-t="320.33"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For your cold-audience concepts, write openings that name a moment, not a product. Use a creator&#x27;s voice telling a short story. Hold the product reveal until after the reader has recognised themselves.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 6.4<button class="ts" data-t="335.23" title="Play the audio from here">▶ 5:35</button><label class="readchk"><input type="checkbox" data-k="6-4"> Mark as done</label></div><h2 data-t="335.23"><span class="num">6.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Read the market&#x27;s sophistication: what has it already heard?</span></h2></header><p data-say data-t="340.58">Schwartz&#x27;s second map is market sophistication: how many similar promises the market has already heard. He describes five stages.</p><p data-say data-t="350.16">Stage one: you are first, so a simple direct claim works. Stage two: competitors copy, so you enlarge the claim, bigger, faster, more. Stage three: claims stop working, so you introduce a new mechanism, a new way the result is achieved. Stage four: competitors copy the mechanism, so you elaborate or improve it. Stage five: the market is exhausted and stops believing claims, so you lead with identification, connecting with who the buyer is.</p><p data-say data-t="384.74">Most DTC categories are at stage three or later. &quot;Make sparkling water at home&quot; was news once. Today buyers have seen it many times. Shouting it louder will not work.</p><p data-say data-t="397.94">This is why two ads with the same promise perform differently in different markets. The words haven&#x27;t changed. The market has.</p><aside class="co co-example" data-t="406.84"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Carbonators by stage.</div><p data-say>Stage 1: &quot;Make sparkling water at home.&quot; Stage 2: &quot;Make sparkling water at home in seconds.&quot; Stage 3: &quot;A carbonator with no electronics, so there is nothing to charge or break.&quot; Stage 4: &quot;Tested through more than ten thousand cycles.&quot; Stage 5: &quot;For people who care how their kitchen looks.&quot;</p></aside><aside class="co co-agency" data-t="433.12"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Look at your client&#x27;s competitors in the Ad Library. List the main claims they make. If everyone makes the same claim, you are past stage two. Move to a mechanism or to identification.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 6.5<button class="ts" data-t="446.90" title="Play the audio from here">▶ 7:27</button><label class="readchk"><input type="checkbox" data-k="6-5"> Mark as done</label></div><h2 data-t="446.90"><span class="num">6.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Mechanism: explain how it works, and make the claim new again.</span></h2></header><p data-say data-t="452.82">When a market tires of claims, Schwartz says, give it a mechanism. Explain how the product produces the result. A mechanism makes an old promise believable and fresh.</p><p data-say data-t="465.14">He calls this technique mechanization. You show the inner working: the process, the ingredient, the design choice. The reader thinks &quot;oh, that&#x27;s why it works,&quot; and the claim lands again.</p><p data-say data-t="478.58">A good mechanism is real, specific and easy to picture. It is not invented jargon. If the brand has a real process, test, ingredient or design, that is your mechanism.</p><p data-say data-t="492.33">This connects back to Hopkins&#x27; Schlitz story in Module 1. Hopkins explained the brewing process nobody else had described. That was a mechanism before Schwartz named it.</p><aside class="co co-example" data-t="503.58"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Real mechanism.</div><p data-say>&quot;No electricity needed&quot; becomes a mechanism when you explain it: &quot;It works with a mechanical lever and a gas cylinder, so there&#x27;s no motor, no battery and nothing to charge.&quot; The reader can picture it, and it answers the unspoken worry: what breaks first?</p></aside><aside class="co co-agency" data-t="524.37"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Ask your client: what does the product do differently, physically, and why does that produce the result? Turn the answer into one sentence starting &quot;It works because...&quot;. Test it as a hook against your best claim.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 6.6<button class="ts" data-t="540.11" title="Play the audio from here">▶ 9:00</button><label class="readchk"><input type="checkbox" data-k="6-6"> Mark as done</label></div><h2 data-t="540.11"><span class="num">6.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Intensification: make the desire vivid.</span></h2></header><p data-say data-t="545.22">Schwartz&#x27;s techniques section starts with intensification: once you have the reader&#x27;s attention, make the desire bigger and more vivid. Show the benefit in action. Add detail. Compare it. Let the reader experience it in their head.</p><p data-say data-t="561.04">This is not exaggeration. It is description. The more concretely the reader can see and feel the result, the more they want it.</p><p data-say data-t="570.28">Intensification has an order. Start with the main benefit, then deepen it with details, examples, comparisons and proof. Each step makes it more real.</p><p data-say data-t="581.03">In video, intensification is close-ups, sound and the moment of use: the hiss of gas, the bubbles rising, the first cold sip. On a product page, it&#x27;s photos of use and short descriptions of moments.</p><aside class="co co-example" data-t="596.72"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Intensifying one benefit.</div><p data-say>Benefit: &quot;sparkling water at home.&quot; Intensified: &quot;Press the lever. Hear the hiss. Watch the bubbles rise. Pour it over ice and add a slice of lemon. Three seconds, and you never left the kitchen.&quot; Same benefit, now something you can almost taste.</p></aside><aside class="co co-agency" data-t="617.87"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For your lead benefit, write three lines of sensory detail: what the buyer sees, hears and feels. Use them as shot directions in a creator brief. Make sure every detail is true for the product.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 6.7<button class="ts" data-t="633.83" title="Play the audio from here">▶ 10:34</button><label class="readchk"><input type="checkbox" data-k="6-7"> Mark as done</label></div><h2 data-t="633.83"><span class="num">6.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Identification: sell the role, not just the result.</span></h2></header><p data-say data-t="639.32">Schwartz&#x27;s next technique is identification. People don&#x27;t only buy results; they buy a picture of the person they are or want to be. Copy can connect the product to that role.</p><p data-say data-t="650.79">For a carbonator, the roles might be the person with a beautiful kitchen, the one who cares about less plastic, the host whose guests always get something nice to drink. The ad shows the product as part of that identity.</p><p data-say data-t="664.47">This becomes the main tool at the fifth stage of sophistication, when buyers have heard every claim. They stop listening to promises but still respond to &quot;this is for people like you.&quot;</p><p data-say data-t="676.62">Be careful. Identification only works if it&#x27;s true to the buyer and specific. Generic lifestyle images with no real person behind them do nothing.</p><aside class="co co-example" data-t="687.97"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Identity hook.</div><p data-say>&quot;For people who notice the details in their kitchen.&quot; Paired with a slow shot of the steel carbonator next to a good knife and a wooden board. No claim at all, but the buyer who sees themselves in it stops.</p></aside><aside class="co co-agency" data-t="703.33"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Read your client&#x27;s reviews and write down the identity buyers describe: &quot;as someone who cooks a lot&quot;, &quot;as a mum of three&quot;. Write one hook that speaks only to that identity. Test it in the late-stage, exhausted parts of the market.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 6.8<button class="ts" data-t="719.67" title="Play the audio from here">▶ 12:00</button><label class="readchk"><input type="checkbox" data-k="6-8"> Mark as done</label></div><h2 data-t="719.67"><span class="num">6.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Gradualization and redefinition: build belief step by step, reframe the objection.</span></h2></header><p data-say data-t="727.90">Two more techniques are useful every day. Gradualization means building belief step by step. Start with a statement the reader already accepts, then add the next one, then the next, until the big claim feels like the natural conclusion.</p><p data-say data-t="745.04">Redefinition means reframing a drawback so it stops blocking the sale. The classic case is price. If the product looks expensive, show the cost in a way that changes the comparison, such as cost per use, per litre or per year.</p><p data-say data-t="761.09">Both techniques respect the reader. You don&#x27;t push the big claim on them at the start. You walk with them.</p><p data-say data-t="767.69">For performance ads, gradualization shapes the script order. Redefinition shapes how you handle the top objection in the body or the first comment.</p><aside class="co co-example" data-t="778.66"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Redefining the price.</div><p data-say>Objection: &quot;2,450 kronor is a lot for a carbonator.&quot; Redefinition, only with correct figures: compare against what the buyer spends on bottled sparkling water in a year, using their own consumption. Let them do the maths with real prices; never invent the savings.</p></aside><aside class="co co-agency" data-t="801.34"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>List the top objection from your client&#x27;s reviews. Write one redefinition that changes the comparison. Then write a five-line gradualization script: four statements the buyer already agrees with, then your claim.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 6.9<button class="ts" data-t="816.41" title="Play the audio from here">▶ 13:36</button><label class="readchk"><input type="checkbox" data-k="6-9"> Mark as done</label></div><h2 data-t="816.41"><span class="num">6.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Camouflage and concentration: borrow a trusted format, and use the competitors&#x27; weakness.</span></h2></header><p data-say data-t="824.66">Schwartz&#x27;s last two techniques are camouflage and concentration. Camouflage means presenting the ad in a form the reader trusts, such as the look of an article or a recommendation, so it is read with less suspicion. Concentration means focusing on the weakness of the alternatives and showing how your product solves it.</p><p data-say data-t="844.68">Camouflage is the root of advertorials and user-generated style ads. Done honestly, it means matching the native style of the platform: a creator talking, a real review, an explainer. It must still be clearly an ad. Meta requires branded content to be disclosed, and misleading people is never the goal.</p><p data-say data-t="866.81">Concentration has to be handled carefully. Hopkins warned that attacking competitors looks unfair. The safe version is to name the problem with the alternative, not the competitor: bottles are heavy, electric machines need a socket.</p><aside class="co co-example" data-t="883.54"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Native and honest.</div><p data-say>A creator says, &quot;I&#x27;ve had this for six months, here&#x27;s what I like and the one thing I don&#x27;t.&quot; That is camouflage in the good sense: the native format of the platform, a real opinion, and the ad is still labelled. Then concentration: &quot;No plug, unlike the machines I tried before.&quot;</p></aside><aside class="co co-agency" data-t="904.99"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Brief one concept in the native style of Reels: a creator, a real kitchen, an honest drawback. Make the comparison about the alternative category, never a named competitor. Check that paid partnerships are disclosed.</p></aside></section><section class="sec" id="L10" data-sec="10"><header class="sh"><div class="sk">Lesson 6.10<button class="ts" data-t="922.13" title="Play the audio from here">▶ 15:22</button><label class="readchk"><input type="checkbox" data-k="6-10"> Mark as done</label></div><h2 data-t="922.13"><span class="num">6.10</span> <span class="lsay" data-say>Lesson 10.</span> <span data-say>Worked example: one brief, three audiences, three different ads.</span></h2></header><p data-say data-t="928.84">Let us put the maps together on one brief. The product is a carbonator. The market is crowded, so sophistication is at stage three or beyond. We will write for three audiences in the same account.</p><p data-say data-t="942.91">For a broad cold audience, most people are problem aware at best. So the ad opens on a moment: a creator carrying heavy bags up the stairs. The product appears only after the viewer recognises the moment. Then one mechanism line: no electronics, nothing to charge. Then one proof line: tested for more than ten thousand cycles.</p><p data-say data-t="967.92">For people who have watched a video or visited the site, awareness is higher. They know the product but have doubts. So the ad answers the top objection, price, with an honest redefinition built from real prices, and shows the warranty.</p><p data-say data-t="983.78">For people who added the product to their cart, they are most aware. The ad is almost pure offer: the product, the starter kit, the warranty, and a clear reason to finish today, only if one is true.</p><p data-say data-t="997.12">Three ads, three starting points, and none of them is better than the others in general. Each one is right for the reader in front of it. That is Schwartz&#x27;s whole book in one account structure.</p><aside class="co co-example" data-t="1009.65"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The account map.</div><p data-say>Cold: moment, then mechanism, then proof. Warm: objection, redefinition, warranty. Hot: offer and reason to act. Write the awareness level and the sophistication move on top of each concept, so the client sees the logic, not only the words.</p></aside><aside class="co co-agency" data-t="1031.28"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For one brand you want to work with, draw this three-row map with one hook per row. It fits on a single page and shows a hiring manager you think in audiences and stages, not just in nice lines.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="1045.24">That&#x27;s the end of Module 6. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Map the account: cold = moment + mechanism; warm = objection; hot = offer.</li><li>Copy can&#x27;t create desire. Find the mass desire and channel it.</li><li>Five awareness levels: most aware, product, solution, problem, unaware. Start where they are.</li><li>Unaware readers: start with their moment, not your product.</li><li>Five sophistication stages: claim, bigger claim, mechanism, better mechanism, identification.</li><li>Mechanism: &quot;It works because...&quot; Real, specific, easy to picture.</li><li>Intensify the desire with true sensory detail.</li><li>Identification: sell the role. Gradualize belief. Redefine the objection.</li><li>Camouflage honestly in native formats; attack the problem, not the competitor.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 10 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="6"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 10 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://breakthroughadvertisingbook.com/breakthrough-advertising-book/" target="_blank" rel="noopener">Breakthrough Advertising, official publisher&#x27;s page</a></li><li><a href="https://auresnotes.com/summary-breakthrough-advertising-eugene-schwartz/" target="_blank" rel="noopener">Summary of awareness, sophistication and the seven techniques (Aure&#x27;s Notes)</a></li><li><a href="https://www.aarke.com/" target="_blank" rel="noopener">Aarke facts (product page, read Nov 2026)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m05"><small>← Previous</small>Module 5: The Boron Letters</a><a class="nx" href="#m07"><small>Next →</small>Module 7: The Adweek Copywriting Handbook</a></nav></article></main></template>
<template id="v-m07" data-cls="chpage hasaudio" data-title="Module 7: The Adweek Copywriting Handbook · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 7</b> <span>The Adweek Copywriting Handbook</span></div><div class="tb-r"><a class="ib" href="#m08" title="Next: Module 8">8 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m07-the-adweek-copywriting-handbook.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 7 · Contents</div><div class="tc-t">The Adweek Copywriting Handbook</div><ol class="tc"><li><a href="#m07/glance">At a glance</a></li><li class="l2"><a href="#m07/L1"><span class="n">7.1</span> Everything in the ad exists to get the first sentence read.</a></li><li class="l2"><a href="#m07/L2"><span class="n">7.2</span> The first sentence sells the second: build a slippery slide.</a></li><li class="l2"><a href="#m07/L3"><span class="n">7.3</span> Create a buying environment, and get the reader nodding.</a></li><li class="l2"><a href="#m07/L4"><span class="n">7.4</span> Keep them reading with curiosity, but aim it at buyers.</a></li><li class="l2"><a href="#m07/L5"><span class="n">7.5</span> Sell the concept, not the product.</a></li><li class="l2"><a href="#m07/L6"><span class="n">7.6</span> Answer every question in the order they ask it.</a></li><li class="l2"><a href="#m07/L7"><span class="n">7.7</span> Sell the cure, not the prevention.</a></li><li class="l2"><a href="#m07/L8"><span class="n">7.8</span> Make it personal, and tell a story.</a></li><li class="l2"><a href="#m07/L9"><span class="n">7.9</span> Don&#x27;t assume limits that aren&#x27;t there: test the strange idea.</a></li><li class="l2"><a href="#m07/L10"><span class="n">7.10</span> Incubate, then edit to the fewest words.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m07/quiz">✅ Questions (9)</a></li><li><a href="#m07/play">🛠️ Playground (3)</a></li><li><a href="#m07/cards">🃏 Lesson cards (10)</a></li><li><a href="#m07/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07" aria-current="page"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 7 · Joseph Sugarman · 2006</div><h1 data-t="0.30"><span class="chn">Module 7</span><span data-say>The Adweek Copywriting Handbook</span> <span class="h1sub" data-say>by Joseph Sugarman</span></h1><div class="lead"><p data-say data-t="5.84">Joseph Sugarman sold electronics and gadgets by mail through his company JS&amp;A, with long, chatty print ads he wrote himself, and later sold BluBlocker sunglasses. The Adweek Copywriting Handbook, published by Wiley in 2006, is based on his earlier book, Advertising Secrets of the Written Word. Its core is a set of axioms, short rules about how readers move through copy. If Halbert gives you the process, Sugarman gives you the physics of attention: why people keep reading, line after line. Here are the axioms that matter most for ads and emails, in plain English.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 16:04</span><span>10 lessons</span><span>9 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m07/L1"><b>7.1 Everything in the ad exists to get the first sentence read.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m07/L2"><b>7.2 The first sentence sells the second: build a slippery slide.</b></a> <span class="muted">· 🎧 1:32</span></li><li><a href="#m07/L3"><b>7.3 Create a buying environment, and get the reader nodding.</b></a> <span class="muted">· 🎧 1:36</span></li><li><a href="#m07/L4"><b>7.4 Keep them reading with curiosity, but aim it at buyers.</b></a> <span class="muted">· 🎧 1:33</span></li><li><a href="#m07/L5"><b>7.5 Sell the concept, not the product.</b></a> <span class="muted">· 🎧 1:21</span></li><li><a href="#m07/L6"><b>7.6 Answer every question in the order they ask it.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m07/L7"><b>7.7 Sell the cure, not the prevention.</b></a> <span class="muted">· 🎧 1:18</span></li><li><a href="#m07/L8"><b>7.8 Make it personal, and tell a story.</b></a> <span class="muted">· 🎧 1:23</span></li><li><a href="#m07/L9"><b>7.9 Don&#x27;t assume limits that aren&#x27;t there: test the strange idea.</b></a> <span class="muted">· 🎧 1:46</span></li><li><a href="#m07/L10"><b>7.10 Incubate, then edit to the fewest words.</b></a> <span class="muted">· 🎧 1:23</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://larslofgren.com/joseph-sugarman/" target="_blank" rel="noopener">The 17 axioms, listed with commentary (Lars Lofgren)</a></li><li><a href="https://www.wiley.com/en-us/the-adweek-copywriting-handbook-the-ultimate-guide-to-writing-powerful-advertising-and-marketing-copy-from-one-of-america&#x27;s-top-copywriters-p-9780470051245" target="_blank" rel="noopener">The Adweek Copywriting Handbook (Wiley), publisher listing</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 7.1<button class="ts" data-t="45.76" title="Play the audio from here">▶ 0:46</button><label class="readchk"><input type="checkbox" data-k="7-1"> Mark as done</label></div><h2 data-t="45.76"><span class="num">7.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Everything in the ad exists to get the first sentence read.</span></h2></header><p data-say data-t="51.08">Sugarman&#x27;s second axiom is the one most people remember. Every element of an ad, the headline, the picture, the caption, the layout, has one main job: to get the reader to read the first sentence of the copy.</p><p data-say data-t="66.32">That is a narrower goal than &quot;get attention&quot;. Attention that doesn&#x27;t lead into the copy is wasted. A beautiful image that makes people look but not read has failed at its job, however much people admire it.</p><p data-say data-t="80.24">It also gives you a clean test for every visual decision. Does this make the first line more likely to be read, or less? A busy background, a clever headline that needs decoding, or a long brand intro all make it less likely.</p><p data-say data-t="95.91">On Meta, the equivalent is the first second of the video and the first line of primary text. The visual hook should lead straight into a spoken or written first line, not compete with it.</p><aside class="co co-example" data-t="109.11"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The image serves the first line.</div><p data-say>A video opens on a hand carrying heavy bags up the stairs, and the first caption reads: &quot;This was me every Saturday.&quot; The image and the first line work as one. Compare a slick product spin with music and no words: pretty, but it leads into nothing.</p></aside><aside class="co co-agency" data-t="129.54"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For your next ad, write the first line before you choose the visual. Then pick the visual that makes that line impossible not to read. In email, the subject line&#x27;s only job is to get the first sentence read.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 7.2<button class="ts" data-t="144.80" title="Play the audio from here">▶ 2:25</button><label class="readchk"><input type="checkbox" data-k="7-2"> Mark as done</label></div><h2 data-t="144.80"><span class="num">7.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>The first sentence sells the second: build a slippery slide.</span></h2></header><p data-say data-t="150.51">The next axiom follows from the first. The only purpose of the first sentence is to get the reader to read the second sentence. Then the second sells the third, and so on, until the reader reaches the order form.</p><p data-say data-t="165.08">Sugarman calls this the slippery slide. Once the reader starts, the copy should be so easy and interesting that they slide all the way down without stopping.</p><p data-say data-t="175.85">He makes first sentences very short, so they are almost impossible not to read. A few words. A question. A small surprise. Then every sentence after it gives a small reason to keep going: a hint of what&#x27;s next, a question left open, a story that hasn&#x27;t ended.</p><p data-say data-t="195.08">For a fifteen-second video, the slide is the script. If one line is dull, people swipe away and never see the offer at the end.</p><aside class="co co-example" data-t="204.84"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Short first sentence.</div><p data-say>&quot;I was wrong about sparkling water.&quot; That&#x27;s the whole first line. You want to know how. The second line: &quot;I thought making it at home meant a noisy machine and a plug.&quot; Now you want the turn. &quot;Then I tried one with neither.&quot;</p></aside><aside class="co co-agency" data-t="221.96"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Make your first sentence seven words or fewer. Read your script aloud and mark every place where your own attention dips. Rewrite those lines so each one makes the next one necessary.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 7.3<button class="ts" data-t="236.62" title="Play the audio from here">▶ 3:57</button><label class="readchk"><input type="checkbox" data-k="7-3"> Mark as done</label></div><h2 data-t="236.62"><span class="num">7.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Create a buying environment, and get the reader nodding.</span></h2></header><p data-say data-t="241.61">Sugarman says the layout and first paragraphs must create the right buying environment for the product. A serious product needs a serious, credible feel. A fun product can be playful. The environment tells the reader what kind of decision this is.</p><p data-say data-t="258.62">Inside that environment, he wants the reader to agree with you, line by line. Make accurate, truthful statements the reader will say yes to. Each small yes builds a feeling that you understand them, which makes the bigger yes easier.</p><p data-say data-t="273.94">This is not a trick. It only works if the statements are true and come from real understanding of the buyer, which comes from research and reviews.</p><p data-say data-t="282.96">On a landing page, the buying environment is the design, the photos and the tone. In a cold email, it is plain text, a real name, and a calm, specific tone.</p><aside class="co co-example" data-t="295.54"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Yes, yes, yes.</div><p data-say>&quot;You like sparkling water. You don&#x27;t like carrying it home. And you don&#x27;t want another gadget that needs charging.&quot; Three statements the right reader nods along to. Now: &quot;That&#x27;s exactly why I switched to a manual carbonator.&quot; The fourth line lands on prepared ground.</p></aside><aside class="co co-agency" data-t="316.08"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Open your next script with two or three true statements your buyer will agree with, taken from reviews. Then introduce the product. In a cold email, start with something true about their business they will agree with, not with yourself.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 7.4<button class="ts" data-t="332.16" title="Play the audio from here">▶ 5:32</button><label class="readchk"><input type="checkbox" data-k="7-4"> Mark as done</label></div><h2 data-t="332.16"><span class="num">7.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Keep them reading with curiosity, but aim it at buyers.</span></h2></header><p data-say data-t="337.68">Sugarman relies heavily on curiosity. Hint at what&#x27;s coming. Raise a question and answer it later. Leave a thread open. He even uses short transition lines that promise more, such as &quot;But there&#x27;s more&quot; or &quot;Here&#x27;s why&quot;, to pull the reader into the next paragraph.</p><p data-say data-t="355.32">Curiosity is powerful because the mind dislikes unfinished business. But it needs aiming. Curiosity about something irrelevant to the purchase attracts the curious, not the buyers. That is the same warning Caples gave in Module 2.</p><p data-say data-t="372.45">The best curiosity is curiosity about the benefit: how does it work, what&#x27;s the catch, how did she get that result.</p><p data-say data-t="381.02">In video, open loops at the start and close them before the call to action. Never leave the viewer without the answer you promised; that feels like a cheat.</p><aside class="co co-example" data-t="391.12"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Curiosity aimed at the sale.</div><p data-say>&quot;There&#x27;s one thing I didn&#x27;t expect after six months with this carbonator.&quot; The viewer wants to know, and the answer sells: &quot;I haven&#x27;t bought a single bottle since.&quot; Curiosity about the benefit, closed honestly.</p></aside><aside class="co co-agency" data-t="408.79"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Add one open loop to the first five seconds of your script, about the benefit, and close it before the call to action. In emails, a subject like &quot;one thing in your reviews&quot; works only if the email actually delivers that one thing.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 7.5<button class="ts" data-t="425.20" title="Play the audio from here">▶ 7:05</button><label class="readchk"><input type="checkbox" data-k="7-5"> Mark as done</label></div><h2 data-t="425.20"><span class="num">7.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Sell the concept, not the product.</span></h2></header><p data-say data-t="429.38">Sugarman says never sell a product; sell a concept. People don&#x27;t buy the object. They buy what it means: the result, the idea, the way it fits their life.</p><p data-say data-t="441.14">A pair of sunglasses is an object. Sunglasses that make the world look sharper are a concept. A carbonator is an object. A kitchen with sparkling water on tap and no bottles is a concept.</p><p data-say data-t="455.25">This is close to Halbert&#x27;s central selling idea and Schwartz&#x27;s mass desire. The concept is the frame that makes the features matter.</p><p data-say data-t="464.97">A good concept is simple enough to say in one line, and it changes how the reader sees the product category.</p><aside class="co co-example" data-t="472.79"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Object versus concept.</div><p data-say>Object: &quot;Steel carbonator with a lever and a gas cylinder.&quot; Concept: &quot;Your tap, with bubbles.&quot; The features follow inside the concept: no plug, sixty litres per cylinder, tested for ten thousand cycles.</p></aside><aside class="co co-agency" data-t="492.38"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write your client&#x27;s product as an object in one line, then as a concept in one line. Test the concept line as the hook. Use the object details as proof in the body.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 7.6<button class="ts" data-t="505.98" title="Play the audio from here">▶ 8:26</button><label class="readchk"><input type="checkbox" data-k="7-6"> Mark as done</label></div><h2 data-t="505.98"><span class="num">7.6</span> <span class="lsay" data-say>Lesson 6.</span> <span

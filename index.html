 swipe file that feeds you.</a></li><li class="l2"><a href="#m12/L3"><span class="n">12.3</span> Step two: pick the brief and do The Suck.</a></li><li class="l2"><a href="#m12/L4"><span class="n">12.4</span> Step three: find the central selling idea, and test it.</a></li><li class="l2"><a href="#m12/L5"><span class="n">12.5</span> Step four: the ten-minute fast draft.</a></li><li class="l2"><a href="#m12/L6"><span class="n">12.6</span> Step five: rebuild it into the seven steps.</a></li><li class="l2"><a href="#m12/L7"><span class="n">12.7</span> Step six: read it aloud and tighten.</a></li><li class="l2"><a href="#m12/L8"><span class="n">12.8</span> Step seven: turn it into a SoScale-style test pack.</a></li><li class="l2"><a href="#m12/L9"><span class="n">12.9</span> Package the portfolio, and let it sell you.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m12/quiz">✅ Questions (10)</a></li><li><a href="#m12/play">🛠️ Playground (2)</a></li><li><a href="#m12/cards">🃏 Lesson cards (9)</a></li><li><a href="#m12/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12" aria-current="page"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Do the work · the Halbert Method, applied</div><h1 data-t="0.30"><span class="chn">Module 12</span><span data-say>The Halbert Method Workbook</span> <span class="h1sub" data-say>Aarke and DTC briefs, turned into portfolio pieces</span></h1><div class="lead"><p data-say data-t="8.68">This is the module where you stop listening and start producing. You will run Halbert&#x27;s method from Module 4, step by step, on real briefs: the Aarke Carbonator 3, using facts from Aarke&#x27;s own product page, and practice briefs in the style of the DTC brands that performance agencies like SoScale work with. The workbook in the playground saves everything in your browser and exports a clean document at the end. Every piece you finish is a portfolio piece, labelled honestly as spec work.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 16:26</span><span>9 lessons</span><span>10 questions</span><span>2 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m12/L1"><b>12.1 Treat the method as a production line, not a mood.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m12/L2"><b>12.2 Step one: build the swipe file that feeds you.</b></a> <span class="muted">· 🎧 1:36</span></li><li><a href="#m12/L3"><b>12.3 Step two: pick the brief and do The Suck.</b></a> <span class="muted">· 🎧 2:10</span></li><li><a href="#m12/L4"><b>12.4 Step three: find the central selling idea, and test it.</b></a> <span class="muted">· 🎧 1:41</span></li><li><a href="#m12/L5"><b>12.5 Step four: the ten-minute fast draft.</b></a> <span class="muted">· 🎧 1:33</span></li><li><a href="#m12/L6"><b>12.6 Step five: rebuild it into the seven steps.</b></a> <span class="muted">· 🎧 1:56</span></li><li><a href="#m12/L7"><b>12.7 Step six: read it aloud and tighten.</b></a> <span class="muted">· 🎧 1:27</span></li><li><a href="#m12/L8"><b>12.8 Step seven: turn it into a SoScale-style test pack.</b></a> <span class="muted">· 🎧 1:52</span></li><li><a href="#m12/L9"><b>12.9 Package the portfolio, and let it sell you.</b></a> <span class="muted">· 🎧 1:45</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">Halbert&#x27;s method, the source of every step here</a></li><li><a href="https://www.aarke.com/" target="_blank" rel="noopener">Aarke Carbonator 3, product facts used in the brief</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 12.1<button class="ts" data-t="40.02" title="Play the audio from here">▶ 0:40</button><label class="readchk"><input type="checkbox" data-k="12-1"> Mark as done</label></div><h2 data-t="40.02"><span class="num">12.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Treat the method as a production line, not a mood.</span></h2></header><p data-say data-t="45.18">Most beginners wait to feel inspired. Halbert&#x27;s method is the opposite: a fixed sequence you run every time, whether you feel like it or not. Swipe file, research, central selling idea, fast draft, seven steps, read aloud, tighten. Each step has an output you can see.</p><p data-say data-t="65.43">That&#x27;s what makes it useful for a job. A performance agency doesn&#x27;t need one brilliant ad a month. It needs a steady stream of good, testable ads every week. A method gives you that.</p><p data-say data-t="78.75">It also makes your work explainable. When you show a hiring manager a finished ad, you can show the nugget notes behind it, the central selling idea, the first draft and the rewrite. That proves you can do it again, which matters more than one good line.</p><p data-say data-t="94.45">The workbook follows the steps in order. Do them in order the first few times. Later you&#x27;ll move faster, but the sequence stays.</p><aside class="co co-example" data-t="103.57"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>One brief, one hour.</div><p data-say>Ten minutes on the swipe file. Twenty minutes of research and nugget notes. Five minutes on the central selling idea. Ten minutes of fast draft. Ten minutes on the seven steps. Five minutes reading aloud and tightening. One hour, one finished ad, with all the working shown.</p></aside><aside class="co co-agency" data-t="124.90"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Block one hour today and run the full method on the Aarke brief in the workbook. Don&#x27;t skip a step, and don&#x27;t polish. The goal of the first run is to finish, not to be brilliant.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 12.2<button class="ts" data-t="138.87" title="Play the audio from here">▶ 2:19</button><label class="readchk"><input type="checkbox" data-k="12-2"> Mark as done</label></div><h2 data-t="138.87"><span class="num">12.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Step one: build the swipe file that feeds you.</span></h2></header><p data-say data-t="143.74">The workbook starts with a swipe file. You can add the headline patterns from this course with one button, then add your own: headlines from magazine covers and news sites, and hooks from ads that have been running for a long time in the Meta Ad Library.</p><p data-say data-t="158.00">Tag each one by pattern: how to, question, number, secret, story, news, identity, confession. Tags let you filter and shuffle later.</p><p data-say data-t="169.71">Then use Halbert&#x27;s card shuffle. The &quot;deal me five&quot; button picks five random headlines from your file. Your job is to adapt each one to your brief, the way Halbert turned &quot;Do You Make These Mistakes In English?&quot; into a line about stockbrokers.</p><p data-say data-t="185.93">The swipe file grows every day. Five new entries a day is about a hundred and fifty a month. That&#x27;s the raw material for everything else.</p><aside class="co co-example" data-t="195.24"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A dealt hand for Aarke.</div><p data-say>Dealt: &quot;How to ... without ...&quot;, &quot;They laughed when I ...&quot;, &quot;What everybody ought to know about ...&quot;, &quot;Still ...?&quot;, &quot;At last: ...&quot;. Adapted: &quot;How to drink a litre of bubbles a day without carrying a bottle.&quot; &quot;They laughed when I bought a carbonator. Then they asked for a glass.&quot; &quot;What everybody ought to know about home carbonation.&quot; &quot;Still carrying sparkling water home?&quot; &quot;At last: sparkling water with no plug.&quot;</p></aside><aside class="co co-agency" data-t="221.84"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Add the course patterns, then ten of your own today. Deal five and adapt all five to the Aarke brief. Keep every adaptation in your notes, even the bad ones.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 12.3<button class="ts" data-t="234.58" title="Play the audio from here">▶ 3:55</button><label class="readchk"><input type="checkbox" data-k="12-3"> Mark as done</label></div><h2 data-t="234.58"><span class="num">12.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Step two: pick the brief and do The Suck.</span></h2></header><p data-say data-t="239.69">Next, choose a brief. The Aarke brief uses real facts from Aarke&#x27;s own site: up to sixty litres per gas cylinder, no electricity, tested for more than ten thousand carbonation cycles, a three-year warranty when registered, eighty-seven percent of seven hundred and sixty reviews giving five stars, and a starter kit at two thousand four hundred and fifty kronor. Reviews and press point to price as the main objection.</p><p data-say data-t="268.82">The practice briefs are clearly marked as fictional. They describe the kind of DTC product a Stockholm performance agency might handle, with no invented statistics. Use them to practise the method, but before you publish anything, switch to a real brand and real facts.</p><p data-say data-t="287.35">The third option is your own pick: a real DTC brand you&#x27;d like to work for. Collect facts from its product page and reviews, and note the source of each one.</p><p data-say data-t="297.74">Then write nugget notes, one per line, numbered. Product facts, buyer phrases from reviews, competitor claims, objections, use moments. Aim for thirty. Halbert listed a hundred and fifteen for one book.</p><aside class="co co-example" data-t="313.08"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The first ten Aarke nuggets.</div><p data-say>1 up to 60 litres per cylinder. 2 no electricity. 3 tested 10,000+ cycles. 4 three-year warranty if registered. 5 87% of 760 reviews give five stars. 6 starter kit 2,450 kronor. 7 price is the main objection. 8 reviewers praise the look. 9 manual lever, nothing to charge. 10 the cylinder is swapped when empty.</p></aside><aside class="co co-agency" data-t="348.43"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Fill the nugget notes field with at least thirty lines for your brief. Use the brand&#x27;s site, reviews, and competitors&#x27; active ads. Mark anything you couldn&#x27;t verify with a question mark, and never use it in copy until it&#x27;s checked.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 12.4<button class="ts" data-t="364.37" title="Play the audio from here">▶ 6:04</button><label class="readchk"><input type="checkbox" data-k="12-4"> Mark as done</label></div><h2 data-t="364.37"><span class="num">12.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Step three: find the central selling idea, and test it.</span></h2></header><p data-say data-t="370.27">With thirty notes in front of you, one idea usually keeps coming back. That&#x27;s the central selling idea: the single promise the whole ad is built on.</p><p data-say data-t="380.66">The workbook checks your central selling idea against four tests drawn from this course. It should be twenty words or fewer, so it&#x27;s sharp. It should contain a specific, a number or a fact, so it&#x27;s believable. It should avoid vague words like premium or elevate. And it should be about the buyer, with &quot;you&quot; or &quot;your&quot;.</p><p data-say data-t="402.43">Those checks are a minimum, not a guarantee. Ask two more questions yourself. Would a top salesperson say this to a buyer? Hopkins&#x27; test. And does it fit the market&#x27;s awareness and sophistication? Schwartz&#x27;s test.</p><p data-say data-t="417.16">If you have two strong candidates, keep both. They become two concepts to test against each other, Caples style.</p><aside class="co co-example" data-t="425.01"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Two candidates for Aarke.</div><p data-say>Candidate A: &quot;Never carry sparkling water home again: one cylinder makes up to 60 litres for you.&quot; Candidate B: &quot;Your sparkling water, with no plug and nothing to charge, built for 10,000 cycles.&quot; A is convenience, B is mechanism and durability. Both pass the checks. Test both.</p></aside><aside class="co co-agency" data-t="450.45"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write your central selling idea in the workbook until all four checks turn green. If you have a second one, note it in your nugget notes as &quot;concept B&quot;. These become the hypotheses in your test plan.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 12.5<button class="ts" data-t="465.19" title="Play the audio from here">▶ 7:45</button><label class="readchk"><input type="checkbox" data-k="12-5"> Mark as done</label></div><h2 data-t="465.19"><span class="num">12.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Step four: the ten-minute fast draft.</span></h2></header><p data-say data-t="469.91">Now write fast. The workbook gives you a ten-minute timer and an optional no-delete mode that blocks backspace, so you can&#x27;t edit while you write.</p><p data-say data-t="479.18">Write as if you&#x27;re telling a friend why they need the product. Rave. Describe moments. Use the nugget notes. Don&#x27;t worry about order, length or grammar. Halbert&#x27;s words: forget form, forget grammar.</p><p data-say data-t="494.37">When the timer ends, stop. Let it cool. Take a break, even just fifteen minutes. You&#x27;ll come back with fresher eyes.</p><p data-say data-t="502.91">The draft is not for anyone else. It&#x27;s raw material for the seven steps. It usually contains your best lines, buried in a mess, and the next step digs them out.</p><aside class="co co-example" data-t="514.26"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A real-feeling fast draft.</div><p data-say>&quot;Okay so I was the bottle person. Every Saturday, two bags, four flights. Then this steel thing on the counter, no plug, you pull the lever and it hisses and that&#x27;s it, bubbles. One cylinder does like sixty litres. My partner said it&#x27;s expensive and yeah, 2,450, but we stopped buying bottles...&quot; It&#x27;s messy, and it&#x27;s full of usable lines.</p></aside><aside class="co co-agency" data-t="542.37"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Run the ten-minute draft for your brief now, with no-delete mode on. Don&#x27;t read it until after a break. Then highlight the three best phrases. They usually become your attention line, a proof line and a benefit.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 12.6<button class="ts" data-t="558.11" title="Play the audio from here">▶ 9:18</button><label class="readchk"><input type="checkbox" data-k="12-6"> Mark as done</label></div><h2 data-t="558.11"><span class="num">12.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Step five: rebuild it into the seven steps.</span></h2></header><p data-say data-t="563.60">Now restructure. The workbook gives you seven fields, one for each of Halbert&#x27;s steps, with checks for each.</p><p data-say data-t="571.62">Step one, attention: short, sixteen words or fewer, no vague words. Step two, why interested: expand the central selling idea, talking to &quot;you&quot;. Step three, why believe: a reason it works. Step four, prove it: a number or named source. Step five, itemize benefits: at least three, one per line. Step six, how to order: a clear action. Step seven, order now: a true reason to act today.</p><p data-say data-t="604.79">Pull lines from your fast draft into the fields. Fill the gaps from your nugget notes. Cut anything that fits nowhere.</p><p data-say data-t="613.16">The checks are there to catch the usual mistakes, like a proof step with no proof or an urgency step with no reason. Read the guidance under each field in Module 4 if you&#x27;re unsure.</p><aside class="co co-example" data-t="624.59"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The Aarke seven steps.</div><p data-say>1 &quot;Still carrying sparkling water home?&quot; 2 &quot;Make it at your tap instead, and you&#x27;ll never carry a bottle again.&quot; 3 &quot;It&#x27;s mechanical, so there&#x27;s nothing to charge or break.&quot; 4 &quot;Tested for more than 10,000 carbonation cycles.&quot; 5 &quot;Up to 60 litres per cylinder / steel body / 3-year warranty when registered.&quot; 6 &quot;Tap Shop now and pick your colour.&quot; 7 &quot;Order today and your first glass is this week.&quot;</p></aside><aside class="co co-agency" data-t="658.98"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Fill all seven fields until the checks pass. If the urgency check fails because there is no true reason to act now, write the honest version: &quot;your first glass, this week&quot;. Never invent scarcity.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 12.7<button class="ts" data-t="673.86" title="Play the audio from here">▶ 11:14</button><label class="readchk"><input type="checkbox" data-k="12-7"> Mark as done</label></div><h2 data-t="673.86"><span class="num">12.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Step six: read it aloud and tighten.</span></h2></header><p data-say data-t="678.80">The workbook can read your seven steps aloud with your browser&#x27;s voice. Listen with your eyes closed. Every place where the voice stumbles or your attention dips needs work.</p><p data-say data-t="690.22">Then read the tightening report. It shows the average sentence length, the number of sentences over twenty words, any vague words, and possible passive voice. Aim for an average of fourteen words or fewer, no long sentences, no vague words.</p><p data-say data-t="707.70">Then read it aloud yourself, at real speed, with a timer. For a fifteen-second video, the whole script should fit in about forty words. For a cold email, it should be readable in under thirty seconds.</p><p data-say data-t="722.58">Tightening is mostly cutting. Every word that doesn&#x27;t move the reader towards the sale goes.</p><aside class="co co-example" data-t="729.18"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Tightening one line.</div><p data-say>Before: &quot;It&#x27;s a mechanical device, which means that there&#x27;s basically nothing at all that you&#x27;ll ever need to charge.&quot; After: &quot;It&#x27;s mechanical. Nothing to charge.&quot; Eighteen words became five.</p></aside><aside class="co co-agency" data-t="744.51"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Get the tightening report fully green, then time a read-aloud. Cut until a fifteen-second version fits in fifteen seconds. Save both versions: the full seven steps and the fifteen-second cut.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 12.8<button class="ts" data-t="760.71" title="Play the audio from here">▶ 12:41</button><label class="readchk"><input type="checkbox" data-k="12-8"> Mark as done</label></div><h2 data-t="760.71"><span class="num">12.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Step seven: turn it into a SoScale-style test pack.</span></h2></header><p data-say data-t="766.16">One finished ad is a sample. A test pack is what an agency actually works with. SoScale says on its site that it runs a hypothesis on every ad test and builds creative from research on surveys, reviews and data. So package your work the same way.</p><p data-say data-t="783.87">A test pack has four parts. One: the research summary, your top nuggets with sources. Two: two concepts, A and B, from your central selling ideas, each with a written hypothesis. Three: hooks, about five per concept across different formats: a creator line, a static line, a demonstration caption. Four: one fifteen-second script per concept.</p><p data-say data-t="811.42">Add Meta&#x27;s diversification thinking: make the concepts genuinely different, a different motivation or persona, not two wordings of the same idea.</p><p data-say data-t="821.96">This is the format that shows you think like a performance copywriter, not just a writer.</p><aside class="co co-example" data-t="827.98"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A one-page test pack for Aarke.</div><p data-say>Research: price is the main objection; reviewers praise the look; no-plug design. Concept A, convenience: &quot;We believe the bottle-free hook will beat the design hook for weekly buyers, because reviews mention carrying bottles most.&quot; Concept B, mechanism: &quot;Nothing to charge, built for 10,000 cycles.&quot; Five hooks each. Two scripts. Sources listed.</p></aside><aside class="co co-agency" data-t="857.24"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Build a one-page test pack from your workbook output: research, two concepts with hypotheses, ten hooks, two scripts. Label it &quot;spec work, not commissioned&quot;. Never add results you didn&#x27;t get.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 12.9<button class="ts" data-t="872.60" title="Play the audio from here">▶ 14:33</button><label class="readchk"><input type="checkbox" data-k="12-9"> Mark as done</label></div><h2 data-t="872.60"><span class="num">12.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Package the portfolio, and let it sell you.</span></h2></header><p data-say data-t="877.08">Halbert said a copywriter should be able to sell themselves, and that the legends talk numbers, not awards. You don&#x27;t have results yet, so you talk about thinking: the research, the idea, the hypothesis, and what you would measure.</p><p data-say data-t="891.74">For each portfolio piece, show the before and after if you rewrote an existing ad, the central selling idea, the seven-step copy, the fifteen-second cut, and the test plan. Link the sources of every fact. Label spec work clearly.</p><p data-say data-t="908.59">The workbook&#x27;s export button saves everything as a Markdown document, ready to paste into a portfolio page or a document. Edit it, but keep the structure.</p><p data-say data-t="919.97">Then use it. A cold email to a brand or agency can include one hook from the pack as the free sample, Hopkins&#x27; &quot;offer service&quot;, with one small ask. You write and send those yourself.</p><aside class="co co-example" data-t="933.72"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A portfolio entry outline.</div><p data-say>Title: &quot;Aarke Carbonator 3: spec test pack.&quot; Problem: price objection, crowded category. Central selling idea. Seven-step copy. Fifteen-second script. Hypotheses A and B, with the metric: cost per purchase. Sources. Note: &quot;Spec work. Not affiliated with Aarke.&quot;</p></aside><aside class="co co-agency" data-t="959.59"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Export your first workbook as Markdown today. Turn it into one portfolio entry with the outline above. Then repeat the whole method on a second brand next week. Two honest, well-reasoned entries beat ten pretty ads with no thinking shown.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="977.69">That&#x27;s the end of Module 12. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Run the method every time: swipe, research, idea, draft, seven steps, aloud, tighten.</li><li>Swipe file: tag by pattern, deal five, adapt all five.</li><li>Thirty nugget notes, every fact sourced; question-mark anything unverified.</li><li>Central selling idea: 20 words, a specific, no vague words, about &quot;you&quot;.</li><li>Ten-minute draft, no-delete mode, then let it cool.</li><li>Seven fields, checks green; honest urgency only.</li><li>Aloud, tightening report green, timed 15-second cut.</li><li>Package as a test pack and a portfolio entry, labelled spec work.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 10 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 2 drills</span></summary><div class="pb"><div id="playbox" data-n="12"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 9 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;Hands On Experience&quot; (the method)</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zdzz_the_suck.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;The Suck&quot; (nugget notes)</a></li><li><a href="https://www.aarke.com/" target="_blank" rel="noopener">Aarke (product facts as read on aarke.com/sv-se, November 2026)</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (&quot;hypothesis on every ad test&quot;; research from surveys, reviews and data)</a></li><li><a href="https://en-gb.facebook.com/business/news/three-steps-to-optimize-your-performance-with-creative-diversification" target="_blank" rel="noopener">Meta: creative diversification guidance</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m11"><small>← Previous</small>Module 11: Six Classic Ads, Torn Down</a><a class="nx" href="#index"><small>Done →</small>Back to course home</a></nav></article></main></template>

<template id="v-sources" data-cls="gen" data-title="Sources · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>All sources</b></div><div class="tb-r"><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side" aria-label="Modules"><div class="side-h">All modules</div><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="wide"><h1>Sources and honesty notes</h1><p>Every lesson is original writing that teaches the ideas in these books; no book text is reproduced, and quotes are short and attributed. Facts, figures and quotes were checked against the sources below in November 2026. Results claimed by the old ad men (for example Hopkins on Schlitz, Halbert on the coat-of-arms letter) are their own accounts and are labelled that way. Brand facts for Aarke come from aarke.com as read for Oskar's spec case in November 2026. Practice brands marked "fictional" are made up for drills.</p><h2>Module 1: Scientific Advertising</h2><ul class="srcl"><li><a href="https://www.holloway.com/g/scientific-advertising" target="_blank" rel="noopener">Scientific Advertising, public-domain text (chapters Just Salesmanship, Offer Service, Headlines, Being Specific, Negative Advertising, Test Campaigns)</a></li><li><a href="https://maximumresultscopywriting.com/marketing/classic-marketing-product-story/" target="_blank" rel="noopener">Schlitz story, quoted from My Life in Advertising (1927)</a></li><li><a href="https://rodspots.com/2018/04/24/advertising-lessons-from-1923-and-1927/" target="_blank" rel="noopener">Ogilvy on Scientific Advertising (&quot;read this book seven times&quot;)</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (&quot;Hypothesis on every ad test&quot;)</a></li></ul><h2>Module 2: Tested Advertising Methods</h2><ul class="srcl"><li><a href="https://en.wikipedia.org/wiki/John_Caples" target="_blank" rel="noopener">John Caples, Tested Advertising Methods (1932) and career facts: Wikipedia</a></li><li><a href="https://www.nytimes.com/1990/06/11/obituaries/john-caples-90-author-in-1926-of-they-laughed-when-ad.html" target="_blank" rel="noopener">The New York Times obituary (1990): &quot;They Laughed&quot; ad of 1926, BBDO</a></li><li><a href="https://sirismm.si.edu/EADpdfs/NMAH.AC.0393.pdf" target="_blank" rel="noopener">Smithsonian, John Caples papers (finding aid)</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (&quot;hypothesis on every ad test&quot;)</a></li></ul><h2>Module 3: How to Write a Good Advertisement</h2><ul class="srcl"><li><a href="https://books.google.com/books/about/How_to_Write_a_Good_Advertisement.html?id=qN4JAQAAMAAJ" target="_blank" rel="noopener">How to Write a Good Advertisement (Harper, 1962), Google Books</a></li><li><a href="https://www.scientificadvertising.com/authors/schwab/" target="_blank" rel="noopener">Victor Schwab profile and background</a></li><li><a href="https://en.wikipedia.org/wiki/Sherwin_Cody" target="_blank" rel="noopener">Sherwin Cody (Sackheim&#x27;s ad, Schwab&#x27;s headline comparison)</a></li><li><a href="https://www.aarke.com/" target="_blank" rel="noopener">Aarke facts (product page, read Nov 2026)</a></li></ul><h2>Module 4: The Gary Halbert Letter</h2><ul class="srcl"><li><a href="https://www.thegar dbook</h2><ul class="srcl"><li><a href="https://larslofgren.com/joseph-sugarman/" target="_blank" rel="noopener">The 17 axioms with commentary (Lars Lofgren)</a></li><li><a href="https://www.wiley.com/en-us/the-adweek-copywriting-handbook-the-ultimate-guide-to-writing-powerful-advertising-and-marketing-copy-from-one-of-america&#x27;s-top-copywriters-p-9780470051245" target="_blank" rel="noopener">The Adweek Copywriting Handbook (Wiley, 2006)</a></li></ul><h2>Module 8: Ogilvy on Advertising</h2><ul class="srcl"><li><a href="https://hammock.com/content-marketing/david-ogilvys-house-ad-how-to-create-advertising-that-sells/" target="_blank" rel="noopener">&quot;How to Create Advertising that Sells&quot;, Ogilvy &amp; Mather house ad, full text (Hammock)</a></li><li><a href="https://www.1000headlines.com/h/at-60-miles-an-hour-the-loudest-noise" target="_blank" rel="noopener">Rolls-Royce headline origin (1000 Headlines)</a></li><li><a href="https://rodspots.com/2018/04/24/advertising-lessons-from-1923-and-1927/" target="_blank" rel="noopener">Ogilvy on Scientific Advertising (&quot;read this book seven times&quot;)</a></li></ul><h2>Module 9: The Robert Collier Letter Book</h2><ul class="srcl"><li><a href="https://www.simpson-direct.com/the-6-essentials-plus-that-extra-special-ingredient/" target="_blank" rel="noopener">Collier&#x27;s six essentials (Simpson Direct)</a></li><li><a href="https://smartbrandmarketing.com/robert_collier_letter_book_master_ad_copywriter_lessons/" target="_blank" rel="noopener">Lessons from the Robert Collier Letter Book (Smart Brand Marketing)</a></li><li><a href="https://thegaryhalbertletter.com/newsletters/zakk_grabbers.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;Grabbers&quot; (Collier&#x27;s dollar-bill letter)</a></li></ul><h2>Module 10: Modern Performance Creative</h2><ul class="srcl"><li><a href="https://en-gb.facebook.com/business/news/mobile-first-creative" target="_blank" rel="noopener">Meta: mobile-first creative best practices (10 Jan 2020)</a></li><li><a href="https://en-gb.facebook.com/business/news/three-steps-to-optimize-your-performance-with-creative-diversification" target="_blank" rel="noopener">Meta: three steps to optimise performance with creative diversification (19 Nov 2024)</a></li><li><a href="https://en-gb.facebook.com/business/news/the-creative-advantage-unlocking-the-power-of-diversification-with-meta-andromeda" target="_blank" rel="noopener">Meta: creative diversification with Meta Andromeda (22 Apr 2025)</a></li><li><a href="https://engineering.fb.com/2024/12/02/production-engineering/meta-andromeda-advantage-automation-next-gen-personalized-ads-retrieval-engine/" target="_blank" rel="noopener">Meta Engineering: Andromeda (2 Dec 2024)</a></li><li><a href="https://support.google.com/google-ads/answer/14783551" target="_blank" rel="noopener">Google Ads Help: ABCDs of effective video ads</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (their own claims)</a></li></ul><h2>Module 11: Six Classic Ads, Torn Down</h2><ul class="srcl"><li><a href="https://www.1000headlines.com/h/do-you-make-these-mistakes-in-english" target="_blank" rel="noopener">&quot;Do You Make These Mistakes in English?&quot; (1000 Headlines: 1919, Ruthrauff &amp; Ryan, Schwab&#x27;s comparison)</a></li><li><a href="https://swiped.co/file/do-you-make-these-mistakes-by-max-sackheim/" target="_blank" rel="noopener">Sackheim ad, scan and notes (Swiped)</a></li><li><a href="https://swiped.co/file/about-this-stock-bond-louis-engel/" target="_blank" rel="noopener">Engel&#x27;s stock and bond ad, scans and notes (Swiped)</a></li><li><a href="https://boomerandecho.com/everybody-know-stock-bond-business/" target="_blank" rel="noopener">Engel ad background (Boomer and Echo)</a></li><li><a href="https://thegaryhalbertletter.com/newsletters/zakk_grabbers.htm" target="_blank" rel="noopener">Coat-of-arms letter: Halbert&#x27;s claims (&quot;Grabbers&quot; issue)</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zszs_aida.htm" target="_blank" rel="noopener">Coat-of-arms letter opening, quoted by Halbert (&quot;AIDA&quot; issue)</a></li><li><a href="https://gateway.okhistory.org/ark:/67531/metadc1830121/m1/14/" target="_blank" rel="noopener">Body-fat ad in The Oklahoma Daily, 20 March 1979, p. 14 (Gateway to Oklahoma History)</a></li><li><a href="https://swiped.co/file/body-fat-hour-by-hour-halbert/" target="_blank" rel="noopener">Body-fat ad notes (Swiped)</a></li><li><a href="https://dennyhatch.blogspot.com/2019/07/63-most-astounding-sales-letter-you.html" target="_blank" rel="noopener">Admiral Byrd letter, full text and Benson&#x27;s account (Denny Hatch)</a></li><li><a href="https://texashistory.unt.edu/ark:/67531/metapth353587/m1/75/" target="_blank" rel="noopener">Karbo ad in Scouting, October 1974, p. 75 (Portal to Texas History)</a></li><li><a href="https://www.reversecopy.com/library/lazy-mans-way-to-riches-ad-by-joe-karbo" target="_blank" rel="noopener">Karbo ad transcription (ReverseCopy)</a></li></ul><h2>Module 12: The Halbert Method Workbook</h2><ul class="srcl"><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;Hands On Experience&quot; (the method)</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zdzz_the_suck.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;The Suck&quot; (nugget notes)</a></li><li><a href="https://www.aarke.com/" target="_blank" rel="noopener">Aarke (product facts as read on aarke.com/sv-se, November 2026)</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (&quot;hypothesis on every ad test&quot;; research from surveys, reviews and data)</a></li><li><a href="https://en-gb.facebook.com/business/news/three-steps-to-optimize-your-performance-with-creative-diversification" target="_blank" rel="noopener">Meta: creative diversification guidance</a></li></ul></main></template>

<script>window.KDATA={"chapters": [{"n": 1, "lab": "Module 1", "short": "M1", "title": "Scientific Advertising", "sections": 9, "cards": [{"q": "An ad is a salesperson, so judge it like one.", "a": "Before you ship any Meta ad, read each line aloud and ask: would a great salesperson say this to one buyer, face to face? Cut every line that fails. In a cold email, the same rule kills the opening line \"I hope this finds you well.\""}, {"q": "Specifics get believed. Generalities get ignored.", "a": "In your next hook, swap one adjective for one number from the product page or the reviews. \"Long-lasting\" becomes \"sixty litres per cylinder\". In a cold email to a brand, swap \"I can improve your ads\" for one specific thing you noticed in their Meta Ad Library."}, {"q": "Tell the story nobody else bothered to tell.", "a": "Ask the brand, or read the product page, for the boring process facts: how it is tested, made, packed, checked. Put one of them in the first three seconds of a video ad. \"Every bottle is checked four times\" beats \"Premium quality\" every single time."}, {"q": "The headline picks the reader. Pick the right one.", "a": "On Meta, your first line of text and the first frame of the video are the headline. Name the buyer or their situation in the first five words. Write five versions before you pick one, the way Hopkins did."}, {"q": "Offer service. The best ads ask no one to buy.", "a": "For a cold email to a DTC brand, do not ask for a meeting in the first email. Offer one useful thing: \"I wrote three hooks for your Carbonator ads based on your reviews. Want me to send them?\" Let them raise their hand."}, {"q": "Show the bright side, not the problem.", "a": "Rewrite any problem-first hook so it ends on the result. Keep the problem if you need it, but give the reward the last and loudest word."}, {"q": "Test it. Let buyers settle the argument.", "a": "Never argue about which hook is better. Write a hypothesis, put two or three versions live with the same budget, and judge them on cost per result. SoScale says on its own website that it runs a hypothesis on every ad test. That is Hopkins, a hundred years later."}, {"q": "Once they are interested, tell the full story.", "a": "When you brief a landing page or a carousel, list the ten questions a buyer asks before paying, from the reviews and the comments. Make sure every one is answered somewhere. In a cold email, keep it short, but link to one page that answers everything."}, {"q": "Worked rewrite: one weak ad, the Hopkins way.", "a": "Take any ad in the Meta Ad Library for a brand you like and do this five-step rewrite in ten minutes: salesperson test, specifics, bright side, service, then two versions to test. Save the before and after. That is a portfolio piece."}], "quiz": [{"q": "A client wants the hook \"Elevate your kitchen\" for a carbonator ad. Using Hopkins' salesperson test, what is the strongest reply?", "o": ["Ask what a top in-store seller would actually say to a buyer, and write that line instead.", "Keep it, because short brand lines are easier to remember.", "Make the font bigger so the line gets more attention.", "Add more adjectives so it sounds more premium."], "a": 0, "e": "Hopkins judges every line by salesmanship. Nobody selling face to face says \"elevate your kitchen\"; they say what the buyer gets."}, {"q": "Which hook best follows \"being specific\"?", "o": ["Up to sixty litres of bubbles per gas cylinder.", "The most advanced carbonator ever made.", "Premium quality you can taste.", "Sparkling water, perfected."], "a": 0, "e": "Only the first gives a number from a checkable source. The others are platitudes that roll off the reader."}, {"q": "Every protein brand in your client's market says \"high quality ingredients\". What would Hopkins do?", "o": ["Find out the testing and sourcing steps the brand already does and explain them first, even if competitors do the same.", "Say \"the highest quality ingredients\" to outbid competitors.", "Drop the quality angle completely and only talk about price.", "Use a celebrity so the claim feels more believable."], "a": 0, "e": "This is the Schlitz lesson: the first brand to explain the process owns the claim. Outbidding with a bigger adjective changes nothing."}, {"q": "You are writing a cold email to a DTC brand you want to work for. Which first ask follows \"offer service\"?", "o": ["Offer to send three hooks you wrote from their customer reviews, if they want them.", "Ask for a 30-minute call this week to present yourself.", "Attach your CV and ask them to hire you.", "Ask them to follow you on LinkedIn."], "a": 0, "e": "Hopkins: the best ads ask no one to buy. A useful free sample that they request themselves gets read and valued."}, {"q": "Which video opening follows Hopkins' negative-advertising rule for a skincare client?", "o": ["A close-up of glowing, even skin after four weeks, with the result as text.", "A zoom on deep wrinkles with the text \"Is this you?\"", "A shocked face looking at the mirror.", "Text: \"Stop ageing before it's too late.\""], "a": 0, "e": "Show the face as it will appear, not the wrinkles. It is also safer under Meta's health and wellness policy."}, {"q": "Two hooks are live with equal budgets. Hook A has a higher click-through rate, Hook B has a lower cost per purchase. Which wins under Hopkins' rule?", "o": ["Hook B, because the purpose of advertising is sales, and it sells for less.", "Hook A, because more people clicked.", "Neither; ask the client which one they like.", "Both, so pause the test and start again."], "a": 0, "e": "Hopkins measures by sales. Clicks that do not buy are like coupons that never come back with money."}, {"q": "A headline for a carbonator reads \"Sparkling water made easy.\" How would you sharpen it the Hopkins way?", "o": ["Call out the buyer: \"Still carrying home packs of sparkling water every week?\"", "Make it funnier so more people share it.", "Remove the headline so the image speaks.", "Add the brand founding year."], "a": 0, "e": "The headline's job is to select the right reader. Naming the situation of the buyer does that."}, {"q": "Your client wants to give a free product to everyone who comments on a post. What is Hopkins' warning?", "o": ["Things given away freely to people who did not ask are valued less, and it is hard to pay for something once it was free.", "Free products are illegal in advertising.", "Free products always increase sales, so give more.", "Only give free products to existing customers."], "a": 0, "e": "In his chapter on psychology he notes it is hard to pay for an article which has once been free. Qualify the hand-raiser first."}, {"q": "The client and the agency argue for a week about which hook is best. What is the Hopkins move?", "o": ["Write a clear hypothesis and run both hooks as a small test with equal budget.", "Let the most senior person decide.", "Go with the hook that won a creative award.", "Run neither until everyone agrees."], "a": 0, "e": "\"Almost any questions can be answered, cheaply, quickly and finally, by a test campaign.\" Not by arguments around a table."}], "drills": [{"type": "write", "title": "Kill the platitudes", "prompt": ["The line below is pure platitude. Rewrite it for Aarke Carbonator 3 using at least one real number from the facts list. Keep it under 16 words and talk to one buyer (\"you\").", "Original line: \"Experience premium sparkling water with our best-in-class carbonator.\"", "Facts you may use (Aarke product page, read Nov 2026): tested 10,000+ carbonation cycles · up to 60 litres per cylinder · no electricity needed · 3-year warranty when registered · 87% of 760 reviews give 5 stars."], "checks": [{"kind": "number", "arg": "", "label": "Contains a number"}, {"kind": "maxwords", "arg": "16", "label": "16 words or fewer"}, {"kind": "you", "arg": "", "label": "Talks to \"you\""}, {"kind": "avoid", "arg": "premium,best,best-in-class,perfect,ultimate,elevate,revolutionary,amazing", "label": "No platitude words (premium, best, ultimate, elevate...)"}], "model": ["\"Drink a litre a day? One cylinder makes up to 60 litres of bubbles, no plug needed.\"", "Why it works: a buyer situation (\"drink a litre a day\"), one checkable number, one concrete benefit, no adjectives."], "items": [], "cats": [], "pairs": []}, {"type": "pick", "title": "Which line would a salesperson say?", "prompt": [], "checks": [], "model": [], "items": [], "cats": [], "pairs": [{"a": "Designed for the modern home.", "b": "Up to 60 litres of sparkling water per cylinder.", "ok": "B", "e": "B is specific and checkable. A is decoration."}, {"a": "Stop wasting money on bottled water, you're throwing cash away.", "b": "Fresh bubbles from your own tap, whenever you want them.", "ok": "B", "e": "Hopkins: show the bright side. A scolds the reader."}, {"a": "Buy the Carbonator 3 today!", "b": "Want the 3 hooks I wrote from your reviews? Reply \"yes\" and I'll send them.", "ok": "B", "e": "The best ads ask no one to buy. B offers service and lets the reader raise their hand."}, {"a": "Tested for over 10,000 carbonation cycles.", "b": "Built to last a lifetime.", "ok": "A", "e": "A is the fact behind the claim. B is a platitude nobody can check."}, {"a": "Every bottle washed four times by machine.", "b": "The purest beer in town.", "ok": "A", "e": "The Schlitz lesson: the process story beats the shouted adjective."}]}]}, {"n": 2, "lab": "Module 2", "short": "M2", "title": "Tested Advertising Methods", "sections": 8, "cards": [{"q": "The headline does most of the selling, so spend most of your time there.", "a": "For your next ad, write ten hooks before any body copy. Pick the best three and test them against each other with the same video body and the same budget. In a cold email, the subject line and the first sentence are the headline, so write five of each before you send."}, {"q": "Lead with self-interest. Curiosity alone is a gamble.", "a": "Read your hook and ask: if the reader only saw this line, would they know what is in it for them? If not, add the benefit. Keep curiosity as seasoning, not as the meal. For cold emails, a subject line like \"3 hooks from your reviews\" beats \"Quick question\" because it promises something."}, {"q": "The appeal beats the wording. Find the right reason to buy.", "a": "Map five possible appeals for your client from reviews and comments. Write one plain hook for each and test them as separate ads in the same campaign. That is exactly the \"hypothesis on every test\" approach agencies like SoScale describe on their sites, and it is Caples' method."}, {"q": "Use the story headline: the underdog who wins.", "a": "Write one hook in the doubt-then-triumph shape for your client. Make it a scene with other people in it: friends, a partner, a colleague. Use it as the opening line of a UGC script and test it against your benefit-led hook."}, {"q": "Some words carry weight. Use them honestly.", "a": "Take your current best hook and write three versions: one starting with \"How to\", one starting with a number, one starting with \"New\" or \"Now\", only if it is true. Test the strongest against the original."}, {"q": "Make the copy believable and specific.", "a": "In every ad, add one checkable fact and one real customer voice. If the main objection is price, say so first and answer it. It costs you nothing and buys trust for every other line."}, {"q": "Keep testing, and keep the winner running.", "a": "Set up a control-and-challenger log for a client: one row per test, the hypothesis, the one thing that changed, and the result. In a cold email, mention that you work this way. It tells a DTC brand you think in results, not opinions."}, {"q": "Worked example: one week of Caples on a real brief.", "a": "Do this as a spec project for one brand you like. Use the Meta Ad Library to see which appeals they already run, write the thirty hooks, pick three, and write the test plan as a one-page PDF. Send it as the free sample in your cold email, the Hopkins way."}], "quiz": [{"q": "You have one hour to improve an ad that is underperforming. According to Caples, where should most of that hour go?", "o": ["Writing and testing new headlines or hooks, because the headline moves results most.", "Rewriting the body copy word by word.", "Changing the colour of the button.", "Adding more hashtags to the post."], "a": 0, "e": "Caples found the headline has the largest effect. A great body behind a weak headline is never read."}, {"q": "Which hook follows Caples' advice to lead with self-interest?", "o": ["Make sparkling water at home without carrying a single bottle.", "You won't believe what this gadget does.", "Introducing our newest innovation.", "The brand everyone is talking about."], "a": 0, "e": "The first tells the reader what they get. The others are curiosity or brand talk with no promise."}, {"q": "Your test shows a \"save money\" hook loses badly to a \"no more carrying bottles\" hook. What did you just learn, in Caples' terms?", "o": ["The convenience appeal beats the money appeal for this audience, so test wording inside that appeal next.", "The money hook just needed better adjectives.", "The test is useless because both hooks were short.", "You should stop testing and use both."], "a": 0, "e": "Caples: the right appeal can outsell the wrong one many times over. Find the appeal first, polish the words second."}, {"q": "A creator brief for a protein brand needs a story hook. Which follows the \"They Laughed\" structure?", "o": ["\"My gym friends laughed at my breakfast shake. Then I out-lifted all of them in six weeks.\"", "\"Our protein has 25 grams per scoop.\"", "\"Breakfast is the most important meal of the day.\"", "\"Shop our protein now.\""], "a": 0, "e": "Doubt in front of other people, then a triumph. The benefit is acted out, not claimed. Keep any real claim true and checkable."}, {"q": "A client wants \"FREE!\" in the headline, but the item costs shipping. What is the Caples-consistent answer?", "o": ["Only use \"free\" if it is truly free; otherwise state the real offer plainly.", "Use \"free\" anyway, because it is a proven word.", "Put \"free\" in small text so it is legal.", "Use \"free\" and hide the shipping cost until checkout."], "a": 0, "e": "Weighted words only work when true. A lie wins the click and loses the buyer, and it can break ad policies."}, {"q": "Which testimonial is strongest as proof?", "o": ["\"I used to buy 12 bottles a week. Now I buy none.\" — named customer, verified review.", "\"Great product!\"", "\"Best purchase ever, five stars.\"", "\"Highly recommend to everyone.\""], "a": 0, "e": "Specific results with a real person persuade. Vague praise proves nothing."}, {"q": "You changed the hook, the video, the offer and the audience at once, and results improved. What is the problem?", "o": ["You do not know which change caused the improvement, so you cannot repeat it.", "There is no problem; results improved.", "You should have changed even more things.", "The test should have run for one day only."], "a": 0, "e": "Test one big variable at a time: appeal, then headline, then offer."}, {"q": "Your client is bored of the winning ad after four weeks and wants to replace it. Frequency is low and cost per purchase is still stable. What do you advise?", "o": ["Keep it running as the control and test new challengers against it.", "Pause it immediately and launch something fresh.", "Lower the budget on it until it stops spending.", "Delete it so the account looks cleaner."], "a": 0, "e": "Caples: do not stop a winner because you are tired of it. Watch the numbers, not your boredom."}, {"q": "You write a cold email subject line. Which follows Caples best?", "o": ["3 hooks for your Carbonator ads, from your own reviews", "Quick question", "Hello from a copywriter", "Following up"], "a": 0, "e": "It promises a specific self-interest benefit. The others give no reason to open."}], "drills": [{"type": "write", "title": "Ten hooks, one appeal each", "prompt": ["Write five hooks for the same product (Aarke Carbonator 3), each using a different appeal: convenience, money, design, no electricity, and proof. Keep each under 14 words.", "Facts you may use (Aarke product page, read Nov 2026): up to 60 litres per cylinder · no electricity needed · tested 10,000+ carbonation cycles · 3-year warranty when registered · 87% of 760 reviews give 5 stars."], "checks": [{"kind": "maxwords", "arg": "14", "label": "14 words or fewer"}, {"kind": "avoid", "arg": "", "label": "No vague words (premium, best, elevate...)"}], "model": ["Convenience: \"Never carry sparkling water home from the shop again.\"", "Money: \"One cylinder, up to 60 litres of bubbles. Do the bottle maths.\"", "Design: \"Steel on the counter. Bubbles on tap.\"", "No electricity: \"No plug, no batteries. Just water, gas and a lever.\"", "Proof: \"Tested for over 10,000 carbonation cycles.\""], "items": ["Convenience hook", "Money hook", "Design hook", "No-electricity hook", "Proof hook"], "cats": [], "pairs": []}, {"type": "sort", "title": "Name the headline family", "prompt": ["Caples sorted headlines by what they offer. Pick the family for each line."], "checks": [], "model": ["Rule of thumb: if the reader can't tell what they get, it is curiosity only. Combine curiosity with a benefit instead."], "items": ["Make sparkling water at home without carrying a single bottle. => Self-interest", "New: a carbonator that needs no plug. => News", "You won't believe what's in this kitchen. => Curiosity only", "How to cut your grocery bag weight every week. => Self-interest", "Announcing the 2026 colour range. => News", "The secret everyone is keeping from you. => Curiosity only"], "cats": ["Self-interest", "News", "Curiosity only"], "pairs": []}, {"type": "pick", "title": "Which would Caples test first?", "prompt": [], "checks": [], "model": [], "items": [], "cats": [], "pairs": [{"a": "Testing three different reasons to buy", "b": "Testing three different shades of the button", "ok": "A", "e": "Appeals move results most. Button colours are a late, small test."}, {"a": "\"They doubted me. Then they tasted it.\"", "b": "\"Our carbonator is great.\"", "ok": "A", "e": "Story with doubt and triumph beats a bare claim."}, {"a": "\"Free\" when shipping is charged", "b": "Plain statement of the real offer", "ok": "B", "e": "Weighted words only when true."}, {"a": "Keeping a stable winner and testing challengers", "b": "Replacing the winner because you're bored", "ok": "A", "e": "Keep the control until a challenger beats it."}]}]}, {"n": 3, "lab": "Module 3", "short": "M3", "title": "How to Write a Good Advertisement", "sections": 9, "cards": [{"q": "Start from the hard truth: nobody wants to read your ad.", "a": "Read your opening line and ask Schwab's question: is this easier to read than to skip? If it needs a second look to understand, rewrite it. Delete every warm-up sentence in your cold emails. Start with the reason they should care."}, {"q": "Fundamental one: get attention with the advantage itself.", "a": "For every hook you write, say out loud what the reader gets in five words. If you can't, the advantage is missing. Put that advantage into the first frame of the video and the first line of text."}, {"q": "Fundamental two: show people what's in it for them.", "a": "Take the feature list from a client's product page and add \"which means\" after every feature. Pick the one advantage that buyers mention most in reviews. That is your lead benefit. Everything else becomes a supporting bullet."}, {"q": "Fundamental three: prove it.", "a": "After you write your claim, list three kinds of proof you have for it. If you have none, either find some or soften the claim. In a cold email, your proof is a specific example of work, or a specific observation about their ads. Never claim results you did not get."}, {"q": "Fundamental four: help them grasp the advantage and feel it.", "a": "In a video script, add one line that starts with \"Imagine\" or shows the moment of use in close-up. In a cold email, help the reader picture the result: \"Picture your next Monday report with three fresh hooks already tested.\""}, {"q": "Fundamental five: ask for action, clearly and now.", "a": "End every ad and every cold email with one clear next step. For a cold email that is one small yes: \"Reply 'send' and I'll email you the three hooks.\" Never two asks in the same email."}, {"q": "Hold the reader all the way down.", "a": "Read only the subheads, bullets and bold lines on your page or carousel. Do they make the full argument by themselves? If not, rewrite them until they do. In emails, keep paragraphs to three lines or fewer."}, {"q": "Test like a mail-order man.", "a": "Before you say which headline is better, ask: what would a split-run say? Write the two versions, run them, and keep a log. Your cold-email equivalent is to send two subject lines to two small batches and compare reply rates."}, {"q": "Worked example: the five fundamentals as a cold-email checklist.", "a": "Write one cold email this week using the five fundamentals as a checklist, one or two lines each. Read it aloud. If any line is about you instead of them, cut it. Remember the standing rule: you send it yourself."}], "quiz": [{"q": "Your client's hook is a clever pun that needs a second look to understand. What does Schwab's premise say?", "o": ["Replace it, because the ad must be easier to read than to skip.", "Keep it, because clever lines are memorable.", "Add an emoji so it stands out.", "Make it longer so people spend more time on it."], "a": 0, "e": "Readers don't want to read ads. Anything that needs a second look gets skipped."}, {"q": "Which headline follows Schwab's first fundamental best?", "o": ["Make a full day of sparkling water before breakfast, without a plug.", "Bubble trouble?", "The future is fizzy.", "Meet the icon."], "a": 0, "e": "It gets attention with the advantage itself, and selects the reader who wants it."}, {"q": "A client lists \"steel body\" as their main selling point. What does fundamental two tell you to do?", "o": ["Translate it into the reader's gain, e.g. it still looks good on your counter in five years.", "Repeat \"steel body\" in bigger letters.", "Add more technical specs about the steel.", "Drop the feature completely."], "a": 0, "e": "Show the advantage: the feature only matters through what it does for the reader."}, {"q": "You claim \"Lasts for years.\" Which addition is the strongest proof in Schwab's sense?", "o": ["Tested for more than 10,000 carbonation cycles, plus a 3-year warranty when registered.", "\"Trust us, it's built to last.\"", "\"Thousands love it.\"", "A bigger font for the claim."], "a": 0, "e": "Specific test results and a guarantee with exact terms are proof. Vague reassurance is not."}, {"q": "Your ad shows the advantage but feels flat. Which line adds Schwab's fourth fundamental?", "o": ["\"Imagine cold sparkling water the moment you get home, with no shop run.\"", "\"Available in three colours.\"", "\"Founded in 2013.\"", "\"See our website for details.\""], "a": 0, "e": "Fundamental four is helping the reader grasp and feel the gain, not just know about it."}, {"q": "Which call to action follows Schwab's fifth fundamental without faking urgency?", "o": ["\"Order the starter kit today; registered machines get a 3-year warranty.\"", "\"Only 2 left!!!\" (when stock is not limited)", "\"Learn more.\"", "\"Click here maybe.\""], "a": 0, "e": "One clear action, risk removed, and a true reason. Fake scarcity breaks trust and policies."}, {"q": "Your landing page is long and readers drop off before the offer. What is the Schwab fix?", "o": ["Write subheads that make the whole argument for skimmers, and shorten paragraphs.", "Cut the page to two sentences.", "Add more images with no text.", "Move the price to the very top."], "a": 0, "e": "Hold the reader: subheads, short paragraphs and specifics. Boring copy is the problem, not length."}, {"q": "Two headlines: one names a fear of embarrassment, one describes the course. What did Schwab's comparison of the Sackheim ad suggest?", "o": ["The fear-of-embarrassment headline pulled close to three times more, so test feelings against descriptions.", "Descriptive headlines always win.", "There was no difference.", "Headlines don't matter in mail order."], "a": 0, "e": "Per the account on Wikipedia, \"Do You Make These Mistakes In English?\" pulled close to 3x the alternative. Still: test, don't assume."}, {"q": "In a cold email to a DTC marketing lead, which ending follows Schwab?", "o": ["\"Want the other two hooks? Reply 'send'.\"", "\"Can we book a call, and also could you share this with your team, and follow me?\"", "\"Let me know your thoughts.\"", "No ending at all."], "a": 0, "e": "One small, clear action. Several asks at once mean no action."}], "drills": [{"type": "order", "title": "Put the five fundamentals in order", "prompt": ["Arrange the lines of this cold email so they follow Schwab's five fundamentals."], "checks": [], "model": ["Attention (subject with the advantage) → show the advantage → prove it (a real sample) → help them grasp it (what it means for their numbers) → ask for action (one small step)."], "items": ["Subject: 3 hooks for your Carbonator ads, from your own reviews", "Your reviews keep saying people love not carrying bottles home, and I couldn't find that angle in your ads.", "Here's one hook I wrote from a five-star review: \"Never carry sparkling water home again.\"", "If it beats your current opener, that's a lower cost per purchase on the same budget.", "Want the other two? Reply \"send\"."], "cats": [], "pairs": []}, {"type": "write", "title": "Feature to advantage", "prompt": ["Turn each feature into an advantage the reader feels. Write it as \"Feature, which means...\" and keep each under 22 words."], "checks": [{"kind": "include", "arg": "means,so,so you", "label": "Uses \"which means\" or \"so you\""}, {"kind": "maxwords", "arg": "22", "label": "22 words or fewer"}, {"kind": "you", "arg": "", "label": "Talks to \"you\""}], "model": ["No electricity needed, which means you can put it anywhere in your kitchen and never hunt for a socket.", "Up to 60 litres per cylinder, which means weeks of sparkling water before you think about gas again.", "3-year warranty when registered, which means if it breaks, you're covered, and the only thing you buy is gas."], "items": ["No electricity needed", "Up to 60 litres per cylinder", "3-year warranty when registered"], "cats": [], "pairs": []}, {"type": "sort", "title": "Which fundamental is this?", "prompt": [], "checks": [], "model": ["If two lines sound similar, ask what job they do: grab, explain, prove, make you feel, or make you act."], "items": ["Make sparkling water at home without carrying a bottle. => Attention", "Steel body, which means it still looks good in five years. => Show advantage", "87% of 760 reviews on the brand's site give it five stars. => Prove it", "Imagine cold bubbles the moment you get home. => Grasp it", "Order the starter kit today. => Ask for action", "Tested for more than 10,000 carbonation cycles. => Prove it"], "cats": ["Attention", "Show advantage", "Prove it", "Grasp it", "Ask for action"], "pairs": []}]}, {"n": 4, "lab": "Module 4", "short": "M4", "title": "The Gary Halbert Letter", "sections": 9, "cards": [{"q": "Get the skill into your hands: copy great ads out by hand.", "a": "Start today with one ad from Module 11. Do it before you write anything for a client, as a warm-up. Do the same with a winning Meta ad from the Ad Library: copy the script out by hand, then mark the hook, the proof and the call to action."}, {"q": "Build a swipe file and feed it every day.", "a": "Start a swipe file today in the Module 12 workbook. Add ten headlines from a magazine cover or a news site, and five hooks from long-running ads in the Meta Ad Library. Tag each one by pattern: how to, number, question, secret, news, story."}, {"q": "Study the product until the selling idea falls out.", "a": "Before your next ad brief, write at least thirty numbered notes from the product page, the reviews, competitors' ads in the Ad Library, and forums like Reddit. Use the notes field in the Module 12 workbook so they stay with your draft."}, {"q": "Shuffle the headlines, then find the central selling idea.", "a": "Write twenty headlines for your product using five patterns from your swipe file. Circle the one idea that keeps coming back. Write it as one sentence under twenty words, with the reader in it. That sentence is the brief for every ad you make."}, {"q": "Write the first draft fast. Forget form. Forget grammar.", "a": "Use the ten-minute timer in the Module 12 workbook. Turn on no-delete mode so you cannot go back. Write the whole ad or email in one go. Do not edit until the timer ends and you have taken a break."}, {"q": "Rework it into the seven steps.", "a": "Take your fast draft and sort every sentence under one of the seven steps. Cut sentences that fit nowhere. Fill steps that are empty. The workbook in Module 12 checks each step for you."}, {"q": "Read it aloud, then tighten.", "a": "Read your ad aloud with a timer. If a fifteen-second script takes twenty seconds, cut until it fits. Use the read-aloud and tighten report in the Module 12 workbook: it flags long sentences, vague words and passive voice."}, {"q": "Use a grabber, but tie it to the message.", "a": "For your next video brief, write one opening visual that would make someone stop and ask \"why is that there?\", then write the line that answers the question and leads into your central selling idea. If the answer doesn't lead into the sale, choose another grabber."}, {"q": "Tell a story, and sell yourself the same way.", "a": "Write the first line of your next ad as a confession or a small story. Then write the first line of your portfolio site the same way, about a piece of work and what it did. If you don't have results yet, describe a spec test you designed and what you expect to learn from it. Never invent numbers."}], "quiz": [{"q": "You want to become a strong copywriter fast. Which daily habit does Halbert recommend that most people skip?", "o": ["Copying great ads out word for word, slowly, by hand.", "Reading summaries of copywriting books.", "Watching ad award shows.", "Writing one perfect headline per day."], "a": 0, "e": "Halbert's hands-on method: copy the winners by hand so the patterns move into your fingers."}, {"q": "You find the headline \"Do You Make These Mistakes In English?\" in your swipe file. How should you use it for a skincare brand?", "o": ["Borrow the pattern for a new line, e.g. \"Do You Make These Mistakes With Your Sunscreen?\"", "Use the original headline word for word.", "Ignore it, because it's from 1919.", "Use it only for language courses."], "a": 0, "e": "Halbert adapted it to stockbrokers. Patterns are tools; the words and promise must be yours."}, {"q": "Your first draft for a carbonator is generic. What step did you most likely skip?", "o": ["The Suck: studying the product and competitors and writing numbered nugget notes.", "Choosing a font.", "Writing the call to action.", "Reading the draft aloud."], "a": 0, "e": "Most weak copy is under-researched. Thirty-plus nugget notes give you specifics to say."}, {"q": "Which is a central selling idea rather than a slogan?", "o": ["Never carry sparkling water home again.", "Bubbles for everyone.", "The future of fizz.", "Pure joy."], "a": 0, "e": "A central selling idea is a concrete gain for a concrete person, specific enough to test."}, {"q": "You stare at a blank page and keep deleting your first line. What does Halbert prescribe?", "o": ["Write fast for a set time without editing, then let it cool before reworking.", "Wait for inspiration.", "Perfect the first sentence before moving on.", "Ask the client to write it."], "a": 0, "e": "\"Forget form. Forget grammar.\" Speed first, editing later."}, {"q": "Which line belongs in step 3, \"why they should believe\", rather than step 4, \"prove it\"?", "o": ["\"It's mechanical: no plug, no batteries, nothing to break down electronically.\"", "\"Tested for over 10,000 carbonation cycles.\"", "\"87% of 760 reviews give it five stars.\"", "\"Tap to order now.\""], "a": 0, "e": "Step 3 gives the reason it works; step 4 gives the evidence. Halbert keeps them separate."}, {"q": "Your 15-second creator script takes 21 seconds to read aloud. What is the Halbert fix?", "o": ["Tighten: cut words and shorten sentences until it fits when read aloud.", "Ask the creator to speak faster.", "Make the video longer.", "Remove the call to action."], "a": 0, "e": "Read it aloud and tighten. Copy must sound natural at real speaking speed."}, {"q": "A brand wants to open a video with a random explosion to stop the scroll. What is Halbert's grabber rule?", "o": ["Only use a grabber that leads straight into the sales message.", "Any grabber is good if it stops the scroll.", "Grabbers are outdated; never use them.", "Put the grabber at the end."], "a": 0, "e": "Grabbers must tie to the message, or they win attention and then lose it."}, {"q": "You are writing your portfolio homepage. What does Halbert's P.S. advice suggest?", "o": ["Lead with what your copy did or is designed to test, told as a short story; no invented numbers.", "List every software tool you know.", "Show your awards first.", "Write a long biography of your childhood."], "a": 0, "e": "A copywriter should sell themselves, and legends talk numbers, not awards. Never fake results."}, {"q": "Which order matches Halbert's process?", "o": ["Swipe file and reading → The Suck → central selling idea → fast draft → seven steps → read aloud and tighten.", "Fast draft → research → headline → publish.", "Headline → publish → research.", "Seven steps → swipe file → The Suck."], "a": 0, "e": "Research and swipe feed the idea; the draft comes fast; structure and tightening come last."}], "drills": [{"type": "order", "title": "Halbert's seven steps", "prompt": ["Put these lines of a carbonator ad in Halbert's seven-step order."], "checks": [], "model": ["1 attention → 2 why interested (central selling idea) → 3 why believe → 4 prove it → 5 itemize benefits → 6 how to order → 7 order now."], "items": ["Still carrying sparkling water home every week?", "Make it at your tap instead and never carry a bottle again.", "It's mechanical: no plug, no batteries.", "Tested for more than 10,000 carbonation cycles.", "Up to 60 litres per cylinder. Steel body. 3-year warranty when registered.", "Tap \"Shop now\" and pick your colour.", "Order today and your first 60 litres start this week."], "cats": [], "pairs": []}, {"type": "write", "title": "Adapt a swipe-file pattern", "prompt": ["Adapt each classic pattern to Aarke Carbonator 3 (or a DTC brand of your choice). Keep the structure, change everything else."], "checks": [{"kind": "maxwords", "arg": "16", "label": "16 words or fewer"}, {"kind": "filled", "arg": "", "label": "Written"}, {"kind": "avoid", "arg": "", "label": "No vague words (premium, best, elevate...)"}], "model": ["Do You Make These Mistakes With Your Home Sparkling Water?", "How to drink a litre of sparkling water a day without carrying a single bottle.", "A little secret that turns your tap into sixty litres of bubbles."], "items": ["\"Do You Make These Mistakes In ...?\"", "\"How to ... without ...\"", "\"A little secret that ...\""], "cats": [], "pairs": []}, {"type": "pick", "title": "Halbert or not?", "prompt": [], "checks": [], "model": [], "items": [], "cats": [], "pairs": [{"a": "A grabber that is the argument (a pile of bottles = one year of buying)", "b": "A random explosion in the first second", "ok": "A", "e": "Grabbers must lead into the message."}, {"a": "\"Forget form. Forget grammar.\" for the first draft", "b": "Perfect each sentence before writing the next", "ok": "A", "e": "Speed first, editing later."}, {"

 data-say>Answer every question in the order they ask it.</span></h2></header><p data-say data-t="510.95">Sugarman says the copy should flow logically, anticipating the prospect&#x27;s questions and answering them in order, as if they were asked face to face. And copy should be as long as it needs to be to get the action, no shorter, no longer.</p><p data-say data-t="527.94">Think of a good salesperson again. The customer asks: what is it, how does it work, will it work for me, what does it cost, what if it breaks. A good salesperson answers each question as it comes up. Bad copy answers questions nobody asked and skips the ones everyone asks.</p><p data-say data-t="546.95">Length follows from the questions. A cheap, familiar product needs few answers. An expensive, new or complex one needs many. That&#x27;s why a fifteen-second ad can sell a snack, but a carbonator usually needs a product page that answers everything.</p><p data-say data-t="563.70">Collect the real questions from reviews, comments and support emails. They tell you the order.</p><aside class="co co-example" data-t="570.30"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The question chain.</div><p data-say>What is it? A carbonator. How does it work? Lever and gas cylinder. Does it need power? No. How much water per cylinder? Up to sixty litres. What if it breaks? Three-year warranty when registered. How do I order? Starter kit, one tap.</p></aside><aside class="co co-agency" data-t="590.51"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write down the ten questions a buyer asks before paying, from the comments on your client&#x27;s ads. Order them as a buyer would ask. Check that your landing page or carousel answers all ten, in that order.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 7.7<button class="ts" data-t="605.27" title="Play the audio from here">▶ 10:05</button><label class="readchk"><input type="checkbox" data-k="7-7"> Mark as done</label></div><h2 data-t="605.27"><span class="num">7.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Sell the cure, not the prevention.</span></h2></header><p data-say data-t="609.63">One of Sugarman&#x27;s sharpest axioms: selling a cure is much easier than selling a preventative, unless the preventative is presented as a cure, or its curative side is stressed.</p><p data-say data-t="621.68">People spend money on problems they feel today. They rarely spend money on problems they might have later. Insurance, vitamins and sunscreen all fight this.</p><p data-say data-t="633.30">So the move is to find the present pain the product relieves, and lead with that. The prevention benefit becomes a bonus.</p><p data-say data-t="642.15">This connects with Hopkins&#x27; bright-side rule. You lead with the relief or the reward, not with fear about the future.</p><aside class="co co-example" data-t="650.10"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>From prevention to cure.</div><p data-say>Prevention: &quot;Reduce your plastic waste over the years.&quot; Cure: &quot;No more heavy bags of bottles this weekend.&quot; The plastic benefit is real, but the heavy bags are the pain the reader feels now.</p></aside><aside class="co co-agency" data-t="666.56"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Find the present pain your client&#x27;s product relieves and make it the lead. Move &quot;long-term benefits&quot; to supporting lines. In health and wellness, keep claims within Meta&#x27;s policies: relief from a hassle, not promises about the body.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 7.8<button class="ts" data-t="683.48" title="Play the audio from here">▶ 11:23</button><label class="readchk"><input type="checkbox" data-k="7-8"> Mark as done</label></div><h2 data-t="683.48"><span class="num">7.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Make it personal, and tell a story.</span></h2></header><p data-say data-t="687.58">Sugarman says every communication should feel personal, from the writer to one reader, whatever the medium. And he says stories are one of the best ways to sell, because they create an emotional bond and carry the reader deep into the copy.</p><p data-say data-t="703.54">His own ads often began with a personal story: how he found the product, what he doubted, what happened. You read on to see how the story ends, and the product is the ending.</p><p data-say data-t="715.59">This is why first-person creator ads work so well on social. One person, talking to one viewer, telling a short story.</p><p data-say data-t="724.85">Stories need a real arc: a situation, a problem or doubt, a turn, a result. Without the turn, it&#x27;s just a description.</p><aside class="co co-example" data-t="735.22"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A thirty-second story.</div><p data-say>&quot;Last year my partner bought a carbonator and I rolled my eyes. Another gadget. Then I realised I hadn&#x27;t carried a bag of bottles in two months. Now I&#x27;m the one who refills it.&quot; Situation, doubt, turn, result.</p></aside><aside class="co co-agency" data-t="751.83"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write your next UGC brief as a four-beat story: situation, doubt, turn, result. Ask the creator to tell it in their own words. Keep every claim in the story true.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 7.9<button class="ts" data-t="766.42" title="Play the audio from here">▶ 12:46</button><label class="readchk"><input type="checkbox" data-k="7-9"> Mark as done</label></div><h2 data-t="766.42"><span class="num">7.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Don&#x27;t assume limits that aren&#x27;t there: test the strange idea.</span></h2></header><p data-say data-t="771.89">One of Sugarman&#x27;s quieter axioms is about problem solving: don&#x27;t assume constraints that aren&#x27;t really there. Many copy problems feel stuck because the writer silently accepted a rule nobody actually set.</p><p data-say data-t="786.12">&quot;The ad has to be short.&quot; &quot;We can&#x27;t mention the price.&quot; &quot;The first frame has to show the logo.&quot; Sometimes these are real rules from the client or the platform. Often they are habits. Sugarman&#x27;s answer is to question the rule, try the different approach, and measure it.</p><p data-say data-t="802.97">This is how breakthroughs happen in ad accounts. The long video that &quot;nobody will watch&quot; turns out to be the best seller. The ad that admits the main drawback beats the polished one. You only find out by testing, not by assuming.</p><p data-say data-t="818.71">The discipline is in the measuring. A strange idea is worth one controlled test against your best ad, not a whole budget on faith.</p><aside class="co co-example" data-t="828.65"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Breaking a fake rule.</div><p data-say>Everyone on the team assumes the carbonator ad must hide the price because it is the main objection. A test ad leads with it instead: &quot;Yes, it costs 2,450 kronor. Here&#x27;s what owners say after a year.&quot; It is a real test of a real assumption, and either result teaches you something.</p></aside><aside class="co co-agency" data-t="852.62"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>List three &quot;rules&quot; your client&#x27;s ads follow. Ask which ones are real constraints, such as brand guidelines or Meta policy, and which are habits. Propose one controlled test that breaks a habit. That kind of thinking is exactly what performance agencies hire for.</p></aside></section><section class="sec" id="L10" data-sec="10"><header class="sh"><div class="sk">Lesson 7.10<button class="ts" data-t="872.81" title="Play the audio from here">▶ 14:33</button><label class="readchk"><input type="checkbox" data-k="7-10"> Mark as done</label></div><h2 data-t="872.81"><span class="num">7.10</span> <span class="lsay" data-say>Lesson 10.</span> <span data-say>Incubate, then edit to the fewest words.</span></h2></header><p data-say data-t="877.94">Sugarman describes incubation: after you have collected everything, step away and let your subconscious work. Then let the copy pour out. Halbert said the same with his fast draft and cooling period.</p><p data-say data-t="891.62">Then edit. Sugarman says editing means expressing what you want with the fewest words. Most first drafts have too many words. Every one you cut makes the rest stronger.</p><p data-say data-t="903.48">He also says the reader should do a little mental work, enough to feel involved, not so much they give up. Copy that is too obvious bores. Copy that is too hard loses people.</p><p data-say data-t="915.33">For you, this means two separate sessions: one for writing, one for cutting. Never do both at once.</p><aside class="co co-example" data-t="923.13"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Cutting to the bone.</div><p data-say>Draft: &quot;This amazing carbonator from Aarke is honestly one of the best purchases I&#x27;ve made for my kitchen in a really long time.&quot; Edited: &quot;Best kitchen purchase in years.&quot; Six words, and the energy survives. Then add one fact: &quot;Two months, zero bottles.&quot;</p></aside><aside class="co co-agency" data-t="944.08"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write today, edit tomorrow. In the edit, cut your draft by a third. Read it aloud. If it still makes the sale, the cut words weren&#x27;t doing anything.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="955.53">That&#x27;s the end of Module 7. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Question assumed limits; test the strange idea against the control.</li><li>Every element exists to get the first sentence read.</li><li>First sentence sells the second: short, curious, a slippery slide.</li><li>Build a buying environment; get true yeses before the big ask.</li><li>Curiosity about the benefit, closed honestly.</li><li>Sell the concept, not the object.</li><li>Answer buyers&#x27; questions in the order they ask them.</li><li>Sell the cure, not the prevention.</li><li>Personal stories with a turn. Incubate, then cut to the fewest words.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 9 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="7"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 10 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://larslofgren.com/joseph-sugarman/" target="_blank" rel="noopener">The 17 axioms with commentary (Lars Lofgren)</a></li><li><a href="https://www.wiley.com/en-us/the-adweek-copywriting-handbook-the-ultimate-guide-to-writing-powerful-advertising-and-marketing-copy-from-one-of-america&#x27;s-top-copywriters-p-9780470051245" target="_blank" rel="noopener">The Adweek Copywriting Handbook (Wiley, 2006)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m06"><small>← Previous</small>Module 6: Breakthrough Advertising</a><a class="nx" href="#m08"><small>Next →</small>Module 8: Ogilvy on Advertising</a></nav></article></main></template>
<template id="v-m08" data-cls="chpage hasaudio" data-title="Module 8: Ogilvy on Advertising · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 8</b> <span>Ogilvy on Advertising</span></div><div class="tb-r"><a class="ib" href="#m09" title="Next: Module 9">9 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m08-ogilvy-on-advertising.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 8 · Contents</div><div class="tc-t">Ogilvy on Advertising</div><ol class="tc"><li><a href="#m08/glance">At a glance</a></li><li class="l2"><a href="#m08/L1"><span class="n">8.1</span> Decide the positioning before you write a word.</a></li><li class="l2"><a href="#m08/L2"><span class="n">8.2</span> Make a large promise, and build it on a big idea.</a></li><li class="l2"><a href="#m08/L3"><span class="n">8.3</span> Don&#x27;t be a bore, and don&#x27;t chase awards.</a></li><li class="l2"><a href="#m08/L4"><span class="n">8.4</span> Problem, solution, proof. And don&#x27;t cheat.</a></li><li class="l2"><a href="#m08/L5"><span class="n">8.5</span> Video rules that still work: grab early, show, and speak on camera.</a></li><li class="l2"><a href="#m08/L6"><span class="n">8.6</span> The headline: sell in it, say the benefit, and flag the buyer.</a></li><li class="l2"><a href="#m08/L7"><span class="n">8.7</span> Long copy, captions and pictures with a story.</a></li><li class="l2"><a href="#m08/L8"><span class="n">8.8</span> Go the whole hog on one promise, and give it a first-class ticket.</a></li><li class="l2"><a href="#m08/L9"><span class="n">8.9</span> Repeat your winners, and fix the near-misses.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m08/quiz">✅ Questions (10)</a></li><li><a href="#m08/play">🛠️ Playground (3)</a></li><li><a href="#m08/cards">🃏 Lesson cards (9)</a></li><li><a href="#m08/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08" aria-current="page"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 8 · David Ogilvy · 1983</div><h1 data-t="0.30"><span class="chn">Module 8</span><span data-say>Ogilvy on Advertising</span> <span class="h1sub" data-say>by David Ogilvy</span></h1><div class="lead"><p data-say data-t="5.46">David Ogilvy built one of the world&#x27;s biggest agencies, and he never stopped saying that the purpose of advertising is to sell. Ogilvy on Advertising, from 1983, is his most practical book. Its core ideas also appear in a famous house ad his agency ran in newspapers in the 1960s and 70s, &quot;How to Create Advertising that Sells&quot;, a list of thirty-eight lessons. Ogilvy started out admiring Hopkins and the mail-order men, so you will hear echoes. What he adds is brand thinking, television, and a feel for how pictures and words work together. That is exactly what you need for video ads.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 16:23</span><span>9 lessons</span><span>10 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m08/L1"><b>8.1 Decide the positioning before you write a word.</b></a> <span class="muted">· 🎧 1:45</span></li><li><a href="#m08/L2"><b>8.2 Make a large promise, and build it on a big idea.</b></a> <span class="muted">· 🎧 1:44</span></li><li><a href="#m08/L3"><b>8.3 Don&#x27;t be a bore, and don&#x27;t chase awards.</b></a> <span class="muted">· 🎧 1:40</span></li><li><a href="#m08/L4"><b>8.4 Problem, solution, proof. And don&#x27;t cheat.</b></a> <span class="muted">· 🎧 1:33</span></li><li><a href="#m08/L5"><b>8.5 Video rules that still work: grab early, show, and speak on camera.</b></a> <span class="muted">· 🎧 1:55</span></li><li><a href="#m08/L6"><b>8.6 The headline: sell in it, say the benefit, and flag the buyer.</b></a> <span class="muted">· 🎧 1:47</span></li><li><a href="#m08/L7"><b>8.7 Long copy, captions and pictures with a story.</b></a> <span class="muted">· 🎧 1:32</span></li><li><a href="#m08/L8"><b>8.8 Go the whole hog on one promise, and give it a first-class ticket.</b></a> <span class="muted">· 🎧 2:00</span></li><li><a href="#m08/L9"><b>8.9 Repeat your winners, and fix the near-misses.</b></a> <span class="muted">· 🎧 1:32</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://hammock.com/content-marketing/david-ogilvys-house-ad-how-to-create-advertising-that-sells/" target="_blank" rel="noopener">&quot;How to Create Advertising that Sells&quot;, Ogilvy&#x27;s house ad, reproduced in full (Hammock)</a></li><li><a href="https://www.1000headlines.com/h/at-60-miles-an-hour-the-loudest-noise" target="_blank" rel="noopener">The Rolls-Royce headline and where it came from (1000 Headlines)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 8.1<button class="ts" data-t="46.19" title="Play the audio from here">▶ 0:46</button><label class="readchk"><input type="checkbox" data-k="8-1"> Mark as done</label></div><h2 data-t="46.19"><span class="num">8.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Decide the positioning before you write a word.</span></h2></header><p data-say data-t="50.53">The house ad starts with what Ogilvy calls the most important decision: how to position the product. His examples are simple and sharp. Should Schweppes be sold as a soft drink or as a mixer? Should Dove be a product for dry skin, or one that gets hands really clean?</p><p data-say data-t="67.95">He says the results of a campaign depend less on how the advertising is written than on how the product is positioned. So positioning comes first, before any copy, and research can help you decide.</p><p data-say data-t="81.20">Positioning is the answer to &quot;what is this, and who is it for?&quot; The same carbonator can be positioned as a design object, a money saver, a plastic reducer or a hosting tool. Each position leads to completely different ads.</p><p data-say data-t="96.80">Ogilvy also talks about psychological segments, not just demographic ones. He positioned Mercedes-Benz for non-conformists who scoffed at status symbols. A mindset, not an age bracket.</p><aside class="co co-example" data-t="110.00"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Two positions, one product.</div><p data-say>Position A: &quot;The carbonator that looks like it belongs in a design magazine.&quot; Position B: &quot;The carbonator that ends the weekly bottle run.&quot; Same product. A attracts people who care how their kitchen looks; B attracts people tired of carrying bottles. You cannot write good ads until you pick.</p></aside><aside class="co co-agency" data-t="132.82"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before you write for a client, write three possible positions, each in one line, with the mindset of the buyer it attracts. Ask which one matches the reviews and the business goal. Test the top two as separate concepts if the client isn&#x27;t sure.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 8.2<button class="ts" data-t="150.70" title="Play the audio from here">▶ 2:31</button><label class="readchk"><input type="checkbox" data-k="8-2"> Mark as done</label></div><h2 data-t="150.70"><span class="num">8.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Make a large promise, and build it on a big idea.</span></h2></header><p data-say data-t="155.64">The second decision, Ogilvy says, is what to promise. A promise is not a claim, a theme or a slogan. It is a benefit for the consumer, ideally one that is unique and competitive, and the product must deliver it. He says most advertising promises nothing, and is doomed to fail.</p><p data-say data-t="176.12">Then the big idea. Unless your advertising is built on a big idea, he writes, it will &quot;pass like a ship in the night&quot;. A big idea jolts people out of indifference. Big ideas are usually simple, and a truly big one can run for years, like his eye patch for Hathaway shirts.</p><p data-say data-t="194.86">Hathaway is a good lesson in what a big idea can be: a single, odd, memorable visual element that made people look and remember, attached to a sales message.</p><p data-say data-t="206.40">For performance ads, the big idea is the creative concept that can be made into dozens of variations: different creators, scenes and hooks, all carrying the same promise.</p><aside class="co co-example" data-t="218.81"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A big idea with legs.</div><p data-say>Promise: &quot;never carry sparkling water home again.&quot; Big idea: &quot;The bottle count.&quot; Each ad shows a real person&#x27;s yearly pile of bottles next to one small gas cylinder. It can be made with twenty creators in twenty kitchens, and every version sells the same promise.</p></aside><aside class="co co-agency" data-t="240.77"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write your client&#x27;s promise as one benefit sentence. Then write one big idea that could produce at least ten different ads. If you can only imagine one ad, the idea isn&#x27;t big enough yet.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 8.3<button class="ts" data-t="254.72" title="Play the audio from here">▶ 4:15</button><label class="readchk"><input type="checkbox" data-k="8-3"> Mark as done</label></div><h2 data-t="254.72"><span class="num">8.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Don&#x27;t be a bore, and don&#x27;t chase awards.</span></h2></header><p data-say data-t="259.25">&quot;Nobody was ever bored into buying a product,&quot; Ogilvy writes, and yet most advertising is impersonal, cold and dull. Talk to people like a human being. Involve them. Make them hungry.</p><p data-say data-t="272.52">He also warns against following fads. Imitative advertising seldom works. Innovate, but test your innovation with real people first.</p><p data-say data-t="282.46">And he is suspicious of awards. He says his agency could not find any correlation between awards and sales, and so it started giving an award for the campaign that contributed most to sales instead. Good advertising, he says, sells the product without drawing attention to itself. Make the product the hero.</p><p data-say data-t="302.74">This is a direct line from Hopkins. An ad that people praise but that does not sell has failed. For you, this also matters in interviews: talk about what your work is designed to sell, not how clever it is.</p><aside class="co co-example" data-t="317.28"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Product as hero.</div><p data-say>A clever, cinematic ad where the carbonator appears for one second at the end: people remember the story, not the product. A simpler ad where the product is in every shot, doing the thing, with a creator talking to camera: less impressive, more likely to sell.</p></aside><aside class="co co-agency" data-t="337.70"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Watch your draft video with the sound off. Is the product visible and doing something in most shots? If not, rewrite so the product is the hero. When you present work, say what each concept is designed to sell, not that it&#x27;s creative.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 8.4<button class="ts" data-t="355.10" title="Play the audio from here">▶ 5:55</button><label class="readchk"><input type="checkbox" data-k="8-4"> Mark as done</label></div><h2 data-t="355.10"><span class="num">8.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Problem, solution, proof. And don&#x27;t cheat.</span></h2></header><p data-say data-t="360.33">In the television section, Ogilvy says the problem-solution format has always been above average in sales results. Set up a problem the viewer recognises, show how the product solves it, and prove the solution.</p><p data-say data-t="375.26">But he adds a hard warning: don&#x27;t use it unless you can do it without cheating. The viewer is not stupid, and he puts it in a famous, very dated line about the consumer not being a moron. The modern point stands without the dated wording: respect the viewer&#x27;s intelligence.</p><p data-say data-t="393.12">He also praises honest visual demonstrations. They visualise the promise, save time, drive it home and are memorable.</p><p data-say data-t="402.57">On Meta, problem-solution with a real demonstration is still one of the most reliable structures for direct-response video, as long as the demonstration is real.</p><aside class="co co-example" data-t="413.42"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Honest demonstration.</div><p data-say>Problem: a creator struggling up the stairs with bottles. Solution: the carbonator on the counter. Proof: an unedited single shot of pressing the lever and pouring a glass. No cut in the middle, nothing faked.</p></aside><aside class="co co-agency" data-t="431.35"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Structure your next script as problem, solution, proof. Make the proof a single, uncut demonstration shot if you can. Never exaggerate the problem or fake the result; it breaks trust and Meta&#x27;s policies.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 8.5<button class="ts" data-t="447.79" title="Play the audio from here">▶ 7:28</button><label class="readchk"><input type="checkbox" data-k="8-5"> Mark as done</label></div><h2 data-t="447.79"><span class="num">8.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Video rules that still work: grab early, show, and speak on camera.</span></h2></header><p data-say data-t="455.01">The house ad includes a set of findings about television that translate well to short-form video. Commercials with an exciting opening hold their audience better than ones that begin quietly. Ogilvy calls these grabbers, the same word Halbert used for mail.</p><p data-say data-t="472.19">He also warns against what he calls logorrhea: drowning the viewer in words. Make the pictures tell the story. What you show matters more than what you say.</p><p data-say data-t="482.51">He reports that on-camera voice did better than voice-over in his agency&#x27;s experience. A person speaking to camera beats an unseen announcer. Testimonials work if they are credible, and he warns against irrelevant celebrities, whose fame has no link to the product and steals attention from it.</p><p data-say data-t="502.29">These findings are from the 1960s and 70s and from TV, so treat them as starting hypotheses, not laws. But look at what works on Reels today: strong openings, faces talking to camera, real customers, and visual proof. Ogilvy would recognise all of it.</p><aside class="co co-example" data-t="521.32"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>From TV rule to Reels brief.</div><p data-say>Grabber: the first second shows the bottle pile collapsing. On-camera voice: the creator speaks directly to the phone. Show, don&#x27;t tell: the lever, the hiss, the pour. Relevant testimonial: a real owner, not a famous face with no link to kitchens.</p></aside><aside class="co co-agency" data-t="543.81"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>In your next creator brief, require three things: a strong first second, the creator speaking on camera, and at least one shot where the product is demonstrated with no words needed. Avoid influencer picks whose audience has nothing to do with the product.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 8.6<button class="ts" data-t="562.48" title="Play the audio from here">▶ 9:22</button><label class="readchk"><input type="checkbox" data-k="8-6"> Mark as done</label></div><h2 data-t="562.48"><span class="num">8.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>The headline: sell in it, say the benefit, and flag the buyer.</span></h2></header><p data-say data-t="568.98">Ogilvy&#x27;s print rules start with the headline. On average, he says, five times as many people read the headline as read the body copy. So if you don&#x27;t sell the product in the headline, you have wasted eighty percent of your money. That&#x27;s why his headlines often included the brand name and the promise.</p><p data-say data-t="588.30">Headlines that promise a benefit sell more. Real news in the headline helps, because people look for new products and new ways to use old ones. Headlines should be simple, telegraphing the message in plain language.</p><p data-say data-t="602.99">He also says to flag your prospects. If the product is for a special group, name the group in the headline, so they stop and everyone else moves on.</p><p data-say data-t="612.28">And he pushes back on the idea that headlines must be short, citing long headlines like his Rolls-Royce line about the loudest noise at sixty miles an hour being the electric clock. That line came from a technical review in a motoring magazine, which shows the power of research: the best headline was found, not invented.</p><aside class="co co-example" data-t="632.77"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Brand plus promise.</div><p data-say>&quot;Aarke Carbonator 3: up to sixty litres of sparkling water per cylinder, with no plug.&quot; Brand, benefit, a specific, and it works even if nobody reads anything else. Flagged version: &quot;For anyone who drinks a litre of sparkling water a day.&quot;</p></aside><aside class="co co-agency" data-t="653.05"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Check your first line: if it were the only thing seen, would the viewer know the brand and the benefit? If not, add them. Search product reviews and press for a line like the Rolls-Royce one, a specific detail an expert noticed.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 8.7<button class="ts" data-t="669.61" title="Play the audio from here">▶ 11:10</button><label class="readchk"><input type="checkbox" data-k="8-7"> Mark as done</label></div><h2 data-t="669.61"><span class="num">8.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Long copy, captions and pictures with a story.</span></h2></header><p data-say data-t="674.89">Ogilvy believed people read long copy if it is interesting. He says readership falls quickly up to about fifty words, but drops very little between fifty and five hundred. The house ad itself was more than nineteen hundred words long.</p><p data-say data-t="691.21">He also says captions under photographs are read by about twice as many people as the body copy, so every caption should be a miniature ad, with the brand and the promise. Photographs work better than drawings. And pictures with story appeal make readers ask &quot;what&#x27;s going on here?&quot;, and then read the copy to find out.</p><p data-say data-t="711.56">Before-and-after images are above average for attention, and so is any visualised contrast.</p><p data-say data-t="718.74">For a modern product page or a carousel, this means: captions everywhere, real photos, at least one picture that raises a question, and enough copy for the buyer who wants every detail.</p><aside class="co co-example" data-t="731.91"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Captions that sell.</div><p data-say>Under a photo of the carbonator next to a pile of bottles, the caption: &quot;One cylinder, up to sixty litres. That&#x27;s this whole pile you don&#x27;t have to carry.&quot; The caption is a full ad by itself.</p></aside><aside class="co co-agency" data-t="747.10"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Go through your client&#x27;s product page or carousel and give every image a caption with a benefit. Add one photo that makes people ask what&#x27;s happening. Add a before-and-after if the product allows an honest one.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 8.8<button class="ts" data-t="762.06" title="Play the audio from here">▶ 12:42</button><label class="readchk"><input type="checkbox" data-k="8-8"> Mark as done</label></div><h2 data-t="762.06"><span class="num">8.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Go the whole hog on one promise, and give it a first-class ticket.</span></h2></header><p data-say data-t="767.91">Two more lessons from the house ad belong together. First, Ogilvy says most campaigns are too complicated. They reflect a long list of objectives and the views of too many executives, and by trying to do everything they achieve nothing. His fix: boil the strategy down to one simple promise, and go the whole hog in delivering it.</p><p data-say data-t="792.05">Second, the first-class ticket. He says it pays to give most products an image of quality, and that if your advertising looks ugly, people will conclude the product is shoddy. Every ad also adds to, or subtracts from, the brand image over time.</p><p data-say data-t="808.35">There is a tension here with the A-pile and user-generated content, and it is worth thinking through. Native-looking ads do not have to look cheap. A creator in a clean, well-lit kitchen, with a steady phone and good sound, looks real and looks quality. What hurts is sloppiness, not simplicity.</p><p data-say data-t="828.92">For a design-led brand like Aarke, the first-class ticket matters even more. A messy ad for a premium-priced product creates a gap the buyer feels.</p><aside class="co co-example" data-t="840.08"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>One promise, quality execution.</div><p data-say>A brief that says &quot;show design, sustainability, price value, ease of use, warranty and flavours&quot; makes a muddled ad. A brief that says &quot;never carry sparkling water home again&quot;, filmed in a clean, real kitchen with good light, makes one sharp ad. The other benefits become other ads.</p></aside><aside class="co co-agency" data-t="864.70"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Cut your next brief down to one promise per concept. Turn the other benefits into separate concepts to test. And add a short quality line to every creator brief: clean set, natural light, steady shot, clear sound.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 8.9<button class="ts" data-t="882.39" title="Play the audio from here">▶ 14:42</button><label class="readchk"><input type="checkbox" data-k="8-9"> Mark as done</label></div><h2 data-t="882.39"><span class="num">8.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Repeat your winners, and fix the near-misses.</span></h2></header><p data-say data-t="887.09">The house ad ends with two pieces of advice that matter a lot in ad accounts. First, repeat your winners. Ogilvy says many great ads are thrown away before they begin to pay off, and that readership can even increase with repetition.</p><p data-say data-t="903.77">Second, salvage. Many commercials that test poorly can be saved by fixing the faults the test reveals. He claims his agency once doubled a commercial&#x27;s effectiveness simply by re-editing it.</p><p data-say data-t="917.18">This is pure performance-creative thinking. Before you throw away an ad that almost worked, try a new opening, a shorter cut, captions, or a different first frame. Often the idea was right and the edit was wrong.</p><p data-say data-t="931.25">And when something wins, don&#x27;t rush to replace it. Build variations around it and keep it running while it performs.</p><aside class="co co-example" data-t="939.48"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Re-edit before you rewrite.</div><p data-say>A video with a good middle and a weak opening has a low hold rate. Instead of a new shoot, you cut the first three seconds, open on the demonstration, and add a caption hook. Same footage, new life.</p></aside><aside class="co co-agency" data-t="956.11"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For the next ad that almost works, try three re-edits before a new shoot: new first second, shorter cut, new caption hook. Log what changed. In a cold email, offering to re-edit a brand&#x27;s existing footage is a cheap, attractive first project.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="974.54">That&#x27;s the end of Module 8. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>One promise per concept, executed with a first-class look.</li><li>Positioning first: what is it, and for which mindset?</li><li>A large promise, built on a big idea that can make dozens of ads.</li><li>Don&#x27;t be a bore. Make the product the hero. Ignore awards, chase sales.</li><li>Problem, solution, honest proof. Never cheat.</li><li>Video: strong first second, on-camera voice, show more than tell, relevant testimonials.</li><li>Headline: brand plus benefit, flag the buyer, news if real.</li><li>Captions are mini-ads. Pictures with story appeal. Long copy for the interested.</li><li>Repeat winners. Re-edit near-misses before you rewrite.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 10 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="8"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 9 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://hammock.com/content-marketing/david-ogilvys-house-ad-how-to-create-advertising-that-sells/" target="_blank" rel="noopener">&quot;How to Create Advertising that Sells&quot;, Ogilvy &amp; Mather house ad, full text (Hammock)</a></li><li><a href="https://www.1000headlines.com/h/at-60-miles-an-hour-the-loudest-noise" target="_blank" rel="noopener">Rolls-Royce headline origin (1000 Headlines)</a></li><li><a href="https://rodspots.com/2018/04/24/advertising-lessons-from-1923-and-1927/" target="_blank" rel="noopener">Ogilvy on Scientific Advertising (&quot;read this book seven times&quot;)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m07"><small>← Previous</small>Module 7: The Adweek Copywriting Handbook</a><a class="nx" href="#m09"><small>Next →</small>Module 9: The Robert Collier Letter Book</a></nav></article></main></template>
<template id="v-m09" data-cls="chpage hasaudio" data-title="Module 9: The Robert Collier Letter Book · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 9</b> <span>The Robert Collier Letter Book</span></div><div class="tb-r"><a class="ib" href="#m10" title="Next: Module 10">10 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m09-the-robert-collier-letter-book.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 9 · Contents</div><div class="tc-t">The Robert Collier Letter Book</div><ol class="tc"><li><a href="#m09/glance">At a glance</a></li><li class="l2"><a href="#m09/L1"><span class="n">9.1</span> Join the conversation already going on in their head.</a></li><li class="l2"><a href="#m09/L2"><span class="n">9.2</span> Six essentials: a skeleton for any letter.</a></li><li class="l2"><a href="#m09/L3"><span class="n">9.3</span> Sound like one person writing to one person.</a></li><li class="l2"><a href="#m09/L4"><span class="n">9.4</span> Use the snapper honestly, and make the close tiny.</a></li><li class="l2"><a href="#m09/L5"><span class="n">9.5</span> Showmanship: a grabber that makes the letter impossible to ignore.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m09/quiz">✅ Questions (8)</a></li><li><a href="#m09/play">🛠️ Playground (2)</a></li><li><a href="#m09/cards">🃏 Lesson cards (5)</a></li><li><a href="#m09/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09" aria-current="page"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 9 · Robert Collier · 1937 · short module</div><h1 data-t="0.30"><span class="chn">Module 9</span><span data-say>The Robert Collier Letter Book</span> <span class="h1sub" data-say>by Robert Collier: tone for cold emails and letters</span></h1><div class="lead"><p data-say data-t="7.79">Robert Collier was a master of the sales letter, and Halbert put his Letter Book on his short reading list. This is a short module with one purpose: the tone and structure of a letter that gets read and answered. That is exactly what you need for cold emails to brands and agencies.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 7:50</span><span>5 lessons</span><span>8 questions</span><span>2 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m09/L1"><b>9.1 Join the conversation already going on in their head.</b></a> <span class="muted">· 🎧 1:27</span></li><li><a href="#m09/L2"><b>9.2 Six essentials: a skeleton for any letter.</b></a> <span class="muted">· 🎧 1:42</span></li><li><a href="#m09/L3"><b>9.3 Sound like one person writing to one person.</b></a> <span class="muted">· 🎧 1:14</span></li><li><a href="#m09/L4"><b>9.4 Use the snapper honestly, and make the close tiny.</b></a> <span class="muted">· 🎧 1:23</span></li><li><a href="#m09/L5"><b>9.5 Showmanship: a grabber that makes the letter impossible to ignore.</b></a> <span class="muted">· 🎧 1:30</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.simpson-direct.com/the-6-essentials-plus-that-extra-special-ingredient/" target="_blank" rel="noopener">Collier&#x27;s six essentials, explained (Simpson Direct)</a></li><li><a href="https://smartbrandmarketing.com/robert_collier_letter_book_master_ad_copywriter_lessons/" target="_blank" rel="noopener">Lessons from the Letter Book (Smart Brand Marketing)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 9.1<button class="ts" data-t="25.02" title="Play the audio from here">▶ 0:25</button><label class="readchk"><input type="checkbox" data-k="9-1"> Mark as done</label></div><h2 data-t="25.02"><span class="num">9.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Join the conversation already going on in their head.</span></h2></header><p data-say data-t="29.91">The idea most linked to Collier is usually quoted as &quot;enter the conversation already taking place in the customer&#x27;s mind.&quot; That exact wording is a widely attributed paraphrase, but the idea runs through his book: start with what the reader is already thinking about, not with what you want to say.</p><p data-say data-t="49.30">Your reader is not waiting for your letter. They are thinking about their own problems: this month&#x27;s numbers, a campaign that&#x27;s tired, a product launch. If your first line connects to one of those thoughts, you are welcome. If it starts with you, you are an interruption.</p><p data-say data-t="65.72">This is the single biggest fix for cold emails. Most start with &quot;My name is&quot; or &quot;I&#x27;m reaching out because&quot;. Collier would start with the reader&#x27;s world.</p><aside class="co co-example" data-t="76.52"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Their conversation, not yours.</div><p data-say>Your conversation: &quot;I&#x27;m a copywriter looking for opportunities in performance marketing.&quot; Their conversation: &quot;You launched three new Carbonator ads this week, and two of them open with the same line.&quot; The second line is about something they already care about.</p></aside><aside class="co co-agency" data-t="96.46"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before writing a cold email, spend five minutes in the brand&#x27;s Meta Ad Library, website and reviews. Write your first line about one specific thing you saw there. Delete every first line that starts with &quot;I&quot;.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 9.2<button class="ts" data-t="112.26" title="Play the audio from here">▶ 1:52</button><label class="readchk"><input type="checkbox" data-k="9-2"> Mark as done</label></div><h2 data-t="112.26"><span class="num">9.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Six essentials: a skeleton for any letter.</span></h2></header><p data-say data-t="117.53">Collier&#x27;s approach is commonly summarised as six essentials of a sales letter. One: an opening that catches attention. Two: a description or explanation of what you offer. Three: the motive, the reason the reader should want it. Four: proof or a guarantee. Five: the snapper, which shows what the reader loses by not acting. Six: the close, which tells them exactly what to do.</p><p data-say data-t="144.80">In a cold email, each essential can be a single sentence. That keeps the email short, which busy people need, without leaving out anything that makes it work.</p><p data-say data-t="155.40">Compare it with Schwab&#x27;s five fundamentals in Module 3 and Halbert&#x27;s seven steps in Module 4. Same bones, different names. When three masters agree on a structure, use it.</p><aside class="co co-example" data-t="168.92"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Six lines, six essentials.</div><p data-say>Opening: &quot;Your reviews keep praising how easy the Carbonator is, but none of your current ads say it.&quot; Description: &quot;I wrote three hooks built on that.&quot; Motive: &quot;Ease is what your buyers mention most, so it may lower your cost per purchase.&quot; Proof: &quot;Here&#x27;s one: &#x27;No plug. No batteries. Just bubbles.&#x27;&quot; Snapper: &quot;Your competitors haven&#x27;t used this angle yet.&quot; Close: &quot;Want the other two? Reply &#x27;yes&#x27;.&quot;</p></aside><aside class="co co-agency" data-t="201.24"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write your next cold email as six sentences, one per essential. Then read it aloud. If one sentence feels forced, it is probably the snapper; make it honest or cut it.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 9.3<button class="ts" data-t="214.71" title="Play the audio from here">▶ 3:35</button><label class="readchk"><input type="checkbox" data-k="9-3"> Mark as done</label></div><h2 data-t="214.71"><span class="num">9.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Sound like one person writing to one person.</span></h2></header><p data-say data-t="220.10">Collier&#x27;s letters read like a letter from a thoughtful friend, not a company. Plain words, a warm and direct tone, the word &quot;you&quot; far more often than &quot;we&quot; or &quot;I&quot;.</p><p data-say data-t="231.77">That tone does three things. It feels personal, so it gets read. It feels honest, because companies don&#x27;t usually talk like that. And it makes the request feel like a natural next step between two people, not a pitch.</p><p data-say data-t="246.07">For cold emails, this means no corporate phrases, no buzzwords, no long introductions. Write it the way you would explain it to someone across a table.</p><aside class="co co-example" data-t="257.18"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Company voice versus person voice.</div><p data-say>Company: &quot;We offer comprehensive copywriting solutions to leverage your brand&#x27;s growth potential.&quot; Person: &quot;I noticed something in your reviews that I think could make a strong ad. Want me to show you?&quot; The second sounds like a human who did their homework.</p></aside><aside class="co co-agency" data-t="276.65"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Count the &quot;you&quot;s and the &quot;I&quot;s in your email. There should be more &quot;you&quot; than &quot;I&quot;. Replace any phrase you would never say out loud. Sign with your first name only.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 9.4<button class="ts" data-t="288.94" title="Play the audio from here">▶ 4:49</button><label class="readchk"><input type="checkbox" data-k="9-4"> Mark as done</label></div><h2 data-t="288.94"><span class="num">9.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Use the snapper honestly, and make the close tiny.</span></h2></header><p data-say data-t="294.09">The snapper is Collier&#x27;s push at the end: what does the reader lose by not acting? In old sales letters it was often a deadline or a limited supply. Used honestly, it is simply the cost of waiting.</p><p data-say data-t="307.56">For a cold email, the honest snapper is usually small and true: an angle competitors haven&#x27;t used yet, a seasonal moment coming up, or simply that the samples are ready now. Never invent pressure.</p><p data-say data-t="321.84">Then the close. Collier tells the reader exactly what to do. In a cold email, make it the smallest possible yes: reply with one word, or say which of two options they want. A small yes is easy, and it starts the conversation.</p><aside class="co co-example" data-t="338.85"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Honest snapper, tiny close.</div><p data-say>&quot;Christmas campaigns start soon, and none of your current ads use the gift angle your reviews mention. I&#x27;ve drafted two. Reply &#x27;send&#x27; and they&#x27;re yours.&quot; True timing, a real gap, and a one-word close.</p></aside><aside class="co co-agency" data-t="357.38"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>End every cold email with a one-word or one-click reply. Remove every second request. If you can&#x27;t think of an honest snapper, leave it out. A clear, small close works on its own.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 9.5<button class="ts" data-t="371.64" title="Play the audio from here">▶ 6:12</button><label class="readchk"><input type="checkbox" data-k="9-5"> Mark as done</label></div><h2 data-t="371.64"><span class="num">9.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Showmanship: a grabber that makes the letter impossible to ignore.</span></h2></header><p data-say data-t="377.99">Collier&#x27;s book has a chapter on showmanship in letters. Halbert, in his Grabbers issue, quotes a famous example from it: a letter with a real dollar bill attached, and he repeats the very high response the book reports. The bill made the letter impossible to ignore, and the first line explained why it was there in a way that led into the request.</p><p data-say data-t="400.60">For you, the digital equivalent is a small, real, specific thing attached to the email: one hook written from their reviews, a ten-second screen recording of their ad with your idea, or a one-page spec test plan. It is the grabber, and it is also the proof that you can do the work.</p><p data-say data-t="420.52">As always, it must tie to the message. A random gimmick, like a meme or a funny GIF, gets attention and loses credibility.</p><aside class="co co-example" data-t="429.59"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The modern dollar bill.</div><p data-say>&quot;Attached is one hook I wrote from your own five-star reviews. It took me twenty minutes. Imagine what three weeks of testing would find.&quot; The attachment grabs attention and proves the point in one go.</p></aside><aside class="co co-agency" data-t="445.60"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Attach or include one small, real piece of work in every cold email: one hook, one script, or one test plan, made for that brand. Remember the standing rule: you write and send these yourself.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="461.39">That&#x27;s the end of Module 9. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Join the conversation already in their head; never open with &quot;I&quot;.</li><li>Six essentials: opening, description, motive, proof, snapper, close.</li><li>One person to one person: plain, warm, more &quot;you&quot; than &quot;I&quot;.</li><li>Snapper only when true. Close with a one-word reply.</li><li>A modern grabber: one small, real piece of work made for them.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 8 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 2 drills</span></summary><div class="pb"><div id="playbox" data-n="9"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 5 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://www.simpson-direct.com/the-6-essentials-plus-that-extra-special-ingredient/" target="_blank" rel="noopener">Collier&#x27;s six essentials (Simpson Direct)</a></li><li><a href="https://smartbrandmarketing.com/robert_collier_letter_book_master_ad_copywriter_lessons/" target="_blank" rel="noopener">Lessons from the Robert Collier Letter Book (Smart Brand Marketing)</a></li><li><a href="https://thegaryhalbertletter.com/newsletters/zakk_grabbers.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;Grabbers&quot; (Collier&#x27;s dollar-bill letter)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m08"><small>← Previous</small>Module 8: Ogilvy on Advertising</a><a class="nx" href="#m10"><small>Next →</small>Module 10: Modern Performance Creative</a></nav></article></main></template>
<template id="v-m10" data-cls="chpage hasaudio" data-title="Module 10: Modern Performance Creative · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 10</b> <span>Modern Performance Creative</span></div><div class="tb-r"><a class="ib" href="#m11" title="Next: Module 11">11 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m10-modern-performance-creative.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 10 · Contents</div><div class="tc-t">Modern Performance Creative</div><ol class="tc"><li><a href="#m10/glance">At a glance</a></li><li class="l2"><a href="#m10/L1"><span class="n">10.1</span> Built for the thumb: the first three seconds carry the message.</a></li><li class="l2"><a href="#m10/L2"><span class="n">10.2</span> Hook, body, call to action: the ABCD map.</a></li><li class="l2"><a href="#m10/L3"><span class="n">10.3</span> Creative is the new targeting.</a></li><li class="l2"><a href="#m10/L4"><span class="n">10.4</span> Diversify for real, not with tiny tweaks.</a></li><li class="l2"><a href="#m10/L5"><span class="n">10.5</span> Brief like a performance team: insight, audience, direction.</a></li><li class="l2"><a href="#m10/L6"><span class="n">10.6</span> Research first, a hypothesis on every test.</a></li><li class="l2"><a href="#m10/L7"><span class="n">10.7</span> Format choice: statics, creators and partnership ads.</a></li><li class="l2"><a href="#m10/L8"><span class="n">10.8</span> Halbert&#x27;s seven steps inside a fifteen-second Reel.</a></li><li class="l2"><a href="#m10/L9"><span class="n">10.9</span> Stay honest: policy, proof and real numbers only.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m10/quiz">✅ Questions (10)</a></li><li><a href="#m10/play">🛠️ Playground (3)</a></li><li><a href="#m10/cards">🃏 Lesson cards (9)</a></li><li><a href="#m10/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10" aria-current="page"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Today&#x27;s playbook · Meta and Google guidance · 2020 to 2025</div><h1 data-t="0.30"><span class="chn">Module 10</span><span data-say>Modern Performance Creative</span> <span class="h1sub" data-say>Hook, body, call to action, and what Meta says works now</span></h1><div class="lead"><p data-say data-t="8.75">The classics were written for newspapers, envelopes and TV. Your job will mostly be short video and static ads in feeds. This module connects the two. It uses only what the platforms themselves publish, Meta&#x27;s guidance on mobile-first creative and creative diversification and Google&#x27;s ABCD framework, plus what one performance agency, SoScale, says on its own site about how it works. Every claim here is linked. Where a number comes from Meta itself, it is labelled as Meta&#x27;s figure.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 17:17</span><span>9 lessons</span><span>10 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m10/L1"><b>10.1 Built for the thumb: the first three seconds carry the message.</b></a> <span class="muted">· 🎧 2:02</span></li><li><a href="#m10/L2"><b>10.2 Hook, body, call to action: the ABCD map.</b></a> <span class="muted">· 🎧 1:57</span></li><li><a href="#m10/L3"><b>10.3 Creative is the new targeting.</b></a> <span class="muted">· 🎧 1:57</span></li><li><a href="#m10/L4"><b>10.4 Diversify for real, not with tiny tweaks.</b></a> <span class="muted">· 🎧 1:45</span></li><li><a href="#m10/L5"><b>10.5 Brief like a performance team: insight, audience, direction.</b></a> <span class="muted">· 🎧 1:34</span></li><li><a href="#m10/L6"><b>10.6 Research first, a hypothesis on every test.</b></a> <span class="muted">· 🎧 1:50</span></li><li><a href="#m10/L7"><b>10.7 Format choice: statics, creators and partnership ads.</b></a> <span class="muted">· 🎧 1:48</span></li><li><a href="#m10/L8"><b>10.8 Halbert&#x27;s seven steps inside a fifteen-second Reel.</b></a> <span class="muted">· 🎧 1:36</span></li><li><a href="#m10/L9"><b>10.9 Stay honest: policy, proof and real numbers only.</b></a> <span class="muted">· 🎧 1:56</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://en-gb.facebook.com/business/news/mobile-first-creative" target="_blank" rel="noopener">Meta: mobile-first creative best practices</a></li><li><a href="https://en-gb.facebook.com/business/news/three-steps-to-optimize-your-performance-with-creative-diversification" target="_blank" rel="noopener">Meta: creative diversification in three steps</a></li><li><a href="https://support.google.com/google-ads/answer/14783551" target="_blank" rel="noopener">Google Ads: the ABCDs of effective video creative</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 10.1<button class="ts" data-t="42.40" title="Play the audio from here">▶ 0:42</button><label class="readchk"><input type="checkbox" data-k="10-1"> Mark as done</label></div><h2 data-t="42.40"><span class="num">10.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Built for the thumb: the first three seconds carry the message.</span></h2></header><p data-say data-t="48.42">Meta&#x27;s mobile-first guidance starts with a fact about the feed: people move fast on phones. So capture attention quickly, with motion, quick scenes and speed, and put the main message in the first three seconds. Meta suggests keeping videos to fifteen seconds or less, with a single-minded message.</p><p data-say data-t="69.54">This is Schwab and Caples in a new medium. The headline is now the first three seconds. If the opening doesn&#x27;t sell the reason to watch, the rest is never seen.</p><p data-say data-t="80.77">Meta also advises designing for sound off, while delighting people who do have sound on. That means captions or on-screen text that carry the message without audio. And it advises framing for the placement: vertical nine by sixteen for Stories and Reels, four by five or square in feed.</p><p data-say data-t="100.42">None of this replaces good copy. It is the delivery system for it. A Hopkins-style specific promise still has to be the thing in those first three seconds.</p><p data-say data-t="110.84">A quick way to check: pause your video at the three-second mark and show the frame to someone who hasn&#x27;t seen the ad. Ask what is being sold and why they might want it. If they can&#x27;t say, the opening is decoration, not a headline.</p><aside class="co co-example" data-t="125.31"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Three seconds, one message.</div><p data-say>Second 0 to 1: a hand drops a heavy bag of bottles on the counter. Text on screen: &quot;Still carrying these home?&quot; Second 1 to 3: the carbonator, lever pressed, bubbles rising. Text: &quot;Your tap, with bubbles.&quot; The whole message lands before the three-second mark, with no sound needed.</p></aside><aside class="co co-agency" data-t="149.29"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For every video concept, write out what is on screen and in text at seconds zero, one, two and three. If the main message isn&#x27;t there by three, rewrite. Check every draft with the sound off.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 10.2<button class="ts" data-t="164.89" title="Play the audio from here">▶ 2:45</button><label class="readchk"><input type="checkbox" data-k="10-2"> Mark as done</label></div><h2 data-t="164.89"><span class="num">10.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Hook, body, call to action: the ABCD map.</span></h2></header><p data-say data-t="170.96">Google&#x27;s ABCD framework for video ads gives you a clean structure. A is attention: hook people from the start. B is branding: show or say the brand early and often. C is connection: make people think or feel something, and help them understand the product. D is direction: ask them to act.</p><p data-say data-t="191.76">For ads where you want action, Google&#x27;s guidance adds three useful

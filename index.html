phrases: make the product the ad, be exact and tangible, and present the ask after the context is set.</p><p data-say data-t="204.39">That maps onto the hook, body and call-to-action structure performance teams use. The hook is attention, ideally with the brand visible. The body is connection, where you show the product doing the thing, with exact, tangible facts. The call to action is direction, after the viewer understands why.</p><p data-say data-t="224.40">Meta&#x27;s mobile-first guidance also suggests introducing the brand early, and, for conversion goals, focusing on the products. Two platforms, same advice.</p><aside class="co co-example" data-t="235.73"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A fifteen-second ABCD script.</div><p data-say>Attention, zero to three seconds: &quot;Still carrying sparkling water home?&quot; with the carbonator and logo in shot. Connection, three to twelve seconds: lever, hiss, pour; text &quot;up to 60 litres per cylinder, no plug&quot;. Direction, twelve to fifteen: &quot;Get the starter kit. Link below.&quot;</p></aside><aside class="co co-agency" data-t="262.30"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Label every line of your scripts A, B, C or D. Check the brand appears in the first few seconds, the body is exact and tangible, and the ask comes only after the viewer knows why. Rewrite any vague line in the body as a number or a demonstration.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 10.3<button class="ts" data-t="281.48" title="Play the audio from here">▶ 4:41</button><label class="readchk"><input type="checkbox" data-k="10-3"> Mark as done</label></div><h2 data-t="281.48"><span class="num">10.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Creative is the new targeting.</span></h2></header><p data-say data-t="285.89">In April 2025 Meta published a post about creative diversification and its new ad-retrieval system, Andromeda. The message for advertisers is that the focus has shifted. Instead of finding the right people through narrow targeting, the system now finds people by matching them with the right creative. Creative diversification is presented as the best lever you have.</p><p data-say data-t="311.06">Meta reported that Andromeda improved ads quality by eight percent, which is Meta&#x27;s figure, measured on Meta&#x27;s terms.</p><p data-say data-t="319.90">For you, this changes the job. Your ads are no longer just messages for an audience someone else picked. Each ad is a signal that helps the system find the people it fits. Different angles find different people.</p><p data-say data-t="333.77">This is Schwartz&#x27;s awareness levels and Ogilvy&#x27;s positioning, run by an algorithm. A problem-aware hook finds problem-aware people. An identity hook finds people who share that identity.</p><aside class="co co-example" data-t="346.66"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Creative as audience.</div><p data-say>Instead of one ad shown to &quot;women 25 to 45 interested in cooking&quot;, you build five ads with clearly different angles: the bottle hauler, the design lover, the host, the plastic cutter, the price-conscious buyer. The system learns which people respond to which angle.</p></aside><p data-say data-t="367.49">This also changes how you read results. When one angle wins, it has not only found a better message, it has found a different group of buyers. Write that down as an insight about the market, because it tells you which persona to brief next.</p><aside class="co co-agency" data-t="383.09"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For a client brief, describe each ad by the person it is for and the angle it uses, not by its visual. If two of your ads would attract the same person for the same reason, they are not diverse. Replace one.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 10.4<button class="ts" data-t="398.09" title="Play the audio from here">▶ 6:38</button><label class="readchk"><input type="checkbox" data-k="10-4"> Mark as done</label></div><h2 data-t="398.09"><span class="num">10.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Diversify for real, not with tiny tweaks.</span></h2></header><p data-say data-t="403.15">Meta&#x27;s creative diversification guidance, from November 2024, gets practical. It recommends launching new ads every week, using at least twenty diversified ads in Advantage+ shopping campaigns, and putting twenty to thirty percent of budget into testing.</p><p data-say data-t="421.46">The key word is diversified. Changing the button colour or swapping one word is not diversity. Diversity is a different person, a different motivation, a different format: a creator talking, a static with a strong claim, a demonstration, a customer review, a comparison.</p><p data-say data-t="441.09">This lines up with Caples: test appeals first. Twenty ads that all say the same thing in slightly different words are one idea. Twenty ads built on five appeals in four formats are twenty real tests.</p><p data-say data-t="456.21">It also means volume. Agencies that produce many assets every month do it because the system rewards fresh, varied creative.</p><aside class="co co-example" data-t="466.27"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Five by four.</div><p data-say>Five appeals: convenience, design, no plug, proof, price redefinition. Four formats: creator talking to camera, product demo with text, static with one big number, review screenshot with a caption. Twenty genuinely different ads from one brief.</p></aside><aside class="co co-agency" data-t="487.32"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Build your next creative plan as a grid: appeals down the side, formats across the top. Fill every cell with one hook. That is your twenty-ad launch, and a grid like this is a very strong portfolio piece.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 10.5<button class="ts" data-t="503.20" title="Play the audio from here">▶ 8:23</button><label class="readchk"><input type="checkbox" data-k="10-5"> Mark as done</label></div><h2 data-t="503.20"><span class="num">10.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Brief like a performance team: insight, audience, direction.</span></h2></header><p data-say data-t="509.27">Meta&#x27;s diversification guidance also recommends a weekly creative brief with three parts: an insight, the opportunity or audience, and the creative direction. It suggests building personas with needs and blockers.</p><p data-say data-t="524.44">An insight is something true about people that the product connects to, not a product feature. &quot;People hate carrying heavy bottles&quot; is an insight. &quot;The product is steel&quot; is a feature.</p><p data-say data-t="536.92">The persona&#x27;s needs are what they want. The blockers are what stops them buying: price, doubt, space, habit. Good creative speaks to the need and removes a blocker.</p><p data-say data-t="547.72">This is Halbert&#x27;s nugget notes, organised for a team. The research turns into briefs that a creator, a designer and an editor can act on.</p><aside class="co co-example" data-t="557.58"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>One persona brief.</div><p data-say>Persona: the weekly bottle hauler. Need: sparkling water without the effort. Blocker: &quot;it&#x27;s expensive&quot;. Insight: carrying bottles is the part they hate, not the drinking. Direction: a creator shows a week of not carrying bottles, then handles the price question honestly with a real comparison.</p></aside><aside class="co co-agency" data-t="581.94"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write one persona brief per week for a brand you follow: insight, need, blocker, direction, three hooks. Four weeks gives you four portfolio briefs that look exactly like agency work.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 10.6<button class="ts" data-t="597.57" title="Play the audio from here">▶ 9:58</button><label class="readchk"><input type="checkbox" data-k="10-6"> Mark as done</label></div><h2 data-t="597.57"><span class="num">10.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Research first, a hypothesis on every test.</span></h2></header><p data-say data-t="603.90">SoScale, the Stockholm performance agency, describes on its own website how it works. It says it bases creative on research from surveys, reviews and data, runs a hypothesis on every ad test, and produces two hundred and fifty or more assets a month across statics, user-generated content and productions. It also says content is what matters. Those are the agency&#x27;s own claims.</p><p data-say data-t="631.02">Notice how classic this is. Research from reviews is Halbert&#x27;s student-of-markets lesson. A hypothesis on every test is Hopkins and Caples. Many assets a month is Meta&#x27;s diversification advice.</p><p data-say data-t="646.12">A hypothesis turns a test into learning. &quot;Ad B will beat Ad A&quot; is a guess. &quot;Ad B will win because reviews mention carrying bottles more than design&quot; is a hypothesis. When it wins or loses, you learn something about buyers that you can use next week.</p><aside class="co co-example" data-t="664.62"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Hypothesis template.</div><p data-say>&quot;We believe that [angle] will beat [control] for [persona], because [evidence from research]. We&#x27;ll know when [metric] is lower over [time].&quot; Filled in: &quot;We believe the bottle-free hook will beat the design hook for weekly buyers, because reviews mention carrying bottles most. We&#x27;ll know when cost per purchase is lower after seven days.&quot;</p></aside><aside class="co co-agency" data-t="689.99"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write a hypothesis for every ad you put in your portfolio. It shows you think the way performance agencies say they work. In a cold email to an agency like SoScale, show one hypothesis-driven test plan, not a list of skills.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 10.7<button class="ts" data-t="707.44" title="Play the audio from here">▶ 11:47</button><label class="readchk"><input type="checkbox" data-k="10-7"> Mark as done</label></div><h2 data-t="707.44"><span class="num">10.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Format choice: statics, creators and partnership ads.</span></h2></header><p data-say data-t="714.06">Performance accounts mix formats. Statics are fast to make and test a claim cleanly. Creator videos, often called UGC, carry stories and demonstrations. Higher-production ads carry brand and product beauty.</p><p data-say data-t="730.47">Meta&#x27;s diversification guidance mentions partnership ads, where a brand runs ads through a creator&#x27;s handle. Meta reports an average nineteen percent lower cost per acquisition for partnership ads in its own study. Again, that is Meta&#x27;s figure, not a guarantee for every account.</p><p data-say data-t="750.46">The copywriter&#x27;s job differs by format. For statics, it is one line and one number. For creator videos, it is a brief and a script the creator can say naturally. For productions, it is the concept and the words on screen.</p><p data-say data-t="767.17">Whatever the format, branded content needs to be disclosed, and health and wellness claims need to follow Meta&#x27;s advertising standards.</p><aside class="co co-example" data-t="776.29"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>One idea, three formats.</div><p data-say>Static: &quot;Up to 60 litres per cylinder.&quot; over a photo of the carbonator next to a bottle pile. Creator: &quot;I haven&#x27;t carried a bottle home since March,&quot; filmed in her kitchen. Production: slow, clean shots of the steel body, the lever, the pour, with the line &quot;Your tap, with bubbles.&quot;</p></aside><aside class="co co-agency" data-t="800.22"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Take your best hook and write it for all three formats. Note which disclosure or policy check each needs. A portfolio page that shows one idea across three formats proves range.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 10.8<button class="ts" data-t="815.29" title="Play the audio from here">▶ 13:35</button><label class="readchk"><input type="checkbox" data-k="10-8"> Mark as done</label></div><h2 data-t="815.29"><span class="num">10.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Halbert&#x27;s seven steps inside a fifteen-second Reel.</span></h2></header><p data-say data-t="820.80">Everything in this course fits into modern formats if you compress it. Halbert&#x27;s seven steps in Module 4 can run in fifteen to thirty seconds, one step per line or shot.</p><p data-say data-t="833.31">Attention in the first second. Why interested by second three: the central selling idea. Why believe and proof in the middle: the mechanism and one demonstration or number. Benefits as quick text overlays. How to order and order now in the last two seconds.</p><p data-say data-t="852.41">The order still matters more than the length. You earn attention before you explain, and you prove before you ask.</p><p data-say data-t="860.33">For longer formats, like a sixty-second creator story or a landing page, the steps stretch out and the benefits section grows. Same skeleton.</p><aside class="co co-example" data-t="870.70"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Seven steps in fifteen seconds.</div><p data-say>0s &quot;Still carrying these home?&quot; 1s &quot;Make it at your tap instead.&quot; 3s &quot;No plug. A lever and a gas cylinder.&quot; 5s single shot: press, hiss, pour. 8s text: &quot;Up to 60 litres per cylinder · steel · 3-year warranty when registered&quot;. 12s &quot;Starter kit, link below.&quot; 14s &quot;Your first glass, this week.&quot;</p></aside><aside class="co co-agency" data-t="898.85"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write one script in exactly this shape for a brand you like. Time it out loud. Then write the same concept as a sixty-second creator story and compare. Both go in your portfolio.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 10.9<button class="ts" data-t="911.76" title="Play the audio from here">▶ 15:12</button><label class="readchk"><input type="checkbox" data-k="10-9"> Mark as done</label></div><h2 data-t="911.76"><span class="num">10.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Stay honest: policy, proof and real numbers only.</span></h2></header><p data-say data-t="917.64">Modern platforms add rules the classic writers never faced. Meta&#x27;s advertising standards restrict certain health and wellness claims and content that makes people feel bad about their bodies. Branded content has to be disclosed. Misleading claims can get ads rejected or accounts restricted.</p><p data-say data-t="938.14">The classic body-fat ad you&#x27;ll study in Module 11, with its miracle claims, would not run today. The structure can still teach you. The claims would get the ad rejected and could break consumer law in the EU.</p><p data-say data-t="951.72">The safest path is also the most persuasive one: real, specific, checkable claims. Every number in your ads should come from the brand, a test, the reviews, or a public source you can link. If you can&#x27;t find a number, describe the product or the experience instead.</p><p data-say data-t="970.51">Keep the source list with the creative, not in your head. When a reviewer, a client or Meta asks where a claim comes from, you can answer in seconds. That habit alone makes you easier to trust with a client&#x27;s ad account.</p><p data-say data-t="984.98">Hopkins, Halbert and Ogilvy all said specifics beat hype. Today, specifics also keep the account alive.</p><aside class="co co-example" data-t="993.91"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Safe and strong.</div><p data-say>Risky: &quot;Lose bloating instantly with our miracle water!&quot; Safe and strong: &quot;Up to 60 litres of sparkling water per cylinder, no plug needed.&quot; The second is checkable, specific and policy-safe.</p></aside><aside class="co co-agency" data-t="1012.54"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Run a claim check on every ad: next to each claim, write its source. Remove anything you can&#x27;t source. Add this step to your briefs; agencies love copywriters who keep accounts out of trouble.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="1027.73">That&#x27;s the end of Module 10. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Main message in the first three seconds; design for sound off; frame for placement.</li><li>ABCD: attention, branding, connection, direction. Product is the ad; ask after context.</li><li>Creative is the new targeting: each angle finds its own people.</li><li>Diversify for real: appeals times formats, new ads weekly, 20 to 30% to testing.</li><li>Brief: insight, persona needs and blockers, direction.</li><li>Research from reviews; a hypothesis on every test.</li><li>Statics, creators, productions, partnership ads: one idea, many formats.</li><li>Policy-safe specifics only. Source every claim.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 10 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="10"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 9 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://en-gb.facebook.com/business/news/mobile-first-creative" target="_blank" rel="noopener">Meta: mobile-first creative best practices (10 Jan 2020)</a></li><li><a href="https://en-gb.facebook.com/business/news/three-steps-to-optimize-your-performance-with-creative-diversification" target="_blank" rel="noopener">Meta: three steps to optimise performance with creative diversification (19 Nov 2024)</a></li><li><a href="https://en-gb.facebook.com/business/news/the-creative-advantage-unlocking-the-power-of-diversification-with-meta-andromeda" target="_blank" rel="noopener">Meta: creative diversification with Meta Andromeda (22 Apr 2025)</a></li><li><a href="https://engineering.fb.com/2024/12/02/production-engineering/meta-andromeda-advantage-automation-next-gen-personalized-ads-retrieval-engine/" target="_blank" rel="noopener">Meta Engineering: Andromeda (2 Dec 2024)</a></li><li><a href="https://support.google.com/google-ads/answer/14783551" target="_blank" rel="noopener">Google Ads Help: ABCDs of effective video ads</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (their own claims)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m09"><small>← Previous</small>Module 9: The Robert Collier Letter Book</a><a class="nx" href="#m11"><small>Next →</small>Module 11: Six Classic Ads, Torn Down</a></nav></article></main></template>
<template id="v-m11" data-cls="chpage hasaudio" data-title="Module 11: Six Classic Ads, Torn Down · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 11</b> <span>Six Classic Ads, Torn Down</span></div><div class="tb-r"><a class="ib" href="#m12" title="Next: Module 12">12 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m11-six-classic-ads-torn-down.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 11 · Contents</div><div class="tc-t">Six Classic Ads, Torn Down</div><ol class="tc"><li><a href="#m11/glance">At a glance</a></li><li class="l2"><a href="#m11/L1"><span class="n">11.1</span> How to tear down an ad, and how to copy one.</a></li><li class="l2"><a href="#m11/L2"><span class="n">11.2</span> &quot;Do You Make These Mistakes In English?&quot;: a question with one magic word.</a></li><li class="l2"><a href="#m11/L3"><span class="n">11.3</span> &quot;What Everybody Ought To Know About This Stock And Bond Business&quot;: the ad that taught.</a></li><li class="l2"><a href="#m11/L4"><span class="n">11.4</span> The coat-of-arms letter: the reader&#x27;s own name as the hook.</a></li><li class="l2"><a href="#m11/L5"><span class="n">11.5</span> &quot;How To Burn Off Body Fat Hour-By-Hour!&quot;: news style, mechanism and a risk-free close.</a></li><li class="l2"><a href="#m11/L6"><span class="n">11.6</span> The Admiral Byrd letter: price first, and danger as a benefit.</a></li><li class="l2"><a href="#m11/L7"><span class="n">11.7</span> &quot;The Lazy Man&#x27;s Way To Riches&quot;: the confession hook and the uncashed check.</a></li><li class="l2"><a href="#m11/L8"><span class="n">11.8</span> Putting the six moves together in one modern ad.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m11/quiz">✅ Questions (9)</a></li><li><a href="#m11/play">🛠️ Playground (3)</a></li><li><a href="#m11/cards">🃏 Lesson cards (8)</a></li><li><a href="#m11/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11" aria-current="page"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Classic ads · teardowns and the type-out pad</div><h1 data-t="0.30"><span class="chn">Module 11</span><span data-say>Six Classic Ads, Torn Down</span> <span class="h1sub" data-say>From Sackheim to Halbert to Karbo</span></h1><div class="lead"><p data-say data-t="6.78">Halbert&#x27;s first instruction was to copy the great ads by hand. This module gives you six of them, all on his radar or in the same tradition. For each one you get the facts, the moves that made it work, and how to use those moves today in a Meta ad or a cold email. We do not reproduce the ads here. Each one is linked to a public archive or a swipe site where you can read it, and the type-out pad in the playground lets you paste the text yourself and copy it with a timer. A word of warning: some of these ads make claims that would break today&#x27;s Meta policies and consumer law. Study the structure, never the claims.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 16:43</span><span>8 lessons</span><span>9 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m11/L1"><b>11.1 How to tear down an ad, and how to copy one.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m11/L2"><b>11.2 &quot;Do You Make These Mistakes In English?&quot;: a question with one magic word.</b></a> <span class="muted">· 🎧 1:53</span></li><li><a href="#m11/L3"><b>11.3 &quot;What Everybody Ought To Know About This Stock And Bond Business&quot;: the ad that taught.</b></a> <span class="muted">· 🎧 1:50</span></li><li><a href="#m11/L4"><b>11.4 The coat-of-arms letter: the reader&#x27;s own name as the hook.</b></a> <span class="muted">· 🎧 1:58</span></li><li><a href="#m11/L5"><b>11.5 &quot;How To Burn Off Body Fat Hour-By-Hour!&quot;: news style, mechanism and a risk-free close.</b></a> <span class="muted">· 🎧 2:04</span></li><li><a href="#m11/L6"><b>11.6 The Admiral Byrd letter: price first, and danger as a benefit.</b></a> <span class="muted">· 🎧 2:11</span></li><li><a href="#m11/L7"><b>11.7 &quot;The Lazy Man&#x27;s Way To Riches&quot;: the confession hook and the uncashed check.</b></a> <span class="muted">· 🎧 2:06</span></li><li><a href="#m11/L8"><b>11.8 Putting the six moves together in one modern ad.</b></a> <span class="muted">· 🎧 2:06</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">Halbert on copying ads by hand (&quot;Hands On Experience&quot;)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 11.1<button class="ts" data-t="46.07" title="Play the audio from here">▶ 0:46</button><label class="readchk"><input type="checkbox" data-k="11-1"> Mark as done</label></div><h2 data-t="46.07"><span class="num">11.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>How to tear down an ad, and how to copy one.</span></h2></header><p data-say data-t="50.58">Before the six ads, here is the method. A teardown asks five questions. What is the headline&#x27;s job, and who does it select? What is the hook in the first lines? What is the central selling idea? Where is the proof? And how does the ad close: what exactly does it ask the reader to do, and how does it remove risk?</p><p data-say data-t="71.74">Then you copy it. Slowly, word for word, by hand or in the type-out pad. As you copy, notice where sentences get shorter, where the writer uses a subhead, where the proof arrives, and how the ask is phrased. Your fingers notice things your eyes skip.</p><p data-say data-t="90.10">Don&#x27;t copy for speed. The words-per-minute number in the pad is there so you can see your progress over weeks, not to race. Accuracy matters more.</p><p data-say data-t="100.64">After each session, write three lines: the move you would steal, the move that wouldn&#x27;t work today, and one hook for a modern brand using the stolen move.</p><aside class="co co-example" data-t="111.18"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Three lines after a session.</div><p data-say>Steal: the word &quot;these&quot; in a question headline creates a list the reader must check. Wouldn&#x27;t work today: the dated tone about &quot;breeding&quot; and status. Modern hook: &quot;Do you make these mistakes with your home sparkling water?&quot;</p></aside><aside class="co co-agency" data-t="129.68"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Pick one ad from this module today. Open the source link, read it once fast, then copy it in the type-out pad for twenty minutes. Write your three lines. Do one ad a day, and repeat your favourite every week.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 11.2<button class="ts" data-t="144.75" title="Play the audio from here">▶ 2:25</button><label class="readchk"><input type="checkbox" data-k="11-2"> Mark as done</label></div><h2 data-t="144.75"><span class="num">11.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>&quot;Do You Make These Mistakes In English?&quot;: a question with one magic word.</span></h2></header><p data-say data-t="150.87">Maxwell Sackheim wrote this ad in 1919 for the Sherwin Cody School of English, a home-study course. It ran for more than forty years. Victor Schwab, who later managed the account, compared ten years of returns and found it drew nearly three times the response of the alternative headline, &quot;How to Speak and Write Masterly English&quot;.</p><p data-say data-t="173.38">The headline is a question that makes the reader check themselves. And the word &quot;these&quot; does most of the work. It points at a specific list the reader hasn&#x27;t seen yet. Which mistakes? Do I make them? You have to read on to find out.</p><p data-say data-t="188.48">The body opens with a demonstration: real examples of common mistakes, so readers catch themselves. Then it reframes the problem: you make mistakes not because you don&#x27;t know the rules, but because you never built the habit. Then it promises ease, with the course needing only fifteen minutes a day, and closes with a free booklet and a reassurance that no agent will call.</p><p data-say data-t="212.93">That last line answers the fear behind &quot;free&quot; before the reader can raise it.</p><aside class="co co-example" data-t="218.57"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The moves for today.</div><p data-say>Question plus &quot;these&quot;: &quot;Do you make these 3 mistakes in your Meta ads?&quot; Demonstration: show one of the mistakes in the first seconds. Reframe: &quot;It&#x27;s not your targeting, it&#x27;s your first three seconds.&quot; Free offer plus fear answered: &quot;Free teardown of one ad. No call needed.&quot;</p></aside><aside class="co co-agency" data-t="240.94"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write a lead-generation hook in the &quot;these mistakes&quot; pattern for a DTC brand. Then use the same pattern as a cold-email subject: &quot;These 3 lines in your Carbonator ads.&quot; Make sure the email actually delivers exactly those three.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 11.3<button class="ts" data-t="257.96" title="Play the audio from here">▶ 4:18</button><label class="readchk"><input type="checkbox" data-k="11-3"> Mark as done</label></div><h2 data-t="257.96"><span class="num">11.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>&quot;What Everybody Ought To Know About This Stock And Bond Business&quot;: the ad that taught.</span></h2></header><p data-say data-t="264.46">Louis Engel of Merrill Lynch wrote this ad, which first ran in The New York Times on 19 October 1948. It was famously long, about sixty-five hundred words on a single page; sources give slightly different counts. It had no hard sell. It simply explained, in plain English, how stocks, bonds and the stock exchange work.</p><p data-say data-t="287.71">The offer at the end was a free booklet. The swipe archive reports that the ad, in its versions, ran into the mid 1960s and produced over ten thousand requests for the booklet. Other sources give lower figures, so treat the number as approximate.</p><p data-say data-t="304.92">Why did it work? It respected the reader&#x27;s intelligence and answered every question a nervous first-time investor had. It built trust by teaching. By the end, Merrill Lynch was the obvious firm to ask for more.</p><p data-say data-t="319.92">This is Hopkins&#x27; &quot;offer service&quot; and Ogilvy&#x27;s long copy, at full scale.</p><aside class="co co-example" data-t="325.80"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Teaching as selling, today.</div><p data-say>A carousel or landing page titled &quot;What everybody ought to know about home carbonation&quot;: how the gas works, what a cylinder costs to swap, how long a cylinder lasts, what the warranty covers. No pressure, just answers. The brand that teaches becomes the brand people trust.</p></aside><aside class="co co-agency" data-t="347.21"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write the headline &quot;What everybody ought to know about...&quot; for your client&#x27;s category, and list the eight questions a nervous first-time buyer has. That list is a carousel, a landing page and five ad hooks. In cold emails, offering to teach, such as a short teardown, is the Engel move.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 11.4<button class="ts" data-t="368.28" title="Play the audio from here">▶ 6:08</button><label class="readchk"><input type="checkbox" data-k="11-4"> Mark as done</label></div><h2 data-t="368.28"><span class="num">11.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>The coat-of-arms letter: the reader&#x27;s own name as the hook.</span></h2></header><p data-say data-t="373.99">This is one of Gary Halbert&#x27;s most famous letters. Halbert wrote in his newsletter that it was among the most widely mailed letters in history, about a hundred and forty million copies, all sent first-class, and that it produced seven million three hundred thousand cash-with-order customers. Those are his own claims. His son Bond says Gary described the letter as the result of eighteen months of hidden psychology and testing.</p><p data-say data-t="400.65">The letter, written in the voice of a woman who signs it, opens with a question about the reader&#x27;s own family name: &quot;Did you know that your family name was recorded with a coat-of-arms in ancient heraldic archives more than seven centuries ago?&quot; It then explains that she and her husband found this while researching for friends with the same last name, and offers a one-page report on the name.</p><p data-say data-t="424.29">Every move is personal. The reader&#x27;s surname is the hook. The story makes the offer feel like a favour among friends. And the product is modest and specific, a one-page report, so the ask is small.</p><p data-say data-t="439.03">We could not verify a legitimately public full copy of this letter, so it is linked through Halbert&#x27;s own newsletter issues, where he quotes and discusses it.</p><aside class="co co-example" data-t="449.88"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Personal as the hook, today.</div><p data-say>Dynamic creative and product feeds can show the right product to the right person, but personal also means specific to the reader&#x27;s situation: &quot;If you live in a flat with no lift, this is for you.&quot; In a cold email, the brand&#x27;s own product, reviews and ads are the surname. Use them in line one.</p></aside><aside class="co co-agency" data-t="471.28"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write the first line of your next cold email so it could only have been sent to that one company: their product, their review, their ad. If the line would work for any brand, rewrite it. That&#x27;s the coat-of-arms principle.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 11.5<button class="ts" data-t="486.74" title="Play the audio from here">▶ 8:07</button><label class="readchk"><input type="checkbox" data-k="11-5"> Mark as done</label></div><h2 data-t="486.74"><span class="num">11.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>&quot;How To Burn Off Body Fat Hour-By-Hour!&quot;: news style, mechanism and a risk-free close.</span></h2></header><p data-say data-t="494.78">This ad ran in newspapers in the late 1970s and around 1980. A public archive shows it in The Oklahoma Daily on 20 March 1979, page fourteen. The Swiped archive says Halbert highly recommended it as an example of selling big, immediate results.</p><p data-say data-t="514.55">The structure is worth studying. The headline promises a fast, specific result. The subhead adds a doctor&#x27;s &quot;new discovery&quot; and a dramatic comparison with running ninety-eight miles a week. The body opens like a news story with a dateline from San Diego, which makes it read like an article. It lists specific expected losses in inches, explains a mechanism in plain words, and stacks testimony and authority.</p><p data-say data-t="542.56">The close is the strongest part. You can post-date your check by thirty days, and the company promises not to deposit it, then return it if you send the container back. The line &quot;You can&#x27;t lose money, you can only lose weight&quot; sums up the risk reversal.</p><p data-say data-t="559.55">Now the warning. The claims in this ad, rapid weight loss figures and miracle language, would be rejected by Meta and could break consumer protection law in the EU today. Study the structure only.</p><aside class="co co-example" data-t="573.11"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Safe version of the moves.</div><p data-say>News style: a creator explains &quot;what I found after testing three carbonators&quot; in a reporting tone. Mechanism: &quot;no motor, just a lever and gas.&quot; Specifics: up to sixty litres per cylinder. Risk reversal: the brand&#x27;s real return policy and warranty, stated clearly.</p></aside><aside class="co co-agency" data-t="596.58"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Find your client&#x27;s real risk reversal: return window, warranty, guarantee. Write it in one plain, memorable line, like &quot;you can&#x27;t lose money&quot; but true. Put it next to the call to action.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 11.6<button class="ts" data-t="610.89" title="Play the audio from here">▶ 10:11</button><label class="readchk"><input type="checkbox" data-k="11-6"> Mark as done</label></div><h2 data-t="610.89"><span class="num">11.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>The Admiral Byrd letter: price first, and danger as a benefit.</span></h2></header><p data-say data-t="617.51">In the mid 1960s, Dick Benson&#x27;s agency was asked to sell places on a round-the-world flight over both poles for the Admiral Richard E. Byrd Polar Center. The price was ten thousand dollars a person, with a two-and-a-half-thousand-dollar deposit. The total promotion budget was five thousand dollars, with no money for testing or brochures. The letter was written by Hank Burnett, Benson&#x27;s creative chief, and signed by Edward C. Bursk of the Harvard Business Review. It runs about forty-eight hundred words over seven typed pages.</p><p data-say data-t="652.02">The opening breaks a rule. Right at the top, it states the price and warns that the reader will endure some discomfort and may even face some danger. For the right reader, a wealthy adventurer on a carefully researched list, that is flattering. This trip is not for everyone.</p><p data-say data-t="670.74">The letter then piles on exclusivity: founding trusteeship, a bronze tablet, receptions and meetings with world figures, and joining the very small group who have crossed the South Pole. According to Benson&#x27;s account, the trip sold out, seventy-two people went after the plane was reconfigured, and the mailing stayed within budget.</p><p data-say data-t="693.20">The lesson: the right list and a letter that respects the reader&#x27;s intelligence can sell almost anything.</p><aside class="co co-example" data-t="700.48"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The moves for today.</div><p data-say>Price first, to select: &quot;This costs 2,450 kronor. Here&#x27;s why owners say it&#x27;s worth it.&quot; Honest drawback as a filter: &quot;It&#x27;s not the cheapest carbonator. It&#x27;s the one made to last ten thousand cycles.&quot; Exclusivity only when true, such as a limited colour.</p></aside><aside class="co co-agency" data-t="723.06"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write one hook that leads with your client&#x27;s price or main drawback and turns it into a reason to buy for the right person. Test it against the usual hook. In cold emails, being honest about what you are not, such as &quot;I&#x27;m new, so I work on spec first,&quot; can be a strength.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 11.7<button class="ts" data-t="742.21" title="Play the audio from here">▶ 12:22</button><label class="readchk"><input type="checkbox" data-k="11-7"> Mark as done</label></div><h2 data-t="742.21"><span class="num">11.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>&quot;The Lazy Man&#x27;s Way To Riches&quot;: the confession hook and the uncashed check.</span></h2></header><p data-say data-t="749.43">Joe Karbo&#x27;s ad ran from the early 1970s. A copy appears on page seventy-five of Scouting magazine from October 1974, in a public archive. The subhead reads: &quot;Most People Are Too Busy Earning a Living to Make Any Money.&quot;</p><p data-say data-t="768.10">The opening is a confession. Karbo says he used to work hard, with eighteen-hour days, and didn&#x27;t make big money until he did less. Then he admits the economics openly: he asks for ten dollars for material that costs him far less, and says why you shouldn&#x27;t care. That honesty disarms the reader.</p><p data-say data-t="787.66">The proof is personal and concrete: his home, his office on the beach, his boats. Then a famous rhythm of objection handling, a series of lines saying it doesn&#x27;t require education, luck, talent or experience. And the guarantee: he won&#x27;t cash your check for thirty-one days, and if you don&#x27;t think the material is worth at least a hundred times what you paid, you get the uncashed check back.</p><p data-say data-t="814.69">Again, a warning. Income claims like these are heavily restricted on Meta and in consumer law today. Study the confession, the rhythm and the risk reversal, not the promise of riches.</p><aside class="co co-example" data-t="828.37"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The moves for today.</div><p data-say>Confession hook: &quot;I used to think home carbonators were a gimmick.&quot; Honest economics: &quot;Yes, the starter kit costs more than a few packs of bottles. Here&#x27;s the maths after a year, using your own numbers.&quot; Objection rhythm: &quot;You don&#x27;t need a socket. You don&#x27;t need batteries. You don&#x27;t need space for a big machine.&quot;</p></aside><aside class="co co-agency" data-t="850.28"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write a three-line objection rhythm for your client: &quot;You don&#x27;t need X. You don&#x27;t need Y. You don&#x27;t need Z.&quot; Use the real top objections from reviews. It works as the body of a fifteen-second script and as a strong paragraph in a cold email.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 11.8<button class="ts" data-t="868.45" title="Play the audio from here">▶ 14:28</button><label class="readchk"><input type="checkbox" data-k="11-8"> Mark as done</label></div><h2 data-t="868.45"><span class="num">11.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Putting the six moves together in one modern ad.</span></h2></header><p data-say data-t="873.34">Now combine them. Here is how a single fifteen- to thirty-second creator ad for a carbonator could borrow one move from each classic, with every claim true and policy-safe.</p><p data-say data-t="885.89">Open with Karbo&#x27;s confession: &quot;I used to think home carbonators were a gimmick.&quot; Add Sackheim&#x27;s list: &quot;Then I noticed these three things.&quot; Use Engel&#x27;s teaching for the three things: how the lever and gas work, how much one cylinder makes, what the warranty covers. Use the coat-of-arms principle by making it specific to one kind of reader: &quot;especially if you live up four flights of stairs.&quot;</p><p data-say data-t="911.67">Borrow Byrd&#x27;s honesty about price: &quot;It&#x27;s not the cheapest. It&#x27;s built for ten thousand cycles.&quot; And close with the body-fat ad&#x27;s structure of risk reversal, using only the brand&#x27;s real terms: &quot;Register it, and it&#x27;s covered for three years.&quot;</p><p data-say data-t="928.73">None of those moves is new. That&#x27;s the point. The great ads were built from a small set of moves that still work, because people haven&#x27;t changed. What changes is the medium, the rules and the product.</p><p data-say data-t="942.17">When you copy ads by hand for a few months, you start to see these moves everywhere, in Reels, in emails, on landing pages. That&#x27;s when you know the hands-on method is working.</p><aside class="co co-example" data-t="954.34"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The finished script.</div><p data-say>&quot;I used to think home carbonators were a gimmick. Then I noticed these three things. One: no plug, just a lever and gas. Two: one cylinder makes up to sixty litres. Three: register it and it&#x27;s covered for three years. It&#x27;s not the cheapest. It&#x27;s built for ten thousand cycles. Link&#x27;s below.&quot;</p></aside><aside class="co co-agency" data-t="977.33"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write your own six-move script for a brand you like, then cut it to fifteen seconds. Label each line with the classic it borrows from. That labelled script is a strong portfolio piece, because it shows you know where your craft comes from.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="994.04">That&#x27;s the end of Module 11. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Teardown: headline&#x27;s job, hook, central idea, proof, close and risk reversal.</li><li>Copy slowly, then write: steal, wouldn&#x27;t work today, modern hook.</li><li>Sackheim: question plus &quot;these&quot;, demonstration, free offer, fear answered.</li><li>Engel: teach the nervous buyer; trust sells.</li><li>Coat of arms: the reader&#x27;s own name, or situation, as the hook.</li><li>Body fat: news style, mechanism, risk-free close. Never the claims.</li><li>Byrd: price and danger first, to select the right reader.</li><li>Karbo: confession, honest economics, objection rhythm, uncashed check.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 9 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="11"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 8 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://www.1000headlines.com/h/do-you-make-these-mistakes-in-english" target="_blank" rel="noopener">&quot;Do You Make These Mistakes in English?&quot; (1000 Headlines: 1919, Ruthrauff &amp; Ryan, Schwab&#x27;s comparison)</a></li><li><a href="https://swiped.co/file/do-you-make-these-mistakes-by-max-sackheim/" target="_blank" rel="noopener">Sackheim ad, scan and notes (Swiped)</a></li><li><a href="https://swiped.co/file/about-this-stock-bond-louis-engel/" target="_blank" rel="noopener">Engel&#x27;s stock and bond ad, scans and notes (Swiped)</a></li><li><a href="https://boomerandecho.com/everybody-know-stock-bond-business/" target="_blank" rel="noopener">Engel ad background (Boomer and Echo)</a></li><li><a href="https://thegaryhalbertletter.com/newsletters/zakk_grabbers.htm" target="_blank" rel="noopener">Coat-of-arms letter: Halbert&#x27;s claims (&quot;Grabbers&quot; issue)</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zszs_aida.htm" target="_blank" rel="noopener">Coat-of-arms letter opening, quoted by Halbert (&quot;AIDA&quot; issue)</a></li><li><a href="https://gateway.okhistory.org/ark:/67531/metadc1830121/m1/14/" target="_blank" rel="noopener">Body-fat ad in The Oklahoma Daily, 20 March 1979, p. 14 (Gateway to Oklahoma History)</a></li><li><a href="https://swiped.co/file/body-fat-hour-by-hour-halbert/" target="_blank" rel="noopener">Body-fat ad notes (Swiped)</a></li><li><a href="https://dennyhatch.blogspot.com/2019/07/63-most-astounding-sales-letter-you.html" target="_blank" rel="noopener">Admiral Byrd letter, full text and Benson&#x27;s account (Denny Hatch)</a></li><li><a href="https://texashistory.unt.edu/ark:/67531/metapth353587/m1/75/" target="_blank" rel="noopener">Karbo ad in Scouting, October 1974, p. 75 (Portal to Texas History)</a></li><li><a href="https://www.reversecopy.com/library/lazy-mans-way-to-riches-ad-by-joe-karbo" target="_blank" rel="noopener">Karbo ad transcription (ReverseCopy)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m10"><small>← Previous</small>Module 10: Modern Performance Creative</a><a class="nx" href="#m12"><small>Next →</small>Module 12: The Halbert Method Workbook</a></nav></article></main></template>

a": "115 nugget notes before writing", "b": "Start writing from the brand's tagline", "ok": "A", "e": "The Suck: research until the selling idea falls out."}, {"a": "\"Clients care about what my copy is designed to sell.\"", "b": "\"Here are my seven awards.\"", "ok": "A", "e": "Legends talk numbers, not awards."}]}]}, {"n": 5, "lab": "Module 5", "short": "M5", "title": "The Boron Letters", "sections": 10, "cards": [{"q": "The first lesson isn't about copy: look after the machine.", "a": "Block your first hour tomorrow: a walk, then your hardest writing task, such as the nugget notes or the fast draft. Notice the opening of the letter too: next time you write a cold email, try starting with one small true story instead of a statement."}, {"q": "Find the starving crowd before you write a word.", "a": "Before any brief, write one sentence: who already spends money on this problem, every week, without being asked? Write the hook for them. In cold emails, the starving crowd is brands that are clearly spending on Meta right now: check the Ad Library for many active ads."}, {"q": "Be a student of markets: watch what people buy, not what they say.", "a": "Read fifty reviews for your client before writing. Copy every phrase that appears more than twice into your nugget notes. In the Ad Library, note which competitor ads have been active longest; that is the market voting with money."}, {"q": "Recent, frequent and the right price: the best prospects.", "a": "When you write ad concepts, label each one with the audience it serves: new prospect, recent buyer, frequent buyer. Write the offer to fit. In a cold email, mention that you think this way; DTC teams respect copywriters who understand retention."}, {"q": "Get into the A-pile.", "a": "Make every cold email look like a note from one person to one person. No templates, no images, no tracking-pixel newsletters. For video briefs, ask for one concept that looks like a friend's story, filmed on a phone in a real home."}, {"q": "First impressions: give the reader's eyes a rest.", "a": "Format every primary text with short lines and a blank line between ideas. Put captions on every video. Look at your landing page on a phone and break up anything longer than four lines."}, {"q": "Attention, interest, desire, action: and the nugget notes behind it.", "a": "Write one fifteen-second script in AIDA: one line per letter. Then check: does each line come from a real nugget note? If a line has no fact behind it, go back to the notes."}, {"q": "Copy the great ads. Use small words and short sentences.", "a": "Run your copy through one test: could a twelve-year-old read it aloud without stumbling? Replace every word over three syllables that has a shorter version. Split any sentence over twenty words."}, {"q": "Make a proposition, and give the reason why.", "a": "For every offer in a brief, write the reason why in one sentence. If there is no real reason, don't invent one; make the offer plainer instead. For every big claim, add \"because\" and a fact."}, {"q": "Find the market first, then make it believable with specifics.", "a": "Before you hand in any ad, circle every claim. Next to each one, write the specific fact that backs it and where it comes from. If you can't, cut or soften the claim. This habit makes you safe to hire."}], "quiz": [{"q": "Halbert offers you one advantage for a hamburger stand. Which does he pick, and why does it matter for your Meta ads?", "o": ["A starving crowd: aim the creative at people who already want and spend on the product.", "The best meat: product quality sells itself.", "The lowest price: always undercut competitors.", "The best location: placement beats everything."], "a": 0, "e": "The market matters more than the copy. Write for people who are already hungry."}, {"q": "A brand survey says customers buy for sustainability; reviews mostly mention not carrying heavy bags. What does Halbert's \"student of markets\" lesson suggest?", "o": ["Test the reviews' reason first, because it comes from what people paid for.", "Trust the survey, because it was formal research.", "Ignore both and use your own opinion.", "Put both in one long headline."], "a": 0, "e": "Believe what people buy and say after buying, over what they say in surveys."}, {"q": "You have three audiences. Who are the best prospects for a refill offer, by recency, frequency and unit of sale?", "o": ["People who bought a carbonator in the last two months and buy flavours often.", "People who visited the site once two years ago.", "Everyone in Sweden aged 18 to 65.", "People who follow a competitor on Instagram."], "a": 0, "e": "Recent, frequent buyers who already spend in the category are the best prospects."}, {"q": "Which cold email is most likely to land in the A-pile?", "o": ["Plain text from your real name, subject \"your Carbonator reviews\", three short lines.", "An HTML newsletter with a logo and \"Partnership opportunity\".", "A PDF brochure attached with no message.", "A mass email sent to 500 brands with the same text."], "a": 0, "e": "The A-pile looks personal. Designed promotional mail goes to the B-pile."}, {"q": "Your primary text is one dense paragraph and nobody reads to the end. What is the Boron fix?", "o": ["Break it into short lines with white space, so it looks easy to read.", "Make it longer to show expertise.", "Add more emojis inside the paragraph.", "Move it into the image as small text."], "a": 0, "e": "Eye relief: copy that looks easy gets read."}, {"q": "You write an AIDA script, but the desire line is vague. What does Halbert say is missing?", "o": ["Nugget notes: specific facts about the product to fill interest and desire.", "A stronger formula than AIDA.", "A louder voiceover.", "More exclamation marks."], "a": 0, "e": "The formula is a skeleton. Without notes it has nothing to say."}, {"q": "Which rewrite follows Halbert's \"small words, short sentences\" rule?", "o": ["\"Use it to make bubbles.\"", "\"Utilise our innovative carbonation technology.\"", "\"Leverage best-in-class hydration solutions.\"", "\"Experience the paradigm of fizz.\""], "a": 0, "e": "Simple words cost the reader no effort."}, {"q": "A client offers 20% off for no stated reason, and response is weak. What would Halbert add?", "o": ["The true reason why, such as clearing last season's colours, so the deal is believable.", "A bigger discount with no explanation.", "A fake countdown timer.", "Nothing; discounts sell themselves."], "a": 0, "e": "Reason-why copy turns a suspicious deal into a believable one. Never invent the reason."}, {"q": "Which line is most believable under Halbert's specifics rule?", "o": ["\"Up to 60 litres per cylinder, tested for 10,000 cycles.\"", "\"The most incredible carbonator ever!!!\"", "\"Life-changing fizz.\"", "\"Unbeatable quality.\""], "a": 0, "e": "Specific, checkable details sound true; superlatives sound like hype."}], "drills": [{"type": "sort", "title": "A-pile or B-pile?", "prompt": ["Halbert's A-pile looks personal; the B-pile looks like advertising. Sort these."], "checks": [], "model": ["The A-pile isn't about hiding that you sell. It's about looking like one person talking to another, so you get read first."], "items": ["A plain-text email from a real person's name with a specific subject => A-pile", "A creator filming in her own kitchen on a phone => A-pile", "A glossy studio commercial with a jingle => B-pile", "An HTML newsletter with \"Partnership opportunity\" => B-pile", "A short note: \"saw your new ads, one idea\" => A-pile", "A banner with \"BUY NOW 50% OFF\" in flashing text => B-pile"], "cats": ["A-pile", "B-pile"], "pairs": []}, {"type": "write", "title": "Offer plus reason why", "prompt": ["Write an offer for a DTC product with a true-sounding reason why. Use \"because\" and a specific, and avoid fake urgency words."], "checks": [{"kind": "include", "arg": "because,since,so", "label": "Gives a reason (because, since, so)"}, {"kind": "number", "arg": "", "label": "Has a specific number"}, {"kind": "avoid", "arg": "hurry,last chance,act fast,!!!", "label": "No fake-urgency words"}, {"kind": "maxwords", "arg": "35", "label": "35 words or fewer"}], "model": ["\"We're clearing last season's three colours, so the starter kit in those colours is 20% off until they're gone.\" (Only if this is true for the brand.)"], "items": ["Offer with reason why"], "cats": [], "pairs": []}, {"type": "pick", "title": "Starving crowd or not?", "prompt": [], "checks": [], "model": [], "items": [], "cats": [], "pairs": [{"a": "People who buy sparkling water every week", "b": "People interested in kitchen design", "ok": "A", "e": "The first group already spends money on the problem."}, {"a": "Last month's buyers for a refill offer", "b": "Last year's site visitors for a refill offer", "ok": "A", "e": "Recency: recent buyers respond best."}, {"a": "Reviews' most repeated phrase", "b": "A brainstorm in a meeting room", "ok": "A", "e": "Be a student of markets: listen to buyers."}, {"a": "Brands with many active ads in the Ad Library", "b": "Brands with no active ads", "ok": "A", "e": "For cold email, the starving crowd is brands already spending."}]}]}, {"n": 6, "lab": "Module 6", "short": "M6", "title": "Breakthrough Advertising", "sections": 10, "cards": [{"q": "You cannot create desire. You can only channel it.", "a": "Before writing, list three desires your buyer already has, in their own words, from reviews and comments. Pick one. Your hook connects the product to that desire. If you catch yourself trying to convince people to want something, stop and find a different desire."}, {"q": "Read the market's awareness before you write the headline.", "a": "Label every ad concept with an awareness level. For cold audiences, test problem-aware and unaware hooks. For retargeting, test most-aware offers. Never show an unaware audience an ad that starts with your brand name."}, {"q": "For unaware buyers, start with them, not the product.", "a": "For your cold-audience concepts, write openings that name a moment, not a product. Use a creator's voice telling a short story. Hold the product reveal until after the reader has recognised themselves."}, {"q": "Read the market's sophistication: what has it already heard?", "a": "Look at your client's competitors in the Ad Library. List the main claims they make. If everyone makes the same claim, you are past stage two. Move to a mechanism or to identification."}, {"q": "Mechanism: explain how it works, and make the claim new again.", "a": "Ask your client: what does the product do differently, physically, and why does that produce the result? Turn the answer into one sentence starting \"It works because...\". Test it as a hook against your best claim."}, {"q": "Intensification: make the desire vivid.", "a": "For your lead benefit, write three lines of sensory detail: what the buyer sees, hears and feels. Use them as shot directions in a creator brief. Make sure every detail is true for the product."}, {"q": "Identification: sell the role, not just the result.", "a": "Read your client's reviews and write down the identity buyers describe: \"as someone who cooks a lot\", \"as a mum of three\". Write one hook that speaks only to that identity. Test it in the late-stage, exhausted parts of the market."}, {"q": "Gradualization and redefinition: build belief step by step, reframe the objection.", "a": "List the top objection from your client's reviews. Write one redefinition that changes the comparison. Then write a five-line gradualization script: four statements the buyer already agrees with, then your claim."}, {"q": "Camouflage and concentration: borrow a trusted format, and use the competitors' weakness.", "a": "Brief one concept in the native style of Reels: a creator, a real kitchen, an honest drawback. Make the comparison about the alternative category, never a named competitor. Check that paid partnerships are disclosed."}, {"q": "Worked example: one brief, three audiences, three different ads.", "a": "For one brand you want to work with, draw this three-row map with one hook per row. It fits on a single page and shows a hiring manager you think in audiences and stages, not just in nice lines."}], "quiz": [{"q": "A client asks you to write an ad that makes people want sparkling water for the first time. What would Schwartz say?", "o": ["Copy can't create desire; find people who already want it and channel that want to the product.", "Use stronger adjectives until people want it.", "Run the ad more often.", "Use a celebrity to create the desire."], "a": 0, "e": "Schwartz: copy channels existing mass desire. It does not create it."}, {"q": "You're writing for a broad cold audience who have never heard of the brand. Which hook fits?", "o": ["\"Tired of carrying heavy bags of bottles home?\"", "\"Carbonator 3 starter kit, free shipping today.\"", "\"The Aarke you know, now in a new colour.\"", "\"Owners keep their Carbonator for years.\""], "a": 0, "e": "Cold, product-unaware audiences need a problem-aware or unaware opening, not the brand name."}, {"q": "Your retargeting audience visited the product page twice. Which hook fits their awareness?", "o": ["\"Carbonator 3 starter kit: 3-year warranty when registered. Order today.\"", "\"Have you ever thought about your water?\"", "\"A story about bubbles.\"", "\"Why is everyone talking about kitchens?\""], "a": 0, "e": "Most aware or product aware: lead with the product and the offer."}, {"q": "Every competitor's ad says \"Sparkling water at home in seconds.\" Which move does market sophistication suggest?", "o": ["Introduce a real mechanism, e.g. \"no electronics, so there's nothing to charge or break.\"", "Say \"in even fewer seconds.\"", "Repeat the same claim louder.", "Stop advertising."], "a": 0, "e": "Past stage two, bigger claims stop working. A new mechanism makes the promise fresh."}, {"q": "Which line is a mechanism, not a claim?", "o": ["\"It works with a mechanical lever and a gas cylinder, so there's no motor or battery.\"", "\"The best carbonator ever made.\"", "\"Amazing fizz.\"", "\"Loved by everyone.\""], "a": 0, "e": "A mechanism explains how the result is produced, which makes the claim believable."}, {"q": "You want to intensify \"sparkling water at home\" for a video. Which brief line does it?", "o": ["Close-up: press the lever, hear the hiss, bubbles rise, pour over ice.", "Show the logo for five seconds.", "Text: \"Premium quality.\"", "A stock photo of a happy family."], "a": 0, "e": "Intensification makes the desire vivid with true sensory detail."}, {"q": "The market has heard every claim. Which hook uses identification?", "o": ["\"For people who notice the details in their kitchen.\"", "\"Now 10% faster.\"", "\"Make sparkling water at home.\"", "\"Buy now.\""], "a": 0, "e": "At late sophistication, buyers respond to \"this is for people like you.\""}, {"q": "The top objection is price. Which is a safe redefinition?", "o": ["Compare the cost against the buyer's yearly spend on bottled sparkling water, using real prices.", "Claim it saves 10,000 kronor a year without checking.", "Hide the price.", "Say \"price doesn't matter.\""], "a": 0, "e": "Redefinition reframes the comparison, but every number must be real."}, {"q": "A UGC-style ad borrows the native look of Reels. What keeps camouflage honest?", "o": ["A real creator opinion and a clear paid-partnership disclosure.", "Pretending it isn't an ad.", "Fake reviews from made-up customers.", "Removing the brand name entirely."], "a": 0, "e": "Native style is fine; deception isn't. Disclose branded content."}, {"q": "Which comparison follows Schwartz's concentration and Hopkins' warning together?", "o": ["\"No plug needed, unlike electric machines.\"", "\"Brand X is junk.\"", "\"Our competitors lie to you.\"", "\"Don't buy Brand Y.\""], "a": 0, "e": "Point at the weakness of the alternative category, not a named competitor."}], "drills": [{"type": "sort", "title": "Name the awareness level", "prompt": ["Pick the awareness level each headline is written for."], "checks": [], "model": ["The less aware the reader, the later the product name appears."], "items": ["Carbonator 3 starter kit, free shipping today. => Most aware", "Why owners keep their Carbonator for years. => Product aware", "Make sparkling water at home with no plug. => Solution aware", "Tired of carrying heavy bags of bottles home? => Problem aware", "How much does your family spend on bottled bubbles a year? => Unaware"], "cats": ["Most aware", "Product aware", "Solution aware", "Problem aware", "Unaware"], "pairs": []}, {"type": "order", "title": "Sophistication stages", "prompt": ["Put these carbonator headlines in the order a market would need them, from first to most exhausted."], "checks": [], "model": ["Direct claim → enlarged claim → mechanism → elaborated mechanism → identification."], "items": ["Make sparkling water at home.", "Make sparkling water at home in seconds.", "No electronics, so there's nothing to charge or break.", "Tested through more than 10,000 carbonation cycles.", "For people who care how their kitchen looks."], "cats": [], "pairs": []}, {"type": "write", "title": "One product, five awareness levels", "prompt": ["Write one hook for each awareness level for a DTC product of your choice (or Aarke). Use only true facts."], "checks": [{"kind": "maxwords", "arg": "16", "label": "16 words or fewer"}, {"kind": "avoid", "arg": "", "label": "No vague words (premium, best, elevate...)"}], "model": ["Most aware: \"Carbonator 3 starter kit, with a 3-year warranty when registered.\"", "Product aware: \"Tested through more than 10,000 cycles. Here's what that means at home.\"", "Solution aware: \"Sparkling water from your tap, with no plug.\"", "Problem aware: \"Still carrying sparkling water home every week?\"", "Unaware: \"What's the heaviest thing you carry home from the shop every week?\""], "items": ["Most aware", "Product aware", "Solution aware", "Problem aware", "Unaware"], "cats": [], "pairs": []}]}, {"n": 7, "lab": "Module 7", "short": "M7", "title": "The Adweek Copywriting Handbook", "sections": 10, "cards": [{"q": "Everything in the ad exists to get the first sentence read.", "a": "For your next ad, write the first line before you choose the visual. Then pick the visual that makes that line impossible not to read. In email, the subject line's only job is to get the first sentence read."}, {"q": "The first sentence sells the second: build a slippery slide.", "a": "Make your first sentence seven words or fewer. Read your script aloud and mark every place where your own attention dips. Rewrite those lines so each one makes the next one necessary."}, {"q": "Create a buying environment, and get the reader nodding.", "a": "Open your next script with two or three true statements your buyer will agree with, taken from reviews. Then introduce the product. In a cold email, start with something true about their business they will agree with, not with yourself."}, {"q": "Keep them reading with curiosity, but aim it at buyers.", "a": "Add one open loop to the first five seconds of your script, about the benefit, and close it before the call to action. In emails, a subject like \"one thing in your reviews\" works only if the email actually delivers that one thing."}, {"q": "Sell the concept, not the product.", "a": "Write your client's product as an object in one line, then as a concept in one line. Test the concept line as the hook. Use the object details as proof in the body."}, {"q": "Answer every question in the order they ask it.", "a": "Write down the ten questions a buyer asks before paying, from the comments on your client's ads. Order them as a buyer would ask. Check that your landing page or carousel answers all ten, in that order."}, {"q": "Sell the cure, not the prevention.", "a": "Find the present pain your client's product relieves and make it the lead. Move \"long-term benefits\" to supporting lines. In health and wellness, keep claims within Meta's policies: relief from a hassle, not promises about the body."}, {"q": "Make it personal, and tell a story.", "a": "Write your next UGC brief as a four-beat story: situation, doubt, turn, result. Ask the creator to tell it in their own words. Keep every claim in the story true."}, {"q": "Don't assume limits that aren't there: test the strange idea.", "a": "List three \"rules\" your client's ads follow. Ask which ones are real constraints, such as brand guidelines or Meta policy, and which are habits. Propose one controlled test that breaks a habit. That kind of thinking is exactly what performance agencies hire for."}, {"q": "Incubate, then edit to the fewest words.", "a": "Write today, edit tomorrow. In the edit, cut your draft by a third. Read it aloud. If it still makes the sale, the cut words weren't doing anything."}], "quiz": [{"q": "You have a stunning product image with no caption leading into the copy. What does Sugarman's axiom say?", "o": ["It fails its main job unless it gets the reader to read the first sentence.", "It's perfect, because attention is the goal.", "Add a second image.", "Remove all copy so the image speaks."], "a": 0, "e": "Every element exists to get the first sentence read."}, {"q": "Which first sentence best starts a slippery slide?", "o": ["\"I was wrong about sparkling water.\"", "\"Aarke, founded in Sweden, designs carbonators with care for every detail in your kitchen.\"", "\"Welcome to our brand.\"", "\"Please read this ad.\""], "a": 0, "e": "Short, curious, and it demands the second sentence."}, {"q": "Which opening builds Sugarman's \"yes\" momentum for a cold email?", "o": ["\"Your ads lean on design, and your reviews keep praising how easy it is to use.\"", "\"Hi, I'm Oskar and I'm a copywriter.\"", "\"Do you want more sales?\"", "\"I hope this finds you well.\""], "a": 0, "e": "True statements about them that they agree with, before any ask."}, {"q": "Your hook opens a loop about something unrelated to the product. What is the risk?", "o": ["It attracts curious people, not buyers, and may feel like a cheat.", "None; curiosity always works.", "It will be too short.", "It will be rejected by Meta automatically."], "a": 0, "e": "Aim curiosity at the benefit and close the loop honestly."}, {"q": "Which line sells a concept, not an object?", "o": ["\"Your tap, with bubbles.\"", "\"Steel carbonator with a lever.\"", "\"Model number 3.\"", "\"Includes a gas cylinder.\""], "a": 0, "e": "The concept is what the object means for the buyer."}, {"q": "Comments on your ad keep asking \"does it need electricity?\". What does Sugarman's flow axiom suggest?", "o": ["Answer that question in the ad or page at the point where buyers ask it.", "Ignore it; people can read the specs.", "Delete the comments.", "Make the ad shorter."], "a": 0, "e": "Anticipate and answer questions in the order the buyer asks them."}, {"q": "Which hook sells a cure instead of a prevention?", "o": ["\"No more heavy bags of bottles this weekend.\"", "\"Reduce your lifetime plastic footprint.\"", "\"Avoid future kitchen clutter.\"", "\"Prevent waste for future generations.\""], "a": 0, "e": "People pay to fix a pain they feel now."}, {"q": "A creator script describes the product but has no turn. What's missing for a Sugarman story?", "o": ["A doubt or problem that turns into a result.", "More product specs.", "A longer intro about the brand.", "A discount code."], "a": 0, "e": "Situation, doubt, turn, result. Without the turn it's a description."}, {"q": "Your first draft is 120 words for a 15-second ad. What is Sugarman's editing rule?", "o": ["Cut to the fewest words that still make the sale, in a separate editing session.", "Speed up the voiceover.", "Keep it; long copy always wins.", "Remove the call to action."], "a": 0, "e": "Editing is expressing what you want with the fewest words."}], "drills": [{"type": "order", "title": "Build a slippery slide", "prompt": ["Order these lines into a script where each line makes the next one necessary."], "checks": [], "model": ["Short hook → the old belief → the turn → the mechanism and proof → the result → the action."], "items": ["I was wrong about sparkling water.", "I thought making it at home meant a noisy machine and a plug.", "Then a friend showed me one with neither.", "A lever, a gas cylinder, and up to 60 litres per cylinder.", "Two months later, I haven't carried a single bottle home.", "Link's below if you want the starter kit."], "cats": [], "pairs": []}, {"type": "write", "title": "Object to concept, prevention to cure", "prompt": ["For a DTC product of your choice (or Aarke), write the concept line and the cure line."], "checks": [{"kind": "maxwords", "arg": "12", "label": "12 words or fewer"}, {"kind": "avoid", "arg": "prevent,future,someday,premium,best", "label": "Avoids prevention words and vague words"}], "model": ["Concept: \"Your tap, with bubbles.\"", "Cure: \"No more heavy bags of bottles this weekend.\""], "items": ["Concept line (what it means, not what it is)", "Cure line (a pain the buyer feels now)"], "cats": [], "pairs": []}, {"type": "pick", "title": "Sugarman would choose...", "prompt": [], "checks": [], "model": [], "items": [], "cats": [], "pairs": [{"a": "\"I was wrong about sparkling water.\"", "b": "\"Aarke is a Swedish brand founded with a passion for design.\"", "ok": "A", "e": "Short, curious first sentence."}, {"a": "\"No more heavy bags this weekend.\"", "b": "\"Reduce future plastic waste.\"", "ok": "A", "e": "Cure beats prevention."}, {"a": "A product spin with no words", "b": "A shot that leads straight into the first caption", "ok": "B", "e": "Every element exists to get the first sentence read."}, {"a": "\"Your tap, with bubbles.\"", "b": "\"Steel carbonator, model 3.\"", "ok": "A", "e": "Sell the concept."}]}]}, {"n": 8, "lab": "Module 8", "short": "M8", "title": "Ogilvy on Advertising", "sections": 9, "cards": [{"q": "Decide the positioning before you write a word.", "a": "Before you write for a client, write three possible positions, each in one line, with the mindset of the buyer it attracts. Ask which one matches the reviews and the business goal. Test the top two as separate concepts if the client isn't sure."}, {"q": "Make a large promise, and build it on a big idea.", "a": "Write your client's promise as one benefit sentence. Then write one big idea that could produce at least ten different ads. If you can only imagine one ad, the idea isn't big enough yet."}, {"q": "Don't be a bore, and don't chase awards.", "a": "Watch your draft video with the sound off. Is the product visible and doing something in most shots? If not, rewrite so the product is the hero. When you present work, say what each concept is designed to sell, not that it's creative."}, {"q": "Problem, solution, proof. And don't cheat.", "a": "Structure your next script as problem, solution, proof. Make the proof a single, uncut demonstration shot if you can. Never exaggerate the problem or fake the result; it breaks trust and Meta's policies."}, {"q": "Video rules that still work: grab early, show, and speak on camera.", "a": "In your next creator brief, require three things: a strong first second, the creator speaking on camera, and at least one shot where the product is demonstrated with no words needed. Avoid influencer picks whose audience has nothing to do with the product."}, {"q": "The headline: sell in it, say the benefit, and flag the buyer.", "a": "Check your first line: if it were the only thing seen, would the viewer know the brand and the benefit? If not, add them. Search product reviews and press for a line like the Rolls-Royce one, a specific detail an expert noticed."}, {"q": "Long copy, captions and pictures with a story.", "a": "Go through your client's product page or carousel and give every image a caption with a benefit. Add one photo that makes people ask what's happening. Add a before-and-after if the product allows an honest one."}, {"q": "Go the whole hog on one promise, and give it a first-class ticket.", "a": "Cut your next brief down to one promise per concept. Turn the other benefits into separate concepts to test. And add a short quality line to every creator brief: clean set, natural light, steady shot, clear sound."}, {"q": "Repeat your winners, and fix the near-misses.", "a": "For the next ad that almost works, try three re-edits before a new shoot: new first second, shorter cut, new caption hook. Log what changed. In a cold email, offering to re-edit a brand's existing footage is a cheap, attractive first project."}], "quiz": [{"q": "A client can't decide whether their carbonator is a design object or a money saver. What does Ogilvy say about this decision?", "o": ["It's the most important decision; settle the positioning before writing any ads.", "It doesn't matter; good copy fixes positioning.", "Use both in every ad.", "Let the designer decide."], "a": 0, "e": "Ogilvy: results depend less on how you write than on how the product is positioned."}, {"q": "Which is a promise in Ogilvy's sense, not a slogan?", "o": ["Never carry sparkling water home again.", "Fizz your life.", "Think bubbles.", "The icon."], "a": 0, "e": "A promise is a benefit for the consumer, and the product must deliver it."}, {"q": "Your concept can only become one ad. What does Ogilvy's \"big idea\" suggest?", "o": ["Find a simpler, bigger idea that can carry dozens of variations for years.", "One great ad is enough.", "Add more scenes to the one ad.", "Buy more media for it."], "a": 0, "e": "A big idea can be continued for years, like Hathaway's eye patch."}, {"q": "A beautiful brand film shows the product for one second at the end. Which Ogilvy rule does it break?", "o": ["Make the product the hero.", "Use long copy.", "Localize headlines.", "Use photographs, not drawings."], "a": 0, "e": "Successful advertising sells without drawing attention to itself; the product is the hero."}, {"q": "You plan a problem-solution video. What is Ogilvy's condition?", "o": ["Only if you can do it without cheating: real problem, real solution, honest proof.", "Exaggerate the problem so the solution looks better.", "Fake the demo if the real one is slow.", "Skip the proof to keep it short."], "a": 0, "e": "Problem-solution sells, but don't cheat. Respect the viewer."}, {"q": "Which creator brief follows Ogilvy's TV findings?", "o": ["Exciting first second, creator speaks on camera, product demonstrated visually.", "Quiet opening, voice-over only, lots of on-screen text.", "Famous athlete with no link to kitchens.", "Two minutes of narration over stock footage."], "a": 0, "e": "Grabbers, on-camera voice, show more than tell, relevant testimonials."}, {"q": "Five times as many people read the headline as the body. What follows for your first line?", "o": ["Put the brand and the benefit in it, so it sells even if nothing else is read.", "Make it a mystery so people read on.", "Keep it to one word.", "Put the brand only at the end."], "a": 0, "e": "If you don't sell in the headline, you've wasted most of the money."}, {"q": "Your carousel has photos with no captions. What does Ogilvy suggest?", "o": ["Add a caption to every photo, each a mini-ad with brand and promise.", "Remove the photos.", "Add captions only to the first slide.", "Use drawings instead."], "a": 0, "e": "Captions are read about twice as much as body copy, per Ogilvy."}, {"q": "A video has a strong middle but a weak opening and low hold rate. What's the Ogilvy move?", "o": ["Re-edit: new opening, shorter cut, caption hook, before reshooting.", "Kill it and start over.", "Double the budget.", "Add background music."], "a": 0, "e": "Many weak commercials can be salvaged by re-editing."}, {"q": "Your winning ad has run four weeks and is still efficient. The team wants something new. What does Ogilvy say?", "o": ["Repeat your winners; build variations but keep it running while it performs.", "Replace it; people are bored.", "Pause it to save budget.", "Change the brand colours."], "a": 0, "e": "Many great ads are discarded before they pay off."}], "drills": [{"type": "sort", "title": "Which Ogilvy rule?", "prompt": [], "checks": [], "model": ["Each rule answers a different question: what is it, what's the idea, what do we show, how do we prove it, what do we say first."], "items": ["\"Should Schweppes be a soft drink or a mixer?\" => Positioning", "An eye patch that runs for 20 years => Big idea", "The carbonator visible and working in every shot => Product as hero", "One uncut shot of pressing the lever and pouring => Honest demo", "\"Aarke Carbonator 3: up to 60 litres per cylinder\" => Headline"], "cats": ["Positioning", "Big idea", "Product as hero", "Honest demo", "Headline"], "pairs": []}, {"type": "write", "title": "Ogilvy-style headline and caption", "prompt": ["Write one headline with brand plus benefit, and one photo caption that works as a mini-ad."], "checks": [{"kind": "include", "arg": "aarke,carbonator", "label": "Mentions the brand or product"}, {"kind": "number", "arg": "", "label": "Has a specific number"}, {"kind": "maxwords", "arg": "20", "label": "20 words or fewer"}], "model": ["Headline: \"Aarke Carbonator 3: up to 60 litres of sparkling water per cylinder, no plug.\"", "Caption: \"One cylinder, up to 60 litres. That's this whole pile of bottles you don't have to carry.\""], "items": ["Headline (brand + benefit)", "Caption (mini-ad under a photo)"], "cats": [], "pairs": []}, {"type": "pick", "title": "Ogilvy would pick...", "prompt": [], "checks": [], "model": [], "items": [], "cats": [], "pairs": [{"a": "A real owner speaking on camera", "b": "A famous athlete with no link to kitchens", "ok": "A", "e": "Avoid irrelevant celebrities."}, {"a": "Re-edit the opening of a near-miss", "b": "Throw it away and reshoot", "ok": "A", "e": "Salvage before you rewrite."}, {"a": "\"Aarke Carbonator 3: 60 litres per cylinder\"", "b": "\"Pure poetry in steel\"", "ok": "A", "e": "Sell in the headline: brand plus benefit."}, {"a": "Award-winning but unproven concept", "b": "Plain concept that beat the control", "ok": "B", "e": "Be suspicious of awards; chase sales."}]}]}, {"n": 9, "lab": "Module 9", "short": "M9", "title": "The Robert Collier Letter Book", "sections": 5, "cards": [{"q": "Join the conversation already going on in their head.", "a": "Before writing a cold email, spend five minutes in the brand's Meta Ad Library, website and reviews. Write your first line about one specific thing you saw there. Delete every first line that starts with \"I\"."}, {"q": "Six essentials: a skeleton for any letter.", "a": "Write your next cold email as six sentences, one per essential. Then read it aloud. If one sentence feels forced, it is probably the snapper; make it honest or cut it."}, {"q": "Sound like one person writing to one person.", "a": "Count the \"you\"s and the \"I\"s in your email. There should be more \"you\" than \"I\". Replace any phrase you would never say out loud. Sign with your first name only."}, {"q": "Use the snapper honestly, and make the close tiny.", "a": "End every cold email with a one-word or one-click reply. Remove every second request. If you can't think of an honest snapper, leave it out. A clear, small close works on its own."}, {"q": "Showmanship: a grabber that makes the letter impossible to ignore.", "a": "Attach or include one small, real piece of work in every cold email: one hook, one script, or one test plan, made for that brand. Remember the standing rule: you write and send these yourself."}], "quiz": [{"q": "Which cold-email opening follows Collier's \"enter the conversation\" idea?", "o": ["\"Two of your three new Carbonator ads open with the same line.\"", "\"My name is Oskar and I'm a copywriter.\"", "\"I hope this email finds you well.\"", "\"I'm reaching out to introduce my services.\""], "a": 0, "e": "Start with something already on the reader's mind, not with yourself."}, {"q": "In Collier's six essentials, what is the snapper?", "o": ["What the reader loses by not acting, stated honestly.", "The first line that catches attention.", "A list of product features.", "The sender's signature."], "a": 0, "e": "The snapper gives a true reason not to wait."}, {"q": "Which sentence sounds like Collier's one-person-to-one-person tone?", "o": ["\"I noticed something in your reviews that could make a strong ad. Want to see it?\"", "\"We offer comprehensive copywriting solutions to leverage growth.\"", "\"Our agency delivers best-in-class creative.\"", "\"To whom it may concern.\""], "a": 0, "e": "Plain, warm, direct, and about the reader."}, {"q": "Your cold email ends: \"Can we book a call? Also, could you share my portfolio with your team?\" What's the Collier fix?", "o": ["One tiny close: \"Want the other two hooks? Reply 'yes'.\"", "Add a third request to be safe.", "End with no request.", "Ask them to call you."], "a": 0, "e": "Tell them exactly what to do, and make it the smallest possible yes."}, {"q": "There is no real deadline. What should your snapper be?", "o": ["Leave it out, or use a true gap, such as an angle competitors haven't used yet.", "Invent a deadline to create urgency.", "Say \"Only 2 spots left!\"", "Threaten to email their competitor."], "a": 0, "e": "Never invent pressure. The close works without a fake snapper."}, {"q": "What is the best modern equivalent of Collier's dollar-bill grabber in a cold email?", "o": ["One real hook or script written for that brand, attached or included.", "A funny GIF.", "A meme about marketing.", "A long PDF about yourself."], "a": 0, "e": "A grabber must tie to the message, and here it doubles as proof."}, {"q": "How do Collier's six essentials relate to Schwab's five fundamentals and Halbert's seven steps?", "o": ["They share the same bones: attention, explanation, desire, proof, push, action.", "They contradict each other.", "Collier's is only for print ads.", "Halbert's has no proof step."], "a": 0, "e": "When masters agree on a structure, use it."}, {"q": "You count 9 \"I\"s and 2 \"you\"s in your email. What does Collier's tone suggest?", "o": ["Rewrite so the email talks more about the reader than about you.", "It's fine; they need to know about you.", "Add more \"we\" instead.", "Make it longer."], "a": 0, "e": "More \"you\" than \"I\"."}], "drills": [{"type": "order", "title": "Six essentials, six lines", "prompt": ["Order these lines into a cold email that follows Collier's six essentials."], "checks": [], "model": ["Opening → description → motive → proof → snapper → close."], "items": ["Your reviews keep praising how easy the Carbonator is, but none of your current ads say it.", "I wrote three hooks built on that.", "Ease is what buyers mention most, so it may lower your cost per purchase.", "Here's one: \"No plug. No batteries. Just bubbles.\"", "None of your competitors use this angle yet.", "Want the other two? Reply \"yes\"."], "cats": [], "pairs": []}, {"type": "write", "title": "Rewrite a bad cold email", "prompt": ["Rewrite this email for a DTC brand you like: \"Hi, my name is Oskar and I'm a copywriter. I'm reaching out to see if you need help with your marketing. I have experience in many areas. Let me know if we can set up a call.\""], "checks": [{"kind": "startsnot", "arg": "hi my name,my name,i am,i'm,i hope,i am reaching", "label": "Doesn't open with yourself"}, {"kind": "maxwords", "arg": "90", "label": "90 words or fewer"}, {"kind": "you", "arg": "", "label": "Uses \"you/your\""}, {"kind": "question", "arg": "", "label": "Ends with a clear question or ask"}], "model": ["\"Your reviews keep saying the Carbonator is easy to use, but none of your current ads lead with it. I wrote three hooks on that angle from your own five-star reviews. Here's one: 'No plug. No batteries. Just bubbles.' Want the other two? Reply 'send'. Oskar\""], "items": [], "cats": [], "pairs": []}]}, {"n": 10, "lab": "Module 10", "short": "M10", "title": "Modern Performance Creative", "sections": 9, "cards": [{"q": "Built for the thumb: the first three seconds carry the message.", "a": "For every video concept, write out what is on screen and in text at seconds zero, one, two and three. If the main message isn't there by three, rewrite. Check every draft with the sound off."}, {"q": "Hook, body, call to action: the ABCD map.", "a": "Label every line of your scripts A, B, C or D. Check the brand appears in the first few seconds, the body is exact and tangible, and the ask comes only after the viewer knows why. Rewrite any vague line in the body as a number or a demonstration."}, {"q": "Creative is the new targeting.", "a": "For a client brief, describe each ad by the person it is for and the angle it uses, not by its visual. If two of your ads would attract the same person for the same reason, they are not diverse. Replace one."}, {"q": "Diversify for real, not with tiny tweaks.", "a": "Build your next creative plan as a grid: appeals down the side, formats across the top. Fill every cell with one hook. That is your twenty-ad launch, and a grid like this is a very strong portfolio piece."}, {"q": "Brief like a performance team: insight, audience, direction.", "a": "Write one persona brief per week for a brand you follow: insight, need, blocker, direction, three hooks. Four weeks gives you four portfolio briefs that look exactly like agency work."}, {"q": "Research first, a hypothesis on every test.", "a": "Write a hypothesis for every ad you put in your portfolio. It shows you think the way performance agencies say they work. In a cold email to an agency like SoScale, show one hypothesis-driven test plan, not a list of skills."}, {"q": "Format choice: statics, creators and partnership ads.", "a": "Take your best hook and write it for all three formats. Note which disclosure or policy check each needs. A portfolio page that shows one idea across three formats proves range."}, {"q": "Halbert's seven steps inside a fifteen-second Reel.", "a": "Write one script in exactly this shape for a brand you like. Time it out loud. Then write the same concept as a sixty-second creator story and compare. Both go in your portfolio."}, {"q": "Stay honest: policy, proof and real numbers only.", "a": "Run a claim check on every ad: next to each claim, write its source. Remove anything you can't source. Add this step to your briefs; agencies love copywriters who keep accounts out of trouble."}], "quiz": [{"q": "A 30-second video reveals the product at second 20. What does Meta's mobile-first guidance suggest?", "o": ["Put the main message in the first three seconds and aim for 15 seconds or less.", "Keep it; suspense builds interest.", "Add music to hold attention.", "Make it 60 seconds to tell more."], "a": 0, "e": "Meta: capture attention quickly and land the main message in the first 3 seconds."}, {"q": "Your ad relies on a voice-over for its message. What does Meta advise?", "o": ["Design for sound off with captions or on-screen text, and delight with sound on.", "Assume everyone has sound on.", "Remove all text so the voice stands out.", "Use louder music."], "a": 0, "e": "Don't rely on sound; make the message work silently."}, {"q": "In Google's ABCD, what does \"present the ask after the context is set\" mean for your CTA?", "o": ["Ask for the action only after the viewer understands why the product matters.", "Put \"Buy now\" in the first frame.", "Never include a call to action.", "Ask several times throughout."], "a": 0, "e": "Direction comes after connection."}, {"q": "Since Andromeda, what does Meta call the strongest lever for advertisers?", "o": ["Creative diversification: varied ads that help the system find different people.", "Narrower interest targeting.", "Fewer ads with bigger budgets.", "Longer videos."], "a": 0, "e": "Meta's April 2025 post: focus shifted from niche targeting to creative diversification."}, {"q": "You launch 20 ads that differ only in button colour and one word. What's wrong?", "o": ["They aren't diversified; real diversity means different angles, people and formats.", "Nothing; 20 ads meets the guideline.", "You need 40 ads.", "Button colour is the most important test."], "a": 0, "e": "Diversity is about appeals and formats, not tiny tweaks."}, {"q": "Which is an insight, not a feature, for a creative brief?", "o": ["People hate carrying heavy bottles, not drinking sparkling water.", "The carbonator is made of steel.", "It comes in five colours.", "The gas cylinder is included."], "a": 0, "e": "An insight is something true about people that the product connects to."}, {"q": "Which is a proper test hypothesis?", "o": ["\"The bottle-free hook will beat the design hook for weekly buyers, because reviews mention carrying bottles most.\"", "\"Let's see what happens.\"", "\"Ad B is better.\"", "\"The client likes Ad A.\""], "a": 0, "e": "A hypothesis names the angle, the persona, the evidence and the metric."}, {"q": "Meta reports partnership ads averaged 19% lower CPA in its study. How should you use that in a pitch?", "o": ["As Meta's own reported figure, linked, not as a promise for the client's account.", "As a guaranteed result.", "Round it up to 25% to sound better.", "Claim it as your own result."], "a": 0, "e": "Attribute platform numbers correctly; never present them as guarantees or your results."}, {"q": "Which claim is safest and strongest for a Meta ad?", "o": ["\"Up to 60 litres of sparkling water per cylinder, no plug needed.\"", "\"Lose bloating instantly with miracle water!\"", "\"Doctors hate this trick!\"", "\"The healthiest water on earth.\""], "a": 0, "e": "Specific, checkable and policy-safe beats hype."}, {"q": "How do Halbert's seven steps fit a 15-second Reel?", "o": ["One step per line or shot, in the same order: attention, interest, believe, prove, benefits, how, now.", "They don't fit; use only a logo.", "Put the order step first.", "Only use steps 1 and 7."], "a": 0, "e": "Compress, don't reorder."}], "drills": [{"type": "write", "title": "Fifteen-second ABCD script", "prompt": ["Write a 15-second script for a DTC product (or Aarke). One line per beat. Keep it to what can be said in 15 seconds (about 40 words)."], "checks": [{"kind": "maxwords", "arg": "25", "label": "Each beat 25 words or fewer"}, {"kind": "avoid", "arg": "", "label": "No vague words (premium, best, elevate...)"}], "model": ["Attention: \"Still carrying sparkling water home?\" (Aarke carbonator in shot)", "Connection: \"Press, hiss, pour. Up to 60 litres per cylinder, no plug.\"", "Direction: \"Get the starter kit. Link below.\""], "items": ["Attention (0-3s), with brand visible", "Connection (3-12s), exact and tangible", "Direction (12-15s), the ask"], "cats": [], "pairs": []}, {"type": "sort", "title": "Diverse or duplicate?", "prompt": ["You already have the ad \"Never carry sparkling water home again\" (creator, convenience). Is each new ad genuinely diverse, or a duplicate of the same idea?"], "checks": [], "model": ["Diversity = a different person, motivation or format. Small tweaks are the same ad to the system."], "items": ["Static with one number: \"Up to 60 litres per cylinder.\" => Diverse", "Same creator, same script, red button instead of blue => Duplicate", "A design-lover persona: slow shots of the steel body => Diverse", "\"Never carry sparkling water home ever again\" => Duplicate", "A host persona serving guests flavoured sparkling water => Diverse", "Same video with a different background song => Duplicate"], "cats": ["Diverse", "Duplicate"], "pairs": []}, {"type": "write", "title": "Persona brief", "prompt": ["Write a one-persona creative brief in Meta's three-part shape."], "checks": [{"kind": "filled", "arg": "", "label": "Written"}, {"kind": "maxwords", "arg": "45", "label": "45 words or fewer per field"}], "model": ["Insight: people hate carrying heavy bottles, not drinking sparkling water.", "Need: bubbles without the effort. Blocker: \"it's expensive\".", "Direction: creator shows a week without carrying bottles, then answers price honestly. Hook: \"I haven't carried a bottle home since March.\""], "items": ["Insight (true about people)", "Persona need and blocker", "Creative direction and one hook"], "cats": [], "pairs": []}]}, {"n": 11, "lab": "Module 11", "short": "M11", "title": "Six Classic Ads, Torn Down", "sections": 8, "cards": [{"q": "How to tear down an ad, and how to copy one.", "a": "Pick one ad from this module today. Open the source link, read it once fast, then copy it in the type-out pad for twenty minutes. Write your three lines. Do one ad a day, and repeat your favourite every week."}, {"q": "\"Do You Make These Mistakes In English?\": a question with one magic word.", "a": "Write a lead-generation hook in the \"these mistakes\" pattern for a DTC brand. Then use the same pattern as a cold-email subject: \"These 3 lines in your Carbonator ads.\" Make sure the email actually delivers exactly those three."}, {"q": "\"What Everybody Ought To Know About This Stock And Bond Business\": the ad that taught.", "a": "Write the headline \"What everybody ought to know about...\" for your client's category, and list the eight questions a nervous first-time buyer has. That list is a carousel, a landing page and five ad hooks. In cold emails, offering to teach, such as a short teardown, is the Engel move."}, {"q": "The coat-of-arms letter: the reader's own name as the hook.", "a": "Write the first line of your next cold email so it could only have been sent to that one company: their product, their review, their ad. If the line would work for any brand, rewrite it. That's the coat-of-arms principle."}, {"q": "\"How To Burn Off Body Fat Hour-By-Hour!\": news style, mechanism and a risk-free close.", "a": "Find your client's real risk reversal: return window, warranty, guarantee. Write it in one plain, memorable line, like \"you can't lose money\" but true. Put it next to the call to action."}, {"q": "The Admiral Byrd letter: price first, and danger as a benefit.", "a": "Write one hook that leads with your client's price or main drawback and turns it into a reason to buy for the right person. Test it against the usual hook. In cold emails, being honest about what you are not, such as \"I'm new, so I work on spec first,\" can be a strength."}, {"q": "\"The Lazy Man's Way To Riches\": the confession hook and the uncashed check.", "a": "Write a three-line objection rhythm for your client: \"You don't need X. You don't need Y. You don't need Z.\" Use the real top objections from reviews. It works as the body of a fifteen-second script and as a strong paragraph in a cold email."}, {"q": "Putting the six moves together in one modern ad.", "a": "Write your own six-move script for a brand you like, then cut it to fifteen seconds. Label each line with the classic it borrows from. That labelled script is a strong portfolio piece, because it shows you know where your craft comes from."}], "quiz": [{"q": "You want to use the Sackheim pattern for a skincare brand. Which hook keeps the move that did most of the work?", "o": ["\"Do you make these 3 mistakes with your sunscreen?\"", "\"Do you make mistakes with sunscreen?\"", "\"Sunscreen mistakes are common.\"", "\"Learn about sunscreen.\""], "a": 0, "e": "\"These\" points at a specific list the reader must check. Without it the curiosity disappears."}, {"q": "What did the Sackheim ad's \"no agent will call\" line do?", "o": ["Answered the fear behind the free offer before the reader raised it.", "Made the ad longer.", "Created urgency.", "Showed the price."], "a": 0, "e": "Risk and fear answered at the close; today's version is \"no call needed.\""}, {"q": "A nervous first-time buyer category (e.g., home carbonation). Which Engel move fits?", "o": ["A plain-English \"what everybody ought to know about...\" page answering every beginner question.", "A hard-sell discount banner.", "A mystery teaser with no information.", "A celebrity endorsement."], "a": 0, "e": "Teaching builds trust; the brand that explains becomes the brand people buy from."}, {"q": "The coat-of-arms letter opened with the reader's family name. What's the cold-email equivalent?", "o": ["A first line that could only be sent to that one company: their product, review or ad.", "A template that works for any brand.", "Your own name and title.", "A joke about Mondays."], "a": 0, "e": "Personal relevance is the hook. If it would work for anyone, it isn't personal."}, {"q": "The body-fat ad offered to hold your check uncashed for 30 days. Which move should you keep today?", "o": ["A clear, true risk reversal: the brand's real return policy or warranty in one memorable line.", "The rapid weight-loss claims.", "The miracle language.", "The fake news dateline."], "a": 0, "e": "Keep the structure (risk reversal), never the claims, which would break today's policies and laws."}, {"q": "The Byrd letter opened with the $10,000 price and a warning about danger. Why did it work?", "o": ["For a carefully chosen list, the price and danger flattered and selected the right reader.", "Price always belongs in the first line.", "Danger is always a benefit.", "It was short."], "a": 0, "e": "List research plus a selecting opening. It works when the reader is right."}, {"q": "Which Karbo move is safest to borrow for a DTC carbonator?", "o": ["The objection rhythm: \"You don't need a socket. You don't need batteries.\"", "Promising buyers they'll get rich.", "Bragging about your boats.", "An income guarantee."], "a": 0, "e": "Borrow the rhythm and the honesty, never the income claims."}, {"q": "You're doing a teardown. Which set of questions follows the module's method?", "o": ["Headline's job and selection, hook, central selling idea, proof, close and risk reversal.", "Font, colour, logo size, photo filter.", "Who won awards for it.", "How many likes it got."], "a": 0, "e": "Teardowns look at the selling structure, not the decoration."}, {"q": "You copied an ad in the type-out pad at 25 wpm with 98% accuracy. What should you do next?", "o": ["Write three lines: what to steal, what wouldn't work today, and one modern hook.", "Race to beat your wpm right away.", "Delete it and move on.", "Post it online as your own."], "a": 0, "e": "The point of copying is noticing. Speed is just a progress number."}], "drills": [{"type": "typeout", "title": "Type-out pad: copy a classic by hand", "prompt": ["Choose an ad, open the source link, and copy it word for word in the pad. The timer starts with your first keystroke. If you paste the original into the optional box, you'll see live accuracy; it stays only in your browser. We link rather than reproduce these ads."], "checks": [], "model": ["After each session, write: 1) one move to steal, 2) one thing that wouldn't work today, 3) one modern hook using the move."], "items": ["Do You Make These Mistakes In English? (Sackheim, 1919) | https://swiped.co/file/do-you-make-these-mistakes-by-max-sackheim/ | 1919 ad (US public domain); scan via Swiped", "What Everybody Ought To Know About This Stock And Bond Business (Engel, 1948) | https://swiped.co/file/about-this-stock-bond-louis-engel/ | linked only; read at Swiped", "The coat-of-arms letter (Halbert) | https://www.thegaryhalbertletter.com/newsletters/zszs_aida.htm | no verified public full copy; Halbert quotes the opening in this issue", "How To Burn Off Body Fat Hour-By-Hour! (1979 newspaper ad) | https://gateway.okhistory.org/ark:/67531/metadc1830121/m1/14/ | public archive page, Oklahoma Daily, 20 Mar 1979", "The Admiral Byrd letter (Burnett, 1960s) | https://dennyhatch.blogspot.com/2019/07/63-most-astounding-sales-letter-you.html | full text on Denny Hatch's blog", "The Lazy Man's Way To Riches (Karbo, 1970s) | https://texashistory.unt.edu/ark:/67531/metapth353587/m1/75/ | public archive page, Scouting, Oct 1974 p. 75"], "cats": [], "pairs": []}, {"type": "sort", "title": "Which ad taught this move?", "prompt": [], "checks": [], "model": ["Each classic has one signature move. Learn the move, and you can use it in any category."], "items": ["A question headline with the word \"these\" => Sackheim", "Teaching the nervous beginner everything, then a free booklet => Engel", "The reader's own family name as the hook => Coat of arms", "A news dateline and a post-dated check => Body fat", "Price and danger in the first lines, to a researched list => Byrd", "\"It doesn't require education... luck... talent...\" => Karbo"], "cats": ["Sackheim", "Engel", "Coat of arms", "Body fat", "Byrd", "Karbo"], "pairs": []}, {"type": "write", "title": "Steal the move, not the claim", "prompt": ["Write one modern, policy-safe line for a DTC brand using each classic move."], "checks": [{"kind": "maxwords", "arg": "22", "label": "22 words or fewer"}, {"kind": "avoid", "arg": "miracle,guaranteed results,lose,rich,doctor", "label": "No risky claims (miracle, guaranteed results, weight loss, riches)"}], "model": ["Sackheim: \"Do you make these 3 mistakes with your home sparkling water?\"", "Risk reversal: \"Register it and it's covered for three years. The only thing you'll buy again is gas.\"", "Karbo: \"You don't need a socket. You don't need batteries. You don't need counter space for a big machine.\""], "items": ["\"These\" question (Sackheim)", "Risk reversal (body-fat ad)", "Objection rhythm (Karbo)"], "cats": [], "pairs": []}]}, {"n": 12, "lab": "Module 12", "short": "M12", "title": "The Halbert Method Workbook", "sections": 9, "cards": [{"q": "Treat the method as a production line, not a mood.", "a": "Block one hour today and run the full method on the Aarke brief in the workbook. Don't skip a step, and don't polish. The goal of the first run is to finish, not to be brilliant."}, {"q": "Step one: build the swipe file that feeds you.", "a": "Add the course patterns, then ten of your own today. Deal five and adapt all five to the Aarke brief. Keep every adaptation in your notes, even the bad ones."}, {"q": "Step two: pick the brief and do The Suck.", "a": "Fill the nugget notes field with at least thirty lines for your brief. Use the brand's site, reviews, and competitors' active ads. Mark anything you couldn't verify with a question mark, and never use it in copy until it's checked."}, {"q": "Step three: find the central selling idea, and test it.", "a": "Write your central selling idea in the workbook until all four checks turn green. If you have a second one, note it in your nugget notes as \"concept B\". These become the hypotheses in your test plan."}, {"q": "Step four: the ten-minute fast draft.", "a": "Run the ten-minute draft for your brief now, with no-delete mode on. Don't read it until after a break. Then highlight the three best phrases. They usually become your attention line, a proof line and a benefit."}, {"q": "Step five: rebuild it into the seven steps.", "a": "Fill all seven fields until the checks pass. If the urgency check fails because there is no true reason to act now, write the honest version: \"your first glass, this week\". Never invent scarcity."}, {"q": "Step six: read it aloud and tighten.", "a": "Get the tightening report fully green, then time a read-aloud. Cut until a fifteen-second version fits in fifteen seconds. Save both versions: the full seven steps and the fifteen-second cut."}, {"q": "Step seven: turn it into a SoScale-style test pack.", "a": "Build a one-page test pack from your workbook output: research, two concepts with hypotheses, ten hooks, two scripts. Label it \"spec work, not commissioned\". Never add results you didn't get."}, {"q": "Package the portfolio, and let it sell you.", "a": "Export your first workbook as Markdown today. Turn it into one portfolio entry with the outline above. Then repeat the whole method on a second brand next week. Two honest, well-reasoned entries beat ten pretty ads with no thinking shown."}], "quiz": [{"q": "You don't feel inspired today. What does the Halbert Method say to do?", "o": ["Run the fixed sequence anyway; each step has a visible output.", "Wait until inspiration comes.", "Skip to writing the final ad.", "Copy a competitor's ad word for word."], "a": 0, "e": "The method is a production line, not a mood."}, {"q": "The workbook deals you \"They laughed when I...\" from your swipe file. What do you do with it?", "o": ["Adapt the pattern to your brief, e.g. \"They laughed when I bought a carbonator. Then they asked for a glass.\"", "Use the original headline unchanged.", "Delete it because it's old.", "Use it only for piano courses."], "a": 0, "e": "Borrow the pattern, write new words, product and promise."}, {"q": "A review says \"lasts forever\" but you can't find a source for durability. What goes in your nugget notes?", "o": ["The phrase with a question mark, unused in copy until verified (e.g., the brand's 10,000-cycle test).", "\"Lasts forever\" as a headline.", "A made-up figure like \"20 years\".", "Nothing; ignore reviews."], "a": 0, "e": "Never use unverified facts. Mark them and check."}, {"q": "Which central selling idea passes all four workbook checks?", "o": ["\"Never carry sparkling water home again: one cylinder makes up to 60 litres for you.\"", "\"Elevate your hydration experience.\"", "\"Premium bubbles for modern homes.\"", "\"The best carbonator ever.\""], "a": 0, "e": "Under 20 words, specific, no vague words, about \"you\"."}, {"q": "During your 10-minute fast draft, you notice a clumsy sentence. What should you do?", "o": ["Keep going; fix it later after the draft has cooled.", "Stop and rewrite it perfectly.", "Delete the whole draft.", "Switch to the seven steps immediately."], "a": 0, "e": "Forget form, forget grammar. Editing comes later."}, {"q": "Your step seven reads \"Only 3 left!\" but stock isn't limited. What's the fix?", "o": ["Replace it with an honest reason to act, like \"your first glass, this week.\"", "Keep it; urgency sells.", "Make it \"Only 1 left!\"", "Remove step seven entirely and the CTA."], "a": 0, "e": "Never invent scarcity. Use a true reason for now."}, {"q": "Your tightening report shows an average sentence length of 22 words. What do you do?", "o": ["Split and cut sentences until the average is 14 or fewer, then read aloud again.", "Ignore it; long sentences sound smart.", "Add more adjectives.", "Make the font smaller."], "a": 0, "e": "Short sentences, cut every word that doesn't sell."}, {"q": "What makes a test pack \"SoScale-style\"?", "o": ["Research with sources, genuinely different concepts with written hypotheses, hooks across formats, and scripts.", "One polished ad with no explanation.", "Twenty hooks that say the same thing.", "A list of your software skills."], "a": 0, "e": "Hypothesis on every test, research-based, diversified."}, {"q": "How should you present the Aarke work in your portfolio?", "o": ["As clearly labelled spec work, with sources, idea, copy, script and test plan, and no invented results.", "As if Aarke commissioned it.", "With estimated results that sound impressive.", "Without sources, to look cleaner."], "a": 0, "e": "Honest labelling and visible thinking sell you better than fake numbers."}, {"q": "You want to email a brand with your sample. Which ask follows the course?", "o": ["Include one hook as a free sample and ask one small question, sent by you.", "Attach your full CV and ask for a job.", "Ask for a call, a referral and a follow on LinkedIn.", "Have someone else send it on your behalf."], "a": 0, "e": "Offer service, one small ask, and you send it yourself."}], "drills": [{"type": "workbook", "title": "The Halbert Method workbook", "prompt": ["Work through the eight steps in order. Everything saves in this browser. Export at the end."], "checks": [], "model": ["How to [result] without [pain] | how-to", "Do you make these [N] mistakes with [thing]? | question", "[N] ways to [result] | number", "A little secret that [result] | secret", "An amazing [thing] that [result] | amazing", "They laughed when I [did X]. Then [result]. | story", "What everybody ought to know about [category] | teach", "At last: [result] without [pain] | news", "For people who [identity] | identity", "Still [painful habit]? | problem", "I used to think [belief]. Then [turn]. | confession", "Never [pain] again | promise", "[Brand]: [benefit] with [specific] | brand-benefit", "The lazy way to [result] | lazy", "You don't need [X]. You don't need [Y]. | objection-rhythm"], "items": ["Aarke Carbonator 3 (real facts) :: Up to 60 litres of sparkling water per gas cylinder (aarke.com) ;; No electricity needed (aarke.com) ;; Tested for more than 10,000 carbonation cycles (aarke.com) ;; 3-year warranty when the product is registered (aarke.com) ;; 87% of 760 reviews give 5 stars (aarke.com, read Nov 2026) ;; Starter kit 2,450 kr (aarke.com/sv-se, read Nov 2026) ;; Main objection in reviews and press: price ;; Source: https://www.aarke.com/", "FICTIONAL practice brief: protein snack DTC brand :: FICTIONAL brand for practice only. Do not publish as real. ;; Product: a high-protein snack bar sold online by subscription ;; Buyers: busy people who train before or after work ;; Main objection: \"protein bars taste like chalk\" ;; Use moment: in the gym bag, after a workout ;; Before publishing, replace with a real brand and verified facts", "FICTIONAL practice brief: skincare DTC brand :: FICTIONAL brand for practice only. Do not publish as real. ;; Product: a simple three-step skincare routine sold online ;; Buyers: people who feel overwhelmed by ten-step routines ;; Main objection: \"will this work for my skin type?\" ;; Policy: follow Meta's health and wellness rules; no before-and-after body shaming, no medical claims ;; Before publishing, replace with a real brand and verified facts", "Your own pick: a real DTC brand :: Choose a real DTC brand you'd like to work for ;; Collect facts from its product page, reviews and Meta Ad Library ;; Write the source next to every fact ;; Note the main objection from reviews ;; Label the finished piece as spec work"], "cats": [], "pairs": []}, {"type": "order", "title": "Run the method in order", "prompt": ["Put the steps of the Halbert Method in the order you run them."], "checks": [], "model": ["Swipe → Suck → CSI → fast draft → seven steps → aloud and tighten → package."], "items": ["Build and shuffle the swipe file", "Pick the brief and write 30+ nugget notes", "Find and check the central selling idea", "Write the 10-minute fast draft, then let it cool", "Rebuild the draft into the seven steps", "Read it aloud and tighten", "Package it as a test pack and portfolio entry"], "cats": [], "pairs": []}]}]};</script>
<script>window.KVIEW={"m01": {"n": 1, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. An ad is a salesperson, so judge it like one.", "s": 25.57}, {"t": "2. Specifics get believed. Generalities get ignored.", "s": 146.12}, {"t": "3. Tell the story nobody else bothered to tell.", "s": 271.2}, {"t": "4. The headline picks the reader. Pick the right one.", "s": 376.97}, {"t": "5. Offer service. The best ads ask no one to buy.", "s": 457.72}, {"t": "6. Show the bright side, not the problem.", "s": 559.05}, {"t": "7. Test it. Let buyers settle the argument.", "s": 641.87}, {"t": "8. Once they are interested, tell the full story.", "s": 727.47}, {"t": "9. Worked rewrite: one weak ad, the Hopkins way.", "s": 812.31}, {"t": "End", "s": 935.16}]}, "m02": {"n": 2, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. The headline does most of the selling, so spend most of your time there.", "s": 38.89}, {"t": "2. Lead with self-interest. Curiosity alone is a gamble.", "s": 163.64}, {"t": "3. The appeal beats the wording. Find the right reason to buy.", "s": 275.02}, {"t": "4. Use the story headline: the underdog who wins.", "s": 404.28}, {"t": "5. Some words carry weight. Use them honestly.", "s": 501.84}, {"t": "6. Make the copy believable and specific.", "s": 595.43}, {"t": "7. Keep testing, and keep the winner running.", "s": 683.17}, {"t": "8. Worked example: one week of Caples on a real brief.", "s": 795.68}, {"t": "End", "s": 936.77}]}, "m03": {"n": 3, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. Start from the hard truth: nobody wants to read your ad.", "s": 39.2}, {"t": "2. Fundamental one: get attention with the advantage itself.", "s": 149.7}, {"t": "3. Fundamental two: show people what's in it for them.", "s": 243.89}, {"t": "4. Fundamental three: prove it.", "s": 342.67}, {"t": "5. Fundamental four: help them grasp the advantage and feel it.", "s": 447.43}, {"t": "6. Fundamental five: ask for action, clearly and now.", "s": 545.63}, {"t": "7. Hold the reader all the way down.", "s": 645.01}, {"t": "8. Test like a mail-order man.", "s": 743.12}, {"t": "9. Worked example: the five fundamentals as a cold-email checklist.", "s": 828.58}, {"t": "End", "s": 932.47}]}, "m04": {"n": 4, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. Get the skill into your hands: copy great ads out by hand.", "s": 32.51}, {"t": "2. Build a swipe file and feed it every day.", "s": 150.06}, {"t": "3. Study the product until the selling idea falls out.", "s": 258.82}, {"t": "4. Shuffle the headlines, then find the central selling idea.", "s": 359.28}, {"t": "5. Write the first draft fast. Forget form. Forget grammar.", "s": 464.59}, {"t": "6. Rework it into the seven steps.", "s": 568.77}, {"t": "7. Read it aloud, then tighten.", "s": 684.76}, {"t": "8. Use a grabber, but tie it to the message.", "s": 783.03}, {"t": "9. Tell a story, and sell yourself the same way.", "s": 886.18}, {"t": "End", "s": 981.62}]}, "m05": {"n": 5, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. The first lesson isn't about copy: look after the machine.", "s": 32.46}, {"t": "2. Find the starving crowd before you write a word.", "s": 141.03}, {"t": "3. Be a student of markets: watch what people buy, not what they say.", "s": 247.95}, {"t": "4. Recent, frequent and the right price: the best prospects.", "s": 338.09}, {"t": "5. Get into the A-pile.", "s": 441.98}, {"t": "6. First impressions: give the reader's eyes a rest.", "s": 545.92}, {"t": "7. Attention, interest, desire, action: and the nugget notes behind it.", "s": 632.8}, {"t": "8. Copy the great ads. Use small words and short sentences.", "s": 728.46}, {"t": "9. Make a proposition, and give the reason why.", "s": 808.08}, {"t": "10. Find the market first, then make it believable with specifics.", "s": 895.34}, {"t": "End", "s": 980.47}]}, "m06": {"n": 6, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. You cannot create desire. You can only channel it.", "s": 33.54}, {"t": "2. Read the market's awareness before you write the headline.", "s": 132.63}, {"t": "3. For unaware buyers, start with them, not the product.", "s": 242.79}, {"t": "4. Read the market's sophistication: what has it already heard?", "s": 335.23}, {"t": "5. Mechanism: explain how it works, and make the claim new again.", "s": 446.9}, {"t": "6. Intensification: make the desire vivid.", "s": 540.11}, {"t": "7. Identification: sell the role, not just the result.", "s": 633.83}, {"t": "8. Gradualization and redefinition: build belief step by step, reframe the objection.", "s": 719.67}, {"t": "9. Camouflage and concentration: borrow a trusted format, and use the competitors' weakness.", "s": 816.41}, {"t": "10. Worked example: one brief, three audiences, three different ads.", "s": 922.13}, {"t": "End", "s": 1045.24}]}, "m07": {"n": 7, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. Everything in the ad exists to get the first sentence read.", "s": 45.76}, {"t": "2. The first sentence sells the second: build a slippery slide.", "s": 144.8}, {"t": "3. Create a buying environment, and get the reader nodding.", "s": 236.62}, {"t": "4. Keep them reading with curiosity, but aim it at buyers.", "s": 332.16}, {"t": "5. Sell the concept, not the product.", "s": 425.2}, {"t": "6. Answer every question in the order they ask it.", "s": 505.98}, {"t": "7. Sell the cure, not the prevention.", "s": 605.27}, {"t": "8. Make it personal, and tell a story.", "s": 683.48}, {"t": "9. Don't assume limits that aren't there: test the strange idea.", "s": 766.42}, {"t": "10. Incubate, then edit to the fewest words.", "s": 872.81}, {"t": "End", "s": 955.53}]}, "m08": {"n": 8, "markers": [{"t": "Start", "s": 0.3}, {"t": "1. Decide the positioning before you write a word.", "s": 46.19}, {"t": "2. Make a large promise, and build it on a big idea.", "s": 150.7}, {"t": "3. Don't be a bore, and don't chase awards.", "s": 254.72}, {"t": "4. Problem, solution, proof. And don't cheat.", "s": 355.1}, {"t": "5. Video rules that still work: grab early, show, window.addEventListener("keydown",e=>{ // registered on window (bubbles last): skips keys already used by the page, e.g. F = flip a visible flashcard

// ---------- flashcards ----------
function Deck(root,cards,opts={}){
  let order=cards.map((c,i)=>i), pos=0;
  root.innerHTML=`<div class="deck"><div class="fcbar"><span class="cnt"></span><span style="flex:1"></span>
  <label class="kbd"><input type="checkbox" class="onlyun"> only cards not yet known</label>
  <button class="btn shuf">🔀 Shuffle</button></div>
  <div class="fc" tabindex="0" role="button" aria-label="Flashcard: press space to flip"><div class="fci"><div class="fcf"><small class="tag"></small><div class="qq"></div></div><div class="fcb"><small>Answer</small><div class="aa"></div></div></div></div>
  <div class="fcbar"><button class="btn prev">← Prev</button><button class="btn flipb">Flip (Space)</button><button class="btn next">Next →</button><span style="flex:1"></span>

function Quiz(root,qs,opts={}){
  let items=[],i=0,right=0,answered=false;
  function start(){
    items=shuffle(qs).map(q=>Object.assign({},q,{o2:shuffle(q.o.map((o,k)=>({o,ok:k===q.a})))}));
    i=0;right=0;show();
  }

    if(i>=items.length) return finish();
    answered=false; const q=items[i];
    root.innerHTML=`<div class="qz-top"><span class="qz-n">Question ${i+1} of ${items.length}</span><span class="qz-bar"><i style="width:${100*i/items.length}%"></i></span><span class="score">Score <span class="sc">${right}</span></span></div>
    <div class="q qz1" data-qi="${i}"><div class="qt">${esc(q.q)}</div>`+
    q.o2.map((x,k)=>`<button class="opt" data-ok="${x.ok?1:0}"><span class="ok-k">${k+1}</span> ${esc(x.o)}</button>`).join("")+

  });
  start();
}

  // 6 steps
  const stC=[[{kind:"maxwords",arg:"16",label:"Short: 16 words or fewer"},{kind:"avoid",arg:"",label:"No vague words"}],[{kind:"you",arg:"",label:"Talks to you/your"}],[{kind:"include",arg:"because,tested,since,years,review,customers,%,warranty,guarantee,made,lab,study,award,certified",label:"Gives a reason to believe (tested, reviews, warranty...)"}],[{kind:"number",arg:"",label:"Proof with a number or named source"}],[{kind:"lines",arg:"3",label:"At least 3 benefits, one per line"}],[{kind:"include",arg:"click,tap,order,shop,reply,visit,book,buy,go to,add to cart,swipe",label:"A clear action (tap, order, reply...)"}],[{kind:"include",arg:"now,today,tonight,until,before,only,ends,last,while,this week,limited",label:"A reason to act now (real, not fake)"}]];
  $$(".wb-step",el).forEach(ta=>{const i=+ta.dataset.i;ta.value=W.steps[i]||"";const ck=()=>{$(`.st-ck[data-i="${i}"]`,el).innerHTML=ta.value.trim()?checkList({checks:stC[i]},ta.value):""};ta.oninput=()=>{W.steps[i]=ta.value;sv();ck();tighten()};ck()});
  // 7 tighten + read aloud
  function full(){return W.steps.filter(x=>x.trim()).join("\n\n")}
  function tighten(){const t=full();if(!t.trim()){$(".tight",el).innerHTML='<p class="muted small">Fill in the 7 steps above to get a tightening report.</p>';return}
    const ss=sentences(t),long=ss.filter(s=>wc(s)>20),avg=Math.round(wc(t)/Math.max(1,ss.length));
    const vag=VAGUE.filter(w=>new RegExp("(^|[^a-z])"+reEsc(w)+"([^a-z]|$)","i").test(t));
    const pas=(t.match(/\b(is|are|was|were|be|been|being)\s+\w+ed\b/gi)||[]);
    $(".tight",el).innerHTML=`<ul class="cks"><li class="${avg<=14?"ok":"no"}">${avg<=14?"✔":"✘"} Average sentence length: ${avg} words (aim for 14 or fewer)</li><li class="${long.length?"no":"ok"}">${long.length?"✘":"✔"} Sentences over 20 words: ${long.length}</li><li class="${vag.length?"no":"ok"}">${vag.length?"✘":"✔"} Vague words: ${vag.length?esc(vag.join(", ")):"none"}</li><li class="${pas.length?"no":"ok"}">${pas.length?"✘":"✔"} Possible passive voice: ${pas.length?esc(pas.slice(0,5).join("; ")):"none"}</li></ul>`+(long.length?`<p class="muted small">Cut or split: ${long.slice(0,3).map(s=>"“"+esc(s)+"”").join(" ")}</p>`:"")}
  tighten();
  $(".wb-say",el).onclick=()=>{const t=full();if(!t.trim()||!window.speechSynthesis){alert(window.speechSynthesis?"Write your 7 steps first.":"Your browser has no speech voice; read it aloud yourself.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=1;speechSynthesis.speak(u)};
  $(".wb-stop",el).onclick=()=>{try{speechSynthesis.cancel()}catch(e){}};
  // 8 export
  function md(){const b=briefs[W.brief]||{t:"",f:[]};return `# ${b.t}: ad draft (Halbert Method)\n\n_By Oskar Axelsson. Spec work, not commissioned._\n\n## Central selling idea\n${W.csi}\n\n## Final copy (Halbert's 7 steps)\n`+STEPS.map((s,i)=>`### ${i+1}. ${s}\n${W.steps[i]||""}`).join("\n\n")+`\n\n## First draft (10-minute fast draft)\n${W.draft}\n\n## Nugget notes\n${W.notes}\n\n## Brief facts used\n${b.f.map(x=>"- "+x).join("\n")}\n\n## Swipe-file headlines\n${W.swipe.map(x=>"- "+x.h).join("\n")}\n`}
  $(".wb-dl",el).onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([md()],{type:"text/markdown"}));a.download="halbert-method-draft.md";document.body.appendChild(a);a.click();a.remove();$(".wb-msg",el).textContent="Downloaded."};
  $(".wb-copy",el).onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(md()):Promise.reject()).then(()=>{$(".wb-msg",el).textContent="Copied."},()=>{$(".wb-msg",el).textContent="Copy failed; use Download."})};
}

})();
</script>
</body></html>

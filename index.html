 cold email, the Hopkins way.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="936.77">That&#x27;s the end of Module 2. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>The headline moves results most. Write ten before you write the body.</li><li>Lead with self-interest. Curiosity only as seasoning.</li><li>Test appeals first, wording second. The right appeal can multiply results.</li><li>Story headlines: doubt, then triumph, in a scene with other people.</li><li>Weighted words (how to, new, free, now) only when true.</li><li>Specific, checkable facts and real customer voices create belief.</li><li>Control versus challenger. Keep the winner until a test beats it.</li><li>One week: research appeals, thirty hooks, three-ad test, then wording.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 9 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="2"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 8 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://en.wikipedia.org/wiki/John_Caples" target="_blank" rel="noopener">John Caples, Tested Advertising Methods (1932) and career facts: Wikipedia</a></li><li><a href="https://www.nytimes.com/1990/06/11/obituaries/john-caples-90-author-in-1926-of-they-laughed-when-ad.html" target="_blank" rel="noopener">The New York Times obituary (1990): &quot;They Laughed&quot; ad of 1926, BBDO</a></li><li><a href="https://sirismm.si.edu/EADpdfs/NMAH.AC.0393.pdf" target="_blank" rel="noopener">Smithsonian, John Caples papers (finding aid)</a></li><li><a href="https://www.soscalemedia.se/" target="_blank" rel="noopener">SoScale&#x27;s website (&quot;hypothesis on every ad test&quot;)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m01"><small>← Previous</small>Module 1: Scientific Advertising</a><a class="nx" href="#m03"><small>Next →</small>Module 3: How to Write a Good Advertisement</a></nav></article></main></template>
<template id="v-m03" data-cls="chpage hasaudio" data-title="Module 3: How to Write a Good Advertisement · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 3</b> <span>How to Write a Good Advertisement</span></div><div class="tb-r"><a class="ib" href="#m04" title="Next: Module 4">4 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m03-how-to-write-a-good-advertisement.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 3 · Contents</div><div class="tc-t">How to Write a Good Advertisement</div><ol class="tc"><li><a href="#m03/glance">At a glance</a></li><li class="l2"><a href="#m03/L1"><span class="n">3.1</span> Start from the hard truth: nobody wants to read your ad.</a></li><li class="l2"><a href="#m03/L2"><span class="n">3.2</span> Fundamental one: get attention with the advantage itself.</a></li><li class="l2"><a href="#m03/L3"><span class="n">3.3</span> Fundamental two: show people what&#x27;s in it for them.</a></li><li class="l2"><a href="#m03/L4"><span class="n">3.4</span> Fundamental three: prove it.</a></li><li class="l2"><a href="#m03/L5"><span class="n">3.5</span> Fundamental four: help them grasp the advantage and feel it.</a></li><li class="l2"><a href="#m03/L6"><span class="n">3.6</span> Fundamental five: ask for action, clearly and now.</a></li><li class="l2"><a href="#m03/L7"><span class="n">3.7</span> Hold the reader all the way down.</a></li><li class="l2"><a href="#m03/L8"><span class="n">3.8</span> Test like a mail-order man.</a></li><li class="l2"><a href="#m03/L9"><span class="n">3.9</span> Worked example: the five fundamentals as a cold-email checklist.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m03/quiz">✅ Questions (9)</a></li><li><a href="#m03/play">🛠️ Playground (3)</a></li><li><a href="#m03/cards">🃏 Lesson cards (9)</a></li><li><a href="#m03/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03" aria-current="page"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Book 3 · Victor O. Schwab · 1962</div><h1 data-t="0.30"><span class="chn">Module 3</span><span data-say>How to Write a Good Advertisement</span> <span class="h1sub" data-say>by Victor O. Schwab</span></h1><div class="lead"><p data-say data-t="6.13">Victor Schwab started as the secretary of Maxwell Sackheim, the man who wrote &quot;Do You Make These Mistakes In English?&quot;. He went on to co-found the mail-order agency Schwab and Beatty, where every ad carried a coded coupon and every headline had to pay its way. His book is the most practical of the classics: five fundamentals that work as a checklist for any ad, landing page or cold email. Halbert put it on his short list of books to read first. Here are the lessons, and how to use each one today.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 15:41</span><span>9 lessons</span><span>9 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m03/L1"><b>3.1 Start from the hard truth: nobody wants to read your ad.</b></a> <span class="muted">· 🎧 1:50</span></li><li><a href="#m03/L2"><b>3.2 Fundamental one: get attention with the advantage itself.</b></a> <span class="muted">· 🎧 1:34</span></li><li><a href="#m03/L3"><b>3.3 Fundamental two: show people what&#x27;s in it for them.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m03/L4"><b>3.4 Fundamental three: prove it.</b></a> <span class="muted">· 🎧 1:45</span></li><li><a href="#m03/L5"><b>3.5 Fundamental four: help them grasp the advantage and feel it.</b></a> <span class="muted">· 🎧 1:38</span></li><li><a href="#m03/L6"><b>3.6 Fundamental five: ask for action, clearly and now.</b></a> <span class="muted">· 🎧 1:39</span></li><li><a href="#m03/L7"><b>3.7 Hold the reader all the way down.</b></a> <span class="muted">· 🎧 1:38</span></li><li><a href="#m03/L8"><b>3.8 Test like a mail-order man.</b></a> <span class="muted">· 🎧 1:25</span></li><li><a href="#m03/L9"><b>3.9 Worked example: the five fundamentals as a cold-email checklist.</b></a> <span class="muted">· 🎧 1:44</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://books.google.com/books/about/How_to_Write_a_Good_Advertisement.html?id=qN4JAQAAMAAJ" target="_blank" rel="noopener">How to Write a Good Advertisement (Harper, 1962), Google Books listing</a></li><li><a href="https://www.scientificadvertising.com/authors/schwab/" target="_blank" rel="noopener">Victor Schwab profile (Scientific Advertising site)</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 3.1<button class="ts" data-t="39.20" title="Play the audio from here">▶ 0:39</button><label class="readchk"><input type="checkbox" data-k="3-1"> Mark as done</label></div><h2 data-t="39.20"><span class="num">3.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Start from the hard truth: nobody wants to read your ad.</span></h2></header><p data-say data-t="44.14">Schwab&#x27;s starting premise is uncomfortable and useful. People do not want to read advertising. They are busy, they are reading or scrolling for something else, and your ad is an interruption. Every word has to earn the next second of attention.</p><p data-say data-t="60.03">He liked a line he credited to the newspaper editor Arthur Brisbane: make your writing easier to read than to skip. That is the whole job in eight words. If reading your ad takes effort, people skip it. If skipping it feels like missing something useful, they read.</p><p data-say data-t="77.17">This premise kills a lot of bad habits at once. Clever wordplay that needs a second look. Long warm-up sentences before the point. Brand stories nobody asked for. All of them assume the reader is patient. The reader is not.</p><p data-say data-t="92.48">On Meta the premise is even harsher. The thumb is already moving. You are competing with friends&#x27; photos, news and creators who are fun to watch. Your opening has to give a reason to stop that is about the reader, in about the time it takes to read one short line.</p><aside class="co co-example" data-t="109.86"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Easier to read than to skip.</div><p data-say>Hard to read: &quot;In a world where hydration meets design, a new standard emerges.&quot; Easy to read and hard to skip: &quot;Still carrying sparkling water home every week? There&#x27;s a lighter way.&quot; The second asks about the reader&#x27;s actual life, in plain words, and promises a fix.</p></aside><aside class="co co-agency" data-t="133.71"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Read your opening line and ask Schwab&#x27;s question: is this easier to read than to skip? If it needs a second look to understand, rewrite it. Delete every warm-up sentence in your cold emails. Start with the reason they should care.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 3.2<button class="ts" data-t="149.70" title="Play the audio from here">▶ 2:30</button><label class="readchk"><input type="checkbox" data-k="3-2"> Mark as done</label></div><h2 data-t="149.70"><span class="num">3.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Fundamental one: get attention with the advantage itself.</span></h2></header><p data-say data-t="155.09">Schwab&#x27;s first fundamental is to get attention. But he is clear about how: the strongest headline offers the reader an advantage, a gain they want. Tricks, puns and shock can grab attention, but they attract the wrong attention and then the ad has to start over.</p><p data-say data-t="172.37">His book gives a long list of headlines that worked for him and his clients, and almost all of them say what the reader gets. The best ones are things people already want: more money, better health, saving time, being liked, avoiding embarrassment.</p><p data-say data-t="188.45">Attention with the advantage also selects the right reader. Only people who want that gain will stop. That is good, because they are the only people who can buy.</p><p data-say data-t="198.58">A practical test: cover everything except the headline, show it to someone, and ask them what they get. If they cannot answer, the headline is not doing Schwab&#x27;s job.</p><aside class="co co-example" data-t="210.00"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Advantage versus trick.</div><p data-say>Trick: &quot;Bubble trouble?&quot; Advantage: &quot;Make a full day of sparkling water before breakfast, without a plug.&quot; The trick is a pun that tells nobody anything. The advantage line tells exactly who should keep reading and why.</p></aside><aside class="co co-agency" data-t="229.04"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For every hook you write, say out loud what the reader gets in five words. If you can&#x27;t, the advantage is missing. Put that advantage into the first frame of the video and the first line of text.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 3.3<button class="ts" data-t="243.89" title="Play the audio from here">▶ 4:04</button><label class="readchk"><input type="checkbox" data-k="3-3"> Mark as done</label></div><h2 data-t="243.89"><span class="num">3.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Fundamental two: show people what&#x27;s in it for them.</span></h2></header><p data-say data-t="248.69">Getting attention is not enough. Schwab&#x27;s second fundamental is to show people an advantage clearly, so they understand how their life gets better. Features describe the product. Advantages describe the reader&#x27;s life after they own it.</p><p data-say data-t="264.50">The classic move is to translate every feature into a &quot;which means&quot;. The product has a steel body, which means it still looks good on your counter in five years. It needs no electricity, which means you can put it anywhere and never hunt for a socket.</p><p data-say data-t="280.44">Schwab also points out that people buy for a few deep wants that repeat across products: gain, comfort, praise, pride, safety, saving time and avoiding pain or loss. The skill is to connect the feature to one of those wants, in the reader&#x27;s own words.</p><p data-say data-t="298.78">Be careful not to list twenty advantages with equal weight. Lead with the one that matters most to this buyer, and let the others support it.</p><aside class="co co-example" data-t="308.18"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Feature to advantage.</div><p data-say>Feature: &quot;3-year warranty when registered.&quot; Advantage: &quot;If anything breaks in the first three years, it&#x27;s covered, so the only thing you buy again is gas.&quot; The fact stays the same. The second version is about the reader&#x27;s peace of mind.</p></aside><aside class="co co-agency" data-t="326.78"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Take the feature list from a client&#x27;s product page and add &quot;which means&quot; after every feature. Pick the one advantage that buyers mention most in reviews. That is your lead benefit. Everything else becomes a supporting bullet.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 3.4<button class="ts" data-t="342.67" title="Play the audio from here">▶ 5:43</button><label class="readchk"><input type="checkbox" data-k="3-4"> Mark as done</label></div><h2 data-t="342.67"><span class="num">3.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Fundamental three: prove it.</span></h2></header><p data-say data-t="346.46">Readers do not believe ads by default. Schwab&#x27;s third fundamental is proof: give the reader reasons to believe the advantage is real. A claim without proof is just a hope.</p><p data-say data-t="358.70">Proof comes in a few forms. Facts and figures. Tests and demonstrations. Testimonials from real people. Endorsements from credible sources. Guarantees that put the risk on the seller. The strongest ads stack more than one.</p><p data-say data-t="375.02">Schwab favoured specific proof. &quot;Thousands of satisfied customers&quot; is weaker than a named person with a specific result. A guarantee with exact terms is stronger than &quot;satisfaction guaranteed&quot;.</p><p data-say data-t="389.61">In video, proof is often a demonstration. Show the product doing the thing. Show the before and after. Show the real review on screen. A two-second demonstration can carry more proof than a paragraph.</p><aside class="co co-example" data-t="404.20"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Stacked proof.</div><p data-say>For a carbonator: the fact (up to sixty litres per cylinder, from the product page), the test (more than ten thousand carbonation cycles), the social proof (87 percent of 760 reviews on the brand&#x27;s site give five stars), and the guarantee (three-year warranty when registered). Four kinds of proof, each one checkable.</p></aside><aside class="co co-agency" data-t="428.66"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>After you write your claim, list three kinds of proof you have for it. If you have none, either find some or soften the claim. In a cold email, your proof is a specific example of work, or a specific observation about their ads. Never claim results you did not get.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 3.5<button class="ts" data-t="447.43" title="Play the audio from here">▶ 7:27</button><label class="readchk"><input type="checkbox" data-k="3-5"> Mark as done</label></div><h2 data-t="447.43"><span class="num">3.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Fundamental four: help them grasp the advantage and feel it.</span></h2></header><p data-say data-t="453.30">Schwab&#x27;s fourth fundamental is to persuade people to grasp the advantage. Showing an advantage is logic. Grasping it is feeling. The reader has to picture themselves enjoying the gain, or feel what they lose by doing nothing.</p><p data-say data-t="468.33">He describes this as making the reader want the advantage now, not someday. Descriptions of the experience help. So do comparisons that make the value obvious, and reminders of what waiting costs.</p><p data-say data-t="482.39">There are two directions. Paint the gain: what their mornings look like with the product. Or show the loss of not acting: the price of staying the same. Both work. Most good ads use both, with the gain getting the last word.</p><p data-say data-t="497.39">This is also where tone matters. Persuasion is not pressure. It is helping the reader see something they already half want, clearly enough that acting feels natural.</p><aside class="co co-example" data-t="509.08"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Picture it.</div><p data-say>&quot;Imagine a cold glass of fizzy water the moment you get home, without a shop run, without a bottle to recycle.&quot; Then the cost of waiting: &quot;Every week without it is another trip carrying bottles you don&#x27;t need.&quot; Gain, loss, and the gain gets the final line.</p></aside><aside class="co co-agency" data-t="529.48"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>In a video script, add one line that starts with &quot;Imagine&quot; or shows the moment of use in close-up. In a cold email, help the reader picture the result: &quot;Picture your next Monday report with three fresh hooks already tested.&quot;</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 3.6<button class="ts" data-t="545.63" title="Play the audio from here">▶ 9:06</button><label class="readchk"><input type="checkbox" data-k="3-6"> Mark as done</label></div><h2 data-t="545.63"><span class="num">3.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Fundamental five: ask for action, clearly and now.</span></h2></header><p data-say data-t="551.51">The fifth fundamental is the one most ads skip: ask for the action. Tell the reader exactly what to do, make it easy, and give a reason to do it now.</p><p data-say data-t="562.57">Schwab came from coupon advertising, where the ad ended with a form the reader could cut out and mail. That forced clarity. There was one action, it was obvious, and the coupon was coded so the agency knew which ad produced it.</p><p data-say data-t="577.81">The modern version is the call to action. But &quot;Learn more&quot; on its own is weak, because it gives no reason. A strong close restates the advantage, removes the risk, and gives a real reason for now, such as a limited offer, a seasonal deadline, or simply the cost of waiting.</p><p data-say data-t="597.54">Do not fake urgency. Fake countdowns and fake stock warnings break trust and can break ad policies too. A true reason for now is always available if you think about the buyer&#x27;s life.</p><aside class="co co-example" data-t="610.91"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A close that acts.</div><p data-say>Weak: &quot;Learn more.&quot; Strong: &quot;Order the starter kit today. Registered machines get a three-year warranty. Your first sixty litres start this week.&quot; The action, the risk reversal and the reason for now, all true.</p></aside><aside class="co co-agency" data-t="629.22"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>End every ad and every cold email with one clear next step. For a cold email that is one small yes: &quot;Reply &#x27;send&#x27; and I&#x27;ll email you the three hooks.&quot; Never two asks in the same email.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 3.7<button class="ts" data-t="645.01" title="Play the audio from here">▶ 10:45</button><label class="readchk"><input type="checkbox" data-k="3-7"> Mark as done</label></div><h2 data-t="645.01"><span class="num">3.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Hold the reader all the way down.</span></h2></header><p data-say data-t="649.06">Schwab devotes a whole part of his book to keeping people reading, with a long list of ways to hold attention once you have it. Several are mechanical, and you can use them today.</p><p data-say data-t="660.68">He calls the subhead lowly, and defends it. Subheads let a skimmer see the whole argument in a few seconds, and pull them back into the copy at the part they care about. Short paragraphs look easy. Specific examples hold attention better than general statements. Questions the reader is already asking keep them going.</p><p data-say data-t="682.18">He also argued for enough copy to make the sale. Long copy is not a problem when every line is interesting to the right reader. Boring copy is the problem, at any length.</p><p data-say data-t="695.29">On a landing page, a carousel or a long cold email, these rules decide whether the reader gets to the call to action.</p><aside class="co co-example" data-t="703.78"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Subheads as a skim path.</div><p data-say>A landing page with these subheads tells the whole story to someone who reads nothing else: &quot;No more carrying bottles.&quot; &quot;Sixty litres per cylinder.&quot; &quot;No plug needed.&quot; &quot;Tested for ten thousand cycles.&quot; &quot;Three-year warranty.&quot; &quot;Order the starter kit.&quot;</p></aside><aside class="co co-agency" data-t="725.96"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Read only the subheads, bullets and bold lines on your page or carousel. Do they make the full argument by themselves? If not, rewrite them until they do. In emails, keep paragraphs to three lines or fewer.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 3.8<button class="ts" data-t="743.12" title="Play the audio from here">▶ 12:23</button><label class="readchk"><input type="checkbox" data-k="3-8"> Mark as done</label></div><h2 data-t="743.12"><span class="num">3.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Test like a mail-order man.</span></h2></header><p data-say data-t="746.33">Schwab&#x27;s agency lived on keyed coupons and split-run tests, where two versions of an ad ran in the same publication and the orders were counted. That is how he knew which headlines worked.</p><p data-say data-t="759.08">The best-known example concerns his old boss&#x27;s ad. According to the account on Wikipedia, Schwab compared &quot;Do You Make These Mistakes In English?&quot; with an alternative headline, &quot;How to Speak and Write Masterly English&quot;, and found the mistakes headline pulled close to three times more over the years compared. The headline that named the reader&#x27;s fear of embarrassment beat the headline that described the course.</p><p data-say data-t="784.66">The lesson is not that fear always wins. It is that you do not know until you test, and that the reader&#x27;s feelings often beat your product description.</p><aside class="co co-example" data-t="795.34"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The modern split-run.</div><p data-say>On Meta you can run the same ad with two headlines, a fear-of-embarrassment hook and a description hook, to the same audience with the same budget. The cost per purchase gives you Schwab&#x27;s answer in days, not years.</p></aside><aside class="co co-agency" data-t="811.52"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before you say which headline is better, ask: what would a split-run say? Write the two versions, run them, and keep a log. Your cold-email equivalent is to send two subject lines to two small batches and compare reply rates.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 3.9<button class="ts" data-t="828.58" title="Play the audio from here">▶ 13:49</button><label class="readchk"><input type="checkbox" data-k="3-9"> Mark as done</label></div><h2 data-t="828.58"><span class="num">3.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Worked example: the five fundamentals as a cold-email checklist.</span></h2></header><p data-say data-t="834.79">Here is the five-step checklist turned into a cold email to a DTC brand&#x27;s marketing lead. Watch how each fundamental becomes one or two lines.</p><p data-say data-t="845.18">Attention with the advantage: the subject line offers something they want. &quot;3 new hooks for your Carbonator ads, from your reviews.&quot; Show the advantage: the first line says what it means for them. &quot;Your reviews keep mentioning not carrying bottles, and I couldn&#x27;t find that angle in your current ads.&quot;</p><p data-say data-t="864.58">Prove it: one specific observation and one example. &quot;Here is one hook I wrote from a five-star review.&quot; Help them grasp it: &quot;If it beats your current opener, that&#x27;s a lower cost per purchase on the same budget.&quot; Ask for action: one small, easy step. &quot;Want the other two? Reply &#x27;send&#x27;.&quot;</p><p data-say data-t="884.04">Nothing in that email is about you until they ask. It follows Schwab line by line, and it is short enough to read on a phone between meetings.</p><aside class="co co-example" data-t="893.71"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>The finished email.</div><p data-say>Subject: 3 hooks for your Carbonator ads. Body: &quot;Your reviews keep saying people love not carrying bottles home. I couldn&#x27;t find that angle in your current Meta ads. Here&#x27;s one hook I wrote from a five-star review: &#x27;Never carry sparkling water home again.&#x27; Want the other two? Reply &#x27;send&#x27;. Oskar.&quot;</p></aside><aside class="co co-agency" data-t="916.30"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write one cold email this week using the five fundamentals as a checklist, one or two lines each. Read it aloud. If any line is about you instead of them, cut it. Remember the standing rule: you send it yourself.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="932.47">That&#x27;s the end of Module 3. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Nobody wants to read ads. Make yours easier to read than to skip.</li><li>1 Attention: lead with the advantage, not a trick.</li><li>2 Show the advantage: feature, &quot;which means&quot;, reader&#x27;s life.</li><li>3 Prove it: facts, tests, real testimonials, guarantees, demos.</li><li>4 Help them grasp it: picture the gain, feel the cost of waiting.</li><li>5 Ask for action: one clear step, risk removed, true reason for now.</li><li>Subheads and short paragraphs carry skimmers to the close.</li><li>Split-run everything. Feelings often beat descriptions.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 9 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="3"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 9 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://books.google.com/books/about/How_to_Write_a_Good_Advertisement.html?id=qN4JAQAAMAAJ" target="_blank" rel="noopener">How to Write a Good Advertisement (Harper, 1962), Google Books</a></li><li><a href="https://www.scientificadvertising.com/authors/schwab/" target="_blank" rel="noopener">Victor Schwab profile and background</a></li><li><a href="https://en.wikipedia.org/wiki/Sherwin_Cody" target="_blank" rel="noopener">Sherwin Cody (Sackheim&#x27;s ad, Schwab&#x27;s headline comparison)</a></li><li><a href="https://www.aarke.com/" target="_blank" rel="noopener">Aarke facts (product page, read Nov 2026)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m02"><small>← Previous</small>Module 2: Tested Advertising Methods</a><a class="nx" href="#m04"><small>Next →</small>Module 4: The Gary Halbert Letter</a></nav></article></main></template>
<template id="v-m04" data-cls="chpage hasaudio" data-title="Module 4: The Gary Halbert Letter · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 4</b> <span>The Gary Halbert Letter</span></div><div class="tb-r"><a class="ib" href="#m05" title="Next: Module 5">5 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m04-the-gary-halbert-letter.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 4 · Contents</div><div class="tc-t">The Gary Halbert Letter</div><ol class="tc"><li><a href="#m04/glance">At a glance</a></li><li class="l2"><a href="#m04/L1"><span class="n">4.1</span> Get the skill into your hands: copy great ads out by hand.</a></li><li class="l2"><a href="#m04/L2"><span class="n">4.2</span> Build a swipe file and feed it every day.</a></li><li class="l2"><a href="#m04/L3"><span class="n">4.3</span> Study the product until the selling idea falls out.</a></li><li class="l2"><a href="#m04/L4"><span class="n">4.4</span> Shuffle the headlines, then find the central selling idea.</a></li><li class="l2"><a href="#m04/L5"><span class="n">4.5</span> Write the first draft fast. Forget form. Forget grammar.</a></li><li class="l2"><a href="#m04/L6"><span class="n">4.6</span> Rework it into the seven steps.</a></li><li class="l2"><a href="#m04/L7"><span class="n">4.7</span> Read it aloud, then tighten.</a></li><li class="l2"><a href="#m04/L8"><span class="n">4.8</span> Use a grabber, but tie it to the message.</a></li><li class="l2"><a href="#m04/L9"><span class="n">4.9</span> Tell a story, and sell yourself the same way.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m04/quiz">✅ Questions (10)</a></li><li><a href="#m04/play">🛠️ Playground (3)</a></li><li><a href="#m04/cards">🃏 Lesson cards (9)</a></li><li><a href="#m04/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04" aria-current="page"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Gary Halbert · newsletters 1980s to 2000s</div><h1 data-t="0.30"><span class="chn">Module 4</span><span data-say>The Gary Halbert Letter</span> <span class="h1sub" data-say>by Gary C. Halbert</span></h1><div class="lead"><p data-say data-t="5.77">Gary Halbert wrote some of the most mailed sales letters in history, and for years he taught copywriting in a newsletter, The Gary Halbert Letter. The back issues are free on his family&#x27;s website. This module takes the method that runs through them, from the issue where he explains exactly how to become a top copywriter. It is the spine of this whole course. You will use every step again in the workbook in Module 12.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 16:30</span><span>9 lessons</span><span>10 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m04/L1"><b>4.1 Get the skill into your hands: copy great ads out by hand.</b></a> <span class="muted">· 🎧 1:58</span></li><li><a href="#m04/L2"><b>4.2 Build a swipe file and feed it every day.</b></a> <span class="muted">· 🎧 1:49</span></li><li><a href="#m04/L3"><b>4.3 Study the product until the selling idea falls out.</b></a> <span class="muted">· 🎧 1:40</span></li><li><a href="#m04/L4"><b>4.4 Shuffle the headlines, then find the central selling idea.</b></a> <span class="muted">· 🎧 1:45</span></li><li><a href="#m04/L5"><b>4.5 Write the first draft fast. Forget form. Forget grammar.</b></a> <span class="muted">· 🎧 1:44</span></li><li><a href="#m04/L6"><b>4.6 Rework it into the seven steps.</b></a> <span class="muted">· 🎧 1:56</span></li><li><a href="#m04/L7"><b>4.7 Read it aloud, then tighten.</b></a> <span class="muted">· 🎧 1:38</span></li><li><a href="#m04/L8"><b>4.8 Use a grabber, but tie it to the message.</b></a> <span class="muted">· 🎧 1:43</span></li><li><a href="#m04/L9"><b>4.9 Tell a story, and sell yourself the same way.</b></a> <span class="muted">· 🎧 1:35</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">Halbert&#x27;s &quot;Hands On Experience&quot; issue: the method this course follows</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zdzz_the_suck.htm" target="_blank" rel="noopener">&quot;The Suck&quot; issue</a></li><li><a href="https://thegaryhalbertletter.com/newsletters/zakk_grabbers.htm" target="_blank" rel="noopener">&quot;Grabbers&quot; issue</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 4.1<button class="ts" data-t="32.51" title="Play the audio from here">▶ 0:33</button><label class="readchk"><input type="checkbox" data-k="4-1"> Mark as done</label></div><h2 data-t="32.51"><span class="num">4.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>Get the skill into your hands: copy great ads out by hand.</span></h2></header><p data-say data-t="38.55">In the issue on hands-on experience, Halbert lays out a reading list: Hopkins, Collier, Caples, Schwab, the Boron Letters, Schwartz and others. Read them fast first, he says, without stopping to take notes. Then do the strange part. Copy the great ads out in your own handwriting.</p><p data-say data-t="58.30">Why by hand? Because reading an ad and writing an ad are different skills. When you copy a winning ad word by word, you feel its rhythm: where the sentences get short, where the story turns, where the offer lands. The patterns move from your eyes into your fingers. You stop admiring and start absorbing.</p><p data-say data-t="79.38">Then reread the books, slowly this time, and take notes, hundreds of them. Halbert&#x27;s point is that no single trick makes a copywriter. Volume does. Thousands of good sentences passing through your hand build an instinct you cannot get from summaries.</p><p data-say data-t="96.97">This is why Module 11 has a type-out pad with a timer. Typing is not quite the same as handwriting, but the principle holds: go slowly, word by word, and notice every choice the writer made.</p><aside class="co co-example" data-t="111.39"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Twenty minutes a day.</div><p data-say>Pick one classic ad. Set a timer for twenty minutes. Copy it word for word, by hand or in the type-out pad. When the timer ends, write three sentences about what you noticed: the shortest sentence, the turn, the ask. A month of this is about thirty ads.</p></aside><aside class="co co-agency" data-t="132.80"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Start today with one ad from Module 11. Do it before you write anything for a client, as a warm-up. Do the same with a winning Meta ad from the Ad Library: copy the script out by hand, then mark the hook, the proof and the call to action.</p></aside></section><section class="sec" id="L2" data-sec="2"><header class="sh"><div class="sk">Lesson 4.2<button class="ts" data-t="150.06" title="Play the audio from here">▶ 2:30</button><label class="readchk"><input type="checkbox" data-k="4-2"> Mark as done</label></div><h2 data-t="150.06"><span class="num">4.2</span> <span class="lsay" data-say>Lesson 2.</span> <span data-say>Build a swipe file and feed it every day.</span></h2></header><p data-say data-t="154.92">Halbert told his students to collect headlines everywhere: tabloid covers, women&#x27;s magazine cover lines, books of headlines such as Jay Abraham&#x27;s collection. He suggested writing them on index cards and keeping them in shoe boxes, because the physical act of writing and sorting made them stick.</p><p data-say data-t="174.75">A swipe file is not for copying. It is raw material for your own ideas. When you start a project, you shuffle through hundreds of headlines and your mind starts to make connections between the old patterns and the new product.</p><p data-say data-t="188.84">He shows how this works with a famous ad. The old headline &quot;Do You Make These Mistakes In English?&quot; becomes, in his example, &quot;Do You Say Any Of These Dumb Things Every Time You Call Your Stockbroker?&quot; The structure is borrowed. The product, the reader and the fear are completely new.</p><p data-say data-t="207.84">Today your swipe file should also include ads. Save screenshots of Meta ads that have been running for months, because a long-running ad is usually a profitable one. Write the hook of each one on a card.</p><aside class="co co-example" data-t="221.48"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Pattern, not plagiarism.</div><p data-say>Old pattern: &quot;How to ... without ...&quot; New line for a carbonator: &quot;How to drink a litre of sparkling water a day without carrying a single bottle.&quot; The pattern is public domain. The words, product and promise are yours.</p></aside><aside class="co co-agency" data-t="239.19"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Start a swipe file today in the Module 12 workbook. Add ten headlines from a magazine cover or a news site, and five hooks from long-running ads in the Meta Ad Library. Tag each one by pattern: how to, number, question, secret, news, story.</p></aside></section><section class="sec" id="L3" data-sec="3"><header class="sh"><div class="sk">Lesson 4.3<button class="ts" data-t="258.82" title="Play the audio from here">▶ 4:19</button><label class="readchk"><input type="checkbox" data-k="4-3"> Mark as done</label></div><h2 data-t="258.82"><span class="num">4.3</span> <span class="lsay" data-say>Lesson 3.</span> <span data-say>Study the product until the selling idea falls out.</span></h2></header><p data-say data-t="264.10">Halbert called the next step &quot;The Suck&quot;. Before he wrote a word, he would study a product from every angle and write down everything he learned as numbered notes. He called them nugget notes. In one issue he lists one hundred and fifteen of them for a single book.</p><p data-say data-t="280.15">He also studied the competition. What do the other ads promise? What do buyers complain about? What has not been said yet?</p><p data-say data-t="287.95">The notes are not the copy. They are the material. When you have enough of them, the right angle tends to stand out on its own, because one fact keeps coming back or one complaint keeps getting louder.</p><p data-say data-t="300.22">This step is what separates a professional from a word-spinner. Most weak copy is not badly written. It is under-researched. The writer did not know enough about the product to say anything specific.</p><aside class="co co-example" data-t="313.49"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Nugget notes for a carbonator.</div><p data-say>&quot;1. Up to sixty litres per cylinder. 2. No electricity. 3. Tested for over ten thousand cycles. 4. Reviewers praise the design. 5. The main complaint is the price. 6. Many reviewers mention no longer carrying bottles. 7. The three-year warranty requires registration...&quot; By note thirty you know what to say.</p></aside><aside class="co co-agency" data-t="343.22"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Before your next ad brief, write at least thirty numbered notes from the product page, the reviews, competitors&#x27; ads in the Ad Library, and forums like Reddit. Use the notes field in the Module 12 workbook so they stay with your draft.</p></aside></section><section class="sec" id="L4" data-sec="4"><header class="sh"><div class="sk">Lesson 4.4<button class="ts" data-t="359.28" title="Play the audio from here">▶ 5:59</button><label class="readchk"><input type="checkbox" data-k="4-4"> Mark as done</label></div><h2 data-t="359.28"><span class="num">4.4</span> <span class="lsay" data-say>Lesson 4.</span> <span data-say>Shuffle the headlines, then find the central selling idea.</span></h2></header><p data-say data-t="364.92">After the research, Halbert describes a ritual. He would take a break, then go back and shuffle through his headline cards, writing headlines for the new product in patterns like &quot;How to...&quot;, &quot;17 ways to...&quot;, &quot;An amazing...&quot; and &quot;A little secret that...&quot;.</p><p data-say data-t="379.80">Out of this comes what he called the central selling idea: the single idea the whole ad is built on. Often, he says, it becomes the headline or the first sentence of the letter. Everything else in the ad either supports it or gets cut.</p><p data-say data-t="396.02">A central selling idea is not a slogan. It is a promise specific enough to be tested. &quot;Bubbles for everyone&quot; is a slogan. &quot;Never carry sparkling water home again&quot; is a central selling idea: a concrete gain for a concrete person.</p><p data-say data-t="412.65">Getting this right is most of the job. A strong central selling idea in plain words beats a weak one in beautiful words every time.</p><aside class="co co-example" data-t="422.76"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>From cards to idea.</div><p data-say>Patterns shuffled for a carbonator: &quot;How to stop carrying bottles home.&quot; &quot;17 things you can make with a carbonator.&quot; &quot;A little secret Swedish kitchens share.&quot; &quot;An amazing amount of fizz from one small cylinder.&quot; Reading them together, the idea that keeps winning is the bottle-free life. That becomes the central selling idea.</p></aside><aside class="co co-agency" data-t="447.57"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write twenty headlines for your product using five patterns from your swipe file. Circle the one idea that keeps coming back. Write it as one sentence under twenty words, with the reader in it. That sentence is the brief for every ad you make.</p></aside></section><section class="sec" id="L5" data-sec="5"><header class="sh"><div class="sk">Lesson 4.5<button class="ts" data-t="464.59" title="Play the audio from here">▶ 7:45</button><label class="readchk"><input type="checkbox" data-k="4-5"> Mark as done</label></div><h2 data-t="464.59"><span class="num">4.5</span> <span class="lsay" data-say>Lesson 5.</span> <span data-say>Write the first draft fast. Forget form. Forget grammar.</span></h2></header><p data-say data-t="471.23">Halbert&#x27;s advice for the first draft is to write fast. In his words, &quot;Forget form. Forget grammar.&quot; Just get it all down. Rave about the product, describe it, tell the story, pile up the benefits, as fast as you can.</p><p data-say data-t="487.05">The reason is that editing and creating use different parts of your mind. If you try to write perfect sentences the first time, you will freeze, or you will write careful, lifeless copy. Speed lets the enthusiasm come through.</p><p data-say data-t="502.84">Then he says to let it cool. Step away from the draft. When you come back, you see it with fresh eyes and can tell what works.</p><p data-say data-t="511.26">This is the opposite of how most people write ads. They write one line, delete it, write it again, and after an hour have three polished sentences and no energy. Halbert&#x27;s way produces a messy, energetic draft that is easy to fix.</p><aside class="co co-example" data-t="529.00"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A ten-minute draft.</div><p data-say>Set a timer. Write as if you are telling a friend why they need a carbonator: &quot;OK, so here&#x27;s the thing. I used to carry sparkling water home every week. Heavy bags. Then I got this. Sixty litres from one cylinder. No plug...&quot; It reads badly. That is fine. The energy is there, and the facts are in.</p></aside><aside class="co co-agency" data-t="553.50"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Use the ten-minute timer in the Module 12 workbook. Turn on no-delete mode so you cannot go back. Write the whole ad or email in one go. Do not edit until the timer ends and you have taken a break.</p></aside></section><section class="sec" id="L6" data-sec="6"><header class="sh"><div class="sk">Lesson 4.6<button class="ts" data-t="568.77" title="Play the audio from here">▶ 9:29</button><label class="readchk"><input type="checkbox" data-k="4-6"> Mark as done</label></div><h2 data-t="568.77"><span class="num">4.6</span> <span class="lsay" data-say>Lesson 6.</span> <span data-say>Rework it into the seven steps.</span></h2></header><p data-say data-t="572.84">Now you have energy and facts on the page. Halbert&#x27;s next step is to rework the draft into a structure. In the hands-on issue, he gives it as seven steps.</p><p data-say data-t="583.98">One: say something that gets attention. Two: tell them why they should be interested, which is where you expand on the central selling idea. Three: tell them why they should believe what you are saying is true. Four: prove it. Five: itemize and describe all the benefits. Six: tell them how to order. Seven: tell them to order now.</p><p data-say data-t="605.63">These steps work for a twelve-page sales letter and for a thirty-second video. In a short ad, each step may be one line or one shot. The order is what matters: you earn attention before you explain, explain before you prove, prove before you ask.</p><p data-say data-t="623.32">Notice that the steps include both &quot;why believe&quot; and &quot;prove&quot;. Halbert separates the reason to believe, such as who you are and why this works, from the proof itself, such as the test result, demonstration or testimonial.</p><aside class="co co-example" data-t="638.82"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Seven steps, thirty seconds.</div><p data-say>1 &quot;Still carrying sparkling water home?&quot; 2 &quot;Make it at your tap instead, never carry a bottle again.&quot; 3 &quot;It&#x27;s mechanical, no plug and no batteries.&quot; 4 &quot;Tested for over ten thousand cycles.&quot; 5 &quot;Up to sixty litres per cylinder. Steel body. Three-year warranty when registered.&quot; 6 &quot;Tap to order the starter kit.&quot; 7 &quot;Start this week.&quot;</p></aside><aside class="co co-agency" data-t="669.68"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Take your fast draft and sort every sentence under one of the seven steps. Cut sentences that fit nowhere. Fill steps that are empty. The workbook in Module 12 checks each step for you.</p></aside></section><section class="sec" id="L7" data-sec="7"><header class="sh"><div class="sk">Lesson 4.7<button class="ts" data-t="684.76" title="Play the audio from here">▶ 11:25</button><label class="readchk"><input type="checkbox" data-k="4-7"> Mark as done</label></div><h2 data-t="684.76"><span class="num">4.7</span> <span class="lsay" data-say>Lesson 7.</span> <span data-say>Read it aloud, then tighten.</span></h2></header><p data-say data-t="688.90">After restructuring, Halbert says to edit, and then to read the copy aloud. Your ear catches what your eye skips: sentences that are too long, words that trip you up, places where the rhythm dies.</p><p data-say data-t="702.85">Then tighten. He likes short sentences and short paragraphs. Sometimes one-word sentences. Subheads that carry the skimmer through. The goal is copy that is easy to read, like a letter from a friend, not a corporate brochure.</p><p data-say data-t="719.22">Tightening is mostly cutting. Every word that does not move the reader towards the sale goes. Adjectives without facts go. Throat-clearing goes. &quot;In order to&quot; becomes &quot;to&quot;.</p><p data-say data-t="731.72">This step matters even more in video. If you are writing a script for a creator, reading it aloud is the only way to know if a real person can say it naturally in fifteen seconds.</p><aside class="co co-example" data-t="744.27"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>Before and after tightening.</div><p data-say>Before: &quot;Our carbonator is designed in order to provide you with a convenient way to enjoy premium sparkling water at home.&quot; After: &quot;Sparkling water from your tap. No bottles. No plug.&quot; Twenty words became eight, and every one does a job.</p></aside><aside class="co co-agency" data-t="764.98"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Read your ad aloud with a timer. If a fifteen-second script takes twenty seconds, cut until it fits. Use the read-aloud and tighten report in the Module 12 workbook: it flags long sentences, vague words and passive voice.</p></aside></section><section class="sec" id="L8" data-sec="8"><header class="sh"><div class="sk">Lesson 4.8<button class="ts" data-t="783.03" title="Play the audio from here">▶ 13:03</button><label class="readchk"><input type="checkbox" data-k="4-8"> Mark as done</label></div><h2 data-t="783.03"><span class="num">4.8</span> <span class="lsay" data-say>Lesson 8.</span> <span data-say>Use a grabber, but tie it to the message.</span></h2></header><p data-say data-t="787.52">In the Grabbers issue, Halbert describes an old direct-mail trick: attach a physical object to the top of the letter. A dollar bill, a penny, a stamp, a small bag of sand, a photo. People cannot ignore an object stuck to a letter.</p><p data-say data-t="803.64">But he is firm that the grabber has to connect to the message. The letter must explain why the object is there, and that explanation has to lead into the sales argument. A random gimmick gets attention and then loses it.</p><p data-say data-t="817.54">He quotes a famous example from Robert Collier&#x27;s Letter Book, a letter with a dollar bill attached, and the very high response the book reports for it. The point was not the money. The point was that the dollar made the reader curious, and the letter&#x27;s first line explained it in a way that led into the request.</p><p data-say data-t="836.69">The modern grabber is the visual pattern break in the first second of a video: an unexpected object, a demonstration, a strange action. Same rule: it must connect to the message.</p><aside class="co co-example" data-t="849.24"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A digital grabber.</div><p data-say>Opening shot: a pile of empty plastic bottles collapsing. Text: &quot;This is one year of sparkling water for a family that drinks a litre a day.&quot; Then the carbonator. The grabber stops the scroll, and it is the argument, not a random stunt.</p></aside><aside class="co co-agency" data-t="868.80"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>For your next video brief, write one opening visual that would make someone stop and ask &quot;why is that there?&quot;, then write the line that answers the question and leads into your central selling idea. If the answer doesn&#x27;t lead into the sale, choose another grabber.</p></aside></section><section class="sec" id="L9" data-sec="9"><header class="sh"><div class="sk">Lesson 4.9<button class="ts" data-t="886.18" title="Play the audio from here">▶ 14:46</button><label class="readchk"><input type="checkbox" data-k="4-9"> Mark as done</label></div><h2 data-t="886.18"><span class="num">4.9</span> <span class="lsay" data-say>Lesson 9.</span> <span data-say>Tell a story, and sell yourself the same way.</span></h2></header><p data-say data-t="890.93">In his issue on AIDA, Halbert says the hardest part of writing is getting started, and that the most often missing ingredient in copy is an interesting story. Facts tell. Stories pull the reader along.</p><p data-say data-t="904.25">He gives openings like a letter that starts with a person&#x27;s name and an admission, such as: &quot;My name is Betty Adams and, the first thing you should know about me is... I am not a doctor.&quot; Instantly you want to know who she is and why she is writing.</p><p data-say data-t="920.71">He also adds a lesson for you personally. A copywriter should be able to sell themselves. And, he says, the legends talk about numbers, not awards. Clients care what your copy sold.</p><p data-say data-t="933.14">That applies directly to your job hunt. Your cold emails and your portfolio are sales letters for you. Lead with a story or a specific result, not a list of skills.</p><aside class="co co-example" data-t="945.46"><div class="co-l"><span class="ci" aria-hidden="true">🏢</span> <span data-say>Example:</span></div><div class="co-h" data-say>A story opening for a creator ad.</div><p data-say>&quot;Okay, confession: I used to be the person carrying twelve bottles of sparkling water up four flights of stairs every week.&quot; One line, a real situation, a person, and you want to know how it ends.</p></aside><aside class="co co-agency" data-t="962.45"><div class="co-l"><span class="ci" aria-hidden="true">🛠️</span> <span data-say>Use it today.</span></div><p data-say>Write the first line of your next ad as a confession or a small story. Then write the first line of your portfolio site the same way, about a piece of work and what it did. If you don&#x27;t have results yet, describe a spec test you designed and what you expect to learn from it. Never invent numbers.</p></aside></section><section class="sec recap" id="end"><p class="muted endline" data-say data-t="981.62">That&#x27;s the end of Module 4. Now put it to work: answer the questions, then do the playground drill.</p><aside class="co co-sum"><div class="co-l"><span class="ci">📌</span> Cheat sheet (not narrated)</div><ul><li>Copy great ads by hand, slowly. Volume builds instinct.</li><li>Keep a swipe file of headlines and long-running ads; borrow patterns, not words.</li><li>The Suck: thirty-plus numbered nugget notes before you write.</li><li>Shuffle headline patterns until the central selling idea falls out.</li><li>Fast first draft: forget form, forget grammar. Then let it cool.</li><li>Seven steps: attention, interest, believe, prove, benefits, how to order, order now.</li><li>Read aloud and tighten: short sentences, cut every word that doesn&#x27;t sell.</li><li>Grabbers must lead into the message. Stories beat lists.</li></ul></aside></section><div class="practice-h"><h2>Do it: questions and playground</h2><p class="muted">Not narrated. Questions test whether you can apply the lessons; the playground makes you write. Everything is saved in this browser, and you can practise as often as you like.</p></div><details class="practice" id="quiz" open><summary><span class="pi">✅</span> Application questions <span class="muted">· 10 questions · best <b id="qbest">0%</b></span></summary><div class="pb"><p class="muted small">One question at a time. Answer, read why, then press <b>Next</b> (or Enter). Keys 1-4 pick an answer. Target 80%+. Unlimited retries, new order each time.</p><div id="quizbox"></div></div></details><details class="practice" id="play" open><summary><span class="pi">🛠️</span> Playground <span class="muted">· 3 drills</span></summary><div class="pb"><div id="playbox" data-n="4"></div></div></details><details class="practice" id="cards"><summary><span class="pi">🃏</span> Lesson cards <span class="muted">· 9 cards</span></summary><div class="pb"><p class="muted small">Front: the lesson. Back: how to use it today. Click or press Space to flip.</p><div id="deck"></div></div></details><details class="practice" id="sources"><summary><span class="pi">🔗</span> Sources for this module</summary><div class="pb"><ul class="srcl"><li><a href="https://www.thegaryhalbertletter.com/newsletters/zfkj_hands_on_experience.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;Hands On Experience&quot; (the method)</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zdzz_the_suck.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;The Suck&quot; (nugget notes)</a></li><li><a href="https://thegaryhalbertletter.com/newsletters/zakk_grabbers.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;Grabbers&quot;</a></li><li><a href="https://www.thegaryhalbertletter.com/newsletters/zszs_aida.htm" target="_blank" rel="noopener">The Gary Halbert Letter, &quot;AIDA&quot; (story openings)</a></li></ul><p class="muted small">All lessons are written in our own words. Quotes are short and attributed. No book text is reproduced.</p></div></details><nav class="pn" aria-label="Module navigation"><a class="pv" href="#m03"><small>← Previous</small>Module 3: How to Write a Good Advertisement</a><a class="nx" href="#m05"><small>Next →</small>Module 5: The Boron Letters</a></nav></article></main></template>
<template id="v-m05" data-cls="chpage hasaudio" data-title="Module 5: The Boron Letters · Halbert Copy Essentials"><header class="top"><div class="bar"><button class="ib menubtn" data-act="menu" aria-label="Open contents">☰</button><a class="brand" href="#index" title="Course home"><span class="logo">HC</span><span class="bt">Halbert Copy Essentials</span></a><div class="ttl"><b>Module 5</b> <span>The Boron Letters</span></div><div class="tb-r"><a class="ib" href="#m06" title="Next: Module 6">6 ›</a><button class="ib" data-act="fs-" title="Smaller text" aria-label="Smaller text">A−</button><button class="ib" data-act="fs+" title="Larger text" aria-label="Larger text">A+</button><button class="ib" data-act="theme" title="Light / dark" aria-label="Toggle dark mode">◐</button></div></div><div class="player" role="region" aria-label="Module audio"><button class="ib play" data-act="play" aria-label="Play or pause">▶</button><audio id="au" controls preload="metadata" src="audio/halbert-m05-the-boron-letters.mp3"></audio><select id="mk" aria-label="Jump to a lesson"></select><select id="spd" aria-label="Playback speed"><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.6">1.6×</option><option value="1.75">1.75×</option><option value="2">2×</option></select><label class="fol" title="Highlight and scroll to the paragraph being read"><input type="checkbox" id="follow" checked> Follow along</label></div><div class="prog" aria-hidden="true"><i></i></div></header><nav class="side toc" aria-label="Module contents"><div class="side-h">Module 5 · Contents</div><div class="tc-t">The Boron Letters</div><ol class="tc"><li><a href="#m05/glance">At a glance</a></li><li class="l2"><a href="#m05/L1"><span class="n">5.1</span> The first lesson isn&#x27;t about copy: look after the machine.</a></li><li class="l2"><a href="#m05/L2"><span class="n">5.2</span> Find the starving crowd before you write a word.</a></li><li class="l2"><a href="#m05/L3"><span class="n">5.3</span> Be a student of markets: watch what people buy, not what they say.</a></li><li class="l2"><a href="#m05/L4"><span class="n">5.4</span> Recent, frequent and the right price: the best prospects.</a></li><li class="l2"><a href="#m05/L5"><span class="n">5.5</span> Get into the A-pile.</a></li><li class="l2"><a href="#m05/L6"><span class="n">5.6</span> First impressions: give the reader&#x27;s eyes a rest.</a></li><li class="l2"><a href="#m05/L7"><span class="n">5.7</span> Attention, interest, desire, action: and the nugget notes behind it.</a></li><li class="l2"><a href="#m05/L8"><span class="n">5.8</span> Copy the great ads. Use small words and short sentences.</a></li><li class="l2"><a href="#m05/L9"><span class="n">5.9</span> Make a proposition, and give the reason why.</a></li><li class="l2"><a href="#m05/L10"><span class="n">5.10</span> Find the market first, then make it believable with specifics.</a></li></ol><div class="side-h">Do it</div><ol class="tc"><li><a href="#m05/quiz">✅ Questions (9)</a></li><li><a href="#m05/play">🛠️ Playground (3)</a></li><li><a href="#m05/cards">🃏 Lesson cards (10)</a></li><li><a href="#m05/sources">🔗 Sources</a></li></ol><details class="allch"><summary>All modules</summary><div class="pl">The foundations</div><a class="cl" data-n="1" href="#m01"><span class="n">1</span><span>Scientific Advertising <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="2" href="#m02"><span class="n">2</span><span>Tested Advertising Methods <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="3" href="#m03"><span class="n">3</span><span>How to Write a Good Advertisement <span class="muted small">· 16 min</span></span></a><div class="pl">Gary Halbert</div><a class="cl" data-n="4" href="#m04"><span class="n">4</span><span>The Gary Halbert Letter <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="5" href="#m05" aria-current="page"><span class="n">5</span><span>The Boron Letters <span class="muted small">· 16 min</span></span></a><div class="pl">The big three</div><a class="cl" data-n="6" href="#m06"><span class="n">6</span><span>Breakthrough Advertising <span class="muted small">· 18 min</span></span></a><a class="cl" data-n="7" href="#m07"><span class="n">7</span><span>The Adweek Copywriting Handbook <span class="muted small">· 16 min</span></span></a><a class="cl" data-n="8" href="#m08"><span class="n">8</span><span>Ogilvy on Advertising <span class="muted small">· 16 min</span></span></a><div class="pl">Letters and today&#x27;s ads</div><a class="cl" data-n="9" href="#m09"><span class="n">9</span><span>The Robert Collier Letter Book <span class="muted small">· 8 min</span></span></a><a class="cl" data-n="10" href="#m10"><span class="n">10</span><span>Modern Performance Creative <span class="muted small">· 17 min</span></span></a><div class="pl">Do the work</div><a class="cl" data-n="11" href="#m11"><span class="n">11</span><span>Six Classic Ads, Torn Down <span class="muted small">· 17 min</span></span></a><a class="cl" data-n="12" href="#m12"><span class="n">12</span><span>The Halbert Method Workbook <span class="muted small">· 16 min</span></span></a></details><div class="tools"><a href="#index">🏠 Course home</a><a href="#review">🃏 Review cards</a><a href="#sources">🔗 All sources</a><button data-act="reset">♻ Reset progress</button></div></nav><div class="scrim" data-act="menu"></div><main id="main" class="reader"><article class="prose"><div class="kicker">Gary Halbert · letters to his son · 1984</div><h1 data-t="0.30"><span class="chn">Module 5</span><span data-say>The Boron Letters</span> <span class="h1sub" data-say>by Gary C. Halbert</span></h1><div class="lead"><p data-say data-t="5.60">In 1984 Gary Halbert was serving time at the federal prison camp in Boron, California. From there he wrote a series of letters to his son Bond, teaching him how to sell by mail and how to live. The letters are short, warm and full of hard-won rules. They are free to read on the Halbert family&#x27;s site. This module takes the selling lessons that matter most for paid social and cold email today.</p></div><section class="glance" id="glance"><h2 class="gl-h">At a glance</h2><div class="stats"><span>🎧 16:29</span><span>10 lessons</span><span>9 questions</span><span>3 drills</span></div><div class="gl-sub">The lessons</div><ol class="gl-list"><li><a href="#m05/L1"><b>5.1 The first lesson isn&#x27;t about copy: look after the machine.</b></a> <span class="muted">· 🎧 1:49</span></li><li><a href="#m05/L2"><b>5.2 Find the starving crowd before you write a word.</b></a> <span class="muted">· 🎧 1:47</span></li><li><a href="#m05/L3"><b>5.3 Be a student of markets: watch what people buy, not what they say.</b></a> <span class="muted">· 🎧 1:30</span></li><li><a href="#m05/L4"><b>5.4 Recent, frequent and the right price: the best prospects.</b></a> <span class="muted">· 🎧 1:44</span></li><li><a href="#m05/L5"><b>5.5 Get into the A-pile.</b></a> <span class="muted">· 🎧 1:44</span></li><li><a href="#m05/L6"><b>5.6 First impressions: give the reader&#x27;s eyes a rest.</b></a> <span class="muted">· 🎧 1:27</span></li><li><a href="#m05/L7"><b>5.7 Attention, interest, desire, action: and the nugget notes behind it.</b></a> <span class="muted">· 🎧 1:36</span></li><li><a href="#m05/L8"><b>5.8 Copy the great ads. Use small words and short sentences.</b></a> <span class="muted">· 🎧 1:20</span></li><li><a href="#m05/L9"><b>5.9 Make a proposition, and give the reason why.</b></a> <span class="muted">· 🎧 1:27</span></li><li><a href="#m05/L10"><b>5.10 Find the market first, then make it believable with specifics.</b></a> <span class="muted">· 🎧 1:25</span></li></ol><div class="gl-sub">Read the original</div><ul class="readl"><li><a href="https://www.thegaryhalbertletter.com/Boron/BoronLetterCh1.htm" target="_blank" rel="noopener">The Boron Letters, free on thegaryhalbertletter.com (chapter 1)</a></li><li><a href="https://www.thegaryhalbertletter.com/Boron/TChapter6.htm" target="_blank" rel="noopener">Chapter 6: the starving crowd</a></li></ul><div class="legend"><span class="lg co-example">🏢 Example</span><span class="lg co-agency">🛠️ Use it today</span><span class="lg co-warn">⚠️ Watch out</span></div></section><section class="sec" id="L1" data-sec="1"><header class="sh"><div class="sk">Lesson 5.1<button class="ts" data-t="32.46" title="Play the audio from here">▶ 0:32</button><label class="readchk"><input type="checkbox" data-k="5-1"> Mark as done</label></div><h2 data-t="32.46"><span class="num">5.1</span> <span class="lsay" data-say>Lesson 1.</span> <span data-say>The first lesson isn&#x27;t about copy: look after the machine.</span></h2></header><p data-say data-t="37.76">It surprises people, but the very first letter is about health. Halbert writes on his birthday that he has just managed to jog around the steep hill at the camp without stopping, three weeks after he could barely walk it. Then he tells Bond that the first and most important thing he wants to write about is health and fitness.</p><p data-say data-t="57.22">His prescription is road work: walking, jogging and running, about an hour a day, six days a week, best done right after getting out of bed. Get up, wash, eat a piece of fruit, and get out the door.</p><p data-say data-t="69.66">Why put this first in a course about selling? Because copywriting is mental endurance work. The research, the fast draft and the rewrite all need energy and a clear head. A tired writer settles for the first idea and the vague word. A rested writer keeps going until the specific one turns up.</p><p data-say data-t="91.02">There is also a quieter lesson in how he tells it. He doesn&#x27;t open with a rule. He opens with a small, true, personal story, the hill, and only then gives the advice. That is the same structure he uses in his sales let
